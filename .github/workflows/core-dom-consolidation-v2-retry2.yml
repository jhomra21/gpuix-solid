name: Core DOM consolidation v2 retry2

on:
  push:
    branches:
      - fix/source-first-example-fidelity

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/source-first-example-fidelity
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - name: Apply structural consolidation
        run: |
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          workflow = Path('.github/workflows/core-dom-consolidation-v2.yml').read_text()
          opening = "          python - <<'PY'\n"
          closing = "\n          PY\n"
          start = workflow.index(opening) + len(opening)
          end = workflow.index(closing, start)
          script = dedent(workflow[start:end])

          # Global dispatch already targets the canonical document/window and does not need rewriting.
          block_start = script.index("dispatch_old = '''")
          block_end_marker = "events = events.replace(dispatch_old, dispatch_new, 1)"
          block_end = script.index(block_end_marker, block_start) + len(block_end_marker)
          script = script[:block_start] + script[block_end:]

          # Replace the brittle whole-method matcher with a structural object-literal insertion below.
          doc_start = script.index("create_node_marker = '")
          doc_end_marker = "compat_start = 'function installHostDomCompatibility"
          doc_end = script.index(doc_end_marker, doc_start)
          script = script[:doc_start] + script[doc_end:]

          exec(compile(script, '<core-dom-consolidation-v2>', 'exec'))

          dom_path = Path('packages/solid1/src/dom-environment.ts')
          dom = dom_path.read_text()
          if '  activeBody = bodyTarget\n  activeDocumentNode = bodyTarget\n' not in dom:
            dom = dom.replace(
              '  activeBody = bodyTarget\n',
              '  activeBody = bodyTarget\n  activeDocumentNode = bodyTarget\n',
              1,
            )

          function_start = dom.index('function createDocumentNode(\n')
          function_end = dom.index('\nfunction createCompatElement(', function_start)
          region = dom[function_start:function_end]
          object_close = region.rfind('\n  }\n  return node\n}')
          if object_close < 0:
            raise SystemExit('createDocumentNode object boundary changed')
          if '    focus() {' not in region:
            methods = '''
              focus() {
                activeDocumentNode = node
              },
              blur() {
                if (activeDocumentNode === node) activeDocumentNode = activeBody
              },'''
            region = region[:object_close] + methods + region[object_close:]
            dom = dom[:function_start] + region + dom[function_end:]
          dom_path.write_text(dom)
          PY
      - name: Validate consolidated core and consumers
        run: |
          cd packages/solid1
          bun install --no-save
          bun run test
          bun run typecheck
          cd ../../examples/solid1-kobalte
          bun install --no-save
          bun run typecheck
          cd ../solid1-daw
          bun install --no-save
          bun run typecheck
      - name: Commit validated consolidation
        run: |
          rm -f .github/workflows/core-dom-consolidation-v2.yml
          rm -f .github/workflows/core-dom-consolidation-v2-retry.yml
          rm -f .github/workflows/core-dom-consolidation-v2-retry2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/solid1/src/host/nodes.ts packages/solid/src/host/nodes.ts packages/solid1/src/host/events.ts packages/solid/src/host/events.ts packages/solid1/src/dom-environment.ts packages/solid1/src/web.ts packages/solid1/scripts/check-host-parity.ts .github/workflows/core-dom-consolidation-v2.yml .github/workflows/core-dom-consolidation-v2-retry.yml .github/workflows/core-dom-consolidation-v2-retry2.yml
          git diff --check
          git commit -m "refactor: consolidate DOM semantics in core host"
          git push origin HEAD:fix/source-first-example-fidelity