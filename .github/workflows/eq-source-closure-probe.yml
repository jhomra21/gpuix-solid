name: Probe exact EQ source closure

on:
  push:
    branches:
      - fix/source-first-example-fidelity
    paths:
      - ".github/workflows/eq-source-closure-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/source-first-example-fidelity
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Restore exact pinned EQ source
        shell: bash
        run: |
          set -euo pipefail
          base=https://raw.githubusercontent.com/jhomra21/daw-browser-convex/2eaad47813b15aa8511bab8dc04625510c977b12
          mkdir -p examples/solid1-daw/src/upstream/components/effects
          curl --fail --location --silent --show-error "$base/src/components/effects/Eq.tsx" --output examples/solid1-daw/src/upstream/components/effects/Eq.tsx
          curl --fail --location --silent --show-error "$base/src/components/effects/eq-render-work.ts" --output examples/solid1-daw/src/upstream/components/effects/eq-render-work.ts
          [[ "$(git hash-object examples/solid1-daw/src/upstream/components/effects/Eq.tsx)" == "bb90f5dead1e52fc81c21790c01359b4d8737e98" ]]
          [[ "$(git hash-object examples/solid1-daw/src/upstream/components/effects/eq-render-work.ts)" == "82a4562367f8a6ae379b1a95f317bee2e2548675" ]]
      - name: Add probe-only EQ contracts and style source
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          sources_path = Path('examples/solid1-daw/native-tailwind.sources.json')
          sources = json.loads(sources_path.read_text())
          eq_source = 'src/upstream/components/effects/Eq.tsx'
          if eq_source not in sources:
              sources.insert(sources.index('src/upstream/components/effects/Compressor.tsx'), eq_source)
          sources_path.write_text(json.dumps(sources, indent=2) + '\n')

          shared_path = Path('examples/solid1-daw/src/compat/daw-browser-shared.ts')
          shared = shared_path.read_text()
          marker = '''export type EqBandParams = {
            id: string
            frequency: number
            gainDb: number
            q: number
            enabled: boolean
            type: EqBandType
          }


          export type CompressorDetectorMode'''
          replacement = '''export type EqBandParams = {
            id: string
            frequency: number
            gainDb: number
            q: number
            enabled: boolean
            type: EqBandType
          }

          export type EqChannelMode = "stereo" | "mono"
          export type EqParams = {
            bands: EqBandParams[]
            enabled: boolean
            channelMode: EqChannelMode
          }
          export const EQ_FREQUENCY_MIN = 20
          export const EQ_FREQUENCY_MAX = 20000
          export const EQ_GAIN_DB_MIN = -24
          export const EQ_GAIN_DB_MAX = 24
          export const EQ_Q_MIN = 0.2
          export const EQ_Q_MAX = 18
          const DEFAULT_EQ_FREQUENCIES = [40, 100, 200, 500, 1000, 2500, 6000, 12000]
          const defaultEqBandType = (index: number): EqBandType => index === 0
            ? "lowshelf"
            : index === DEFAULT_EQ_FREQUENCIES.length - 1 ? "highshelf" : "peaking"
          export const createDefaultEqBand = (index: number): EqBandParams => ({
            id: `b${index + 1}`,
            frequency: DEFAULT_EQ_FREQUENCIES[index] ?? 1000,
            gainDb: 0,
            q: 1,
            enabled: true,
            type: defaultEqBandType(index),
          })
          export const createDefaultEqParams = (): EqParams => ({
            bands: DEFAULT_EQ_FREQUENCIES.map((_frequency, index) => createDefaultEqBand(index)),
            enabled: true,
            channelMode: "stereo",
          })
          export const createEqBandParameterId = (
            bandId: string,
            property: "frequencyHz" | "gainDb" | "q",
          ): string => `eq.${bandId}.${property}`
          export const supportsGain = (type: EqBandType): boolean => type === "peaking" || type === "lowshelf" || type === "highshelf"

          export type CompressorDetectorMode'''
          if marker not in shared:
              raise SystemExit('EQ shared-contract anchor missing')
          shared_path.write_text(shared.replace(marker, replacement, 1))

          audio_path = Path('examples/solid1-daw/src/compat/audio-engine.ts')
          audio = audio_path.read_text()
          if 'export type SpectrumFrame' not in audio:
              audio = '''export type SpectrumFrame = {
            data: Float32Array
            sampleRate: number
          }

          ''' + audio
          audio_path.write_text(audio)

          generator_path = Path('examples/solid1-daw/scripts/generate-native-tailwind.mjs')
          generator = generator_path.read_text()
          anchor = 'const nativeCompatEntries = new Map([\n'
          if anchor not in generator:
              raise SystemExit('native compat map anchor missing')
          generator_path.write_text(generator.replace(
              anchor,
              anchor + '  ["row-span-2", { base: {} }], // probe only: reveal blockers beyond unsupported native grid span\n',
              1,
          ))
          PY
      - run: bun install --frozen-lockfile
      - name: Run exact EQ through normal DAW validation path
        run: bun run solid1:daw
