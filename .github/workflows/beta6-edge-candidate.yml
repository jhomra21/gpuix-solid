name: Beta 6 GPUIX main candidate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  patched-main-macos:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'test/beta6-gpuix-main'
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - name: Build patched GPUIX main and run source-edge compatibility
        run: node scripts/test-beta6-gpuix-main.mjs check
      - name: Show exact candidate status
        run: node scripts/test-beta6-gpuix-main.mjs status
