name: Apply DAW sidebar contracts retry5

on:
  push:
    branches:
      - fix/source-first-example-fidelity
    paths:
      - .github/workflows/apply-daw-sidebar-contracts-retry5.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/source-first-example-fidelity
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - name: Reapply source contract and context-menu fix
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess

          workflow = Path('.github/workflows/apply-daw-sidebar-contracts-retry4.yml').read_text().splitlines()
          target = 'Reapply source contract and context-menu fix'
          current = None
          collecting = False
          lines = []
          for line in workflow:
              if line.startswith('      - name: '):
                  if current == target and lines:
                      break
                  current = line.split(': ', 1)[1]
                  collecting = False
                  continue
              if current == target and line == '        run: |':
                  collecting = True
                  continue
              if collecting:
                  if line.startswith('      - '):
                      break
                  lines.append(line[10:] if line.startswith('          ') else line)
          if not lines:
              raise SystemExit('failed to recover source/context transformation')
          subprocess.run(['bash', '-euo', 'pipefail', '-c', '\n'.join(lines) + '\n'], check=True)
          PY
      - name: Match upstream track kind model
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          path = Path('examples/solid1-daw/src/compat/timeline-core-types.ts')
          text = path.read_text()
          text, count = re.subn(
              r'kind:\s*"audio"\s*\|\s*"instrument"\s*\|\s*"return"\s*\|\s*"group"\s*\n\s*channelRole:\s*TrackChannelRole',
              'kind?: "audio" | "instrument"\n  channelRole?: TrackChannelRole',
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit('compat Track kind declaration not found')
          path.write_text(text)
          PY
      - name: Validate source, host, Kobalte, and DAW types
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          cd packages/solid1
          bun install --no-save
          bun run typecheck
          bun run test
          bun run build
          cd ../../examples/solid1-kobalte
          bun install --no-save
          bun run typecheck
          cd ../solid1-daw
          bun install --no-save
          bun run source:check
          bun run generate:styles
          bunx tsc --noEmit
          bun run source:check
      - name: Commit validated contracts
        run: |
          set -euo pipefail
          rm -f .github/workflows/diagnose-daw-compat.yml
          rm -f .github/workflows/apply-daw-sidebar-contracts.yml
          rm -f .github/workflows/apply-daw-sidebar-contracts-retry.yml
          rm -f .github/workflows/apply-daw-sidebar-contracts-retry2.yml
          rm -f .github/workflows/apply-daw-sidebar-contracts-retry3.yml
          rm -f .github/workflows/apply-daw-sidebar-contracts-retry4.yml
          rm -f .github/workflows/apply-daw-sidebar-contracts-retry5.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "refactor: source-lock DAW sidebar contracts"
          git push origin HEAD:fix/source-first-example-fidelity
