name: Apply GPUIX 0.7 Solid 1 compatibility cleanup

on:
  push:
    branches:
      - fix/source-first-example-fidelity

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/source-first-example-fidelity
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - name: Apply compatibility patch
        run: python scripts/apply-gpuix07-solid1-compat.py
      - name: Verify focused files
        run: |
          node scripts/check-gpuix-native-version.mjs
          cd packages/solid1
          bun install --no-save
          bun run build
          node scripts/validate-package.mjs
          cd ../../examples/solid1-daw
          bun install --no-save
          bun run typecheck
      - name: Remove temporary patch machinery
        run: |
          rm .github/workflows/apply-gpuix07-solid1-compat.yml
          rm scripts/apply-gpuix07-solid1-compat.py
      - name: Commit compatibility fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/solid1/scripts/validate-package.mjs packages/solid1/src/native-style.ts packages/solid1/src/kobalte/dropdown-menu.tsx examples/solid1-daw/scripts/generate-native-tailwind.mjs .github/workflows/apply-gpuix07-solid1-compat.yml scripts/apply-gpuix07-solid1-compat.py
          git commit -m 'fix: preserve source focus styles on GPUIX 0.7'
          git push origin HEAD:fix/source-first-example-fidelity
