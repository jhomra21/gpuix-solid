name: Fix DAW visual fidelity compatibility

on:
  workflow_dispatch:
  push:
    branches:
      - fix/source-first-example-fidelity
    paths:
      - .github/fix-daw-visual-fidelity.py
      - .github/workflows/fix-daw-visual-fidelity.yml

permissions:
  contents: write

jobs:
  validate-and-promote:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/source-first-example-fidelity
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Apply source-first visual compatibility fixes
        run: python3 .github/fix-daw-visual-fidelity.py

      - name: Install
        run: bun install --frozen-lockfile

      - name: Validate compatibility and DAW geometry
        run: |
          bun run lint
          bun run typecheck
          bun run test
          bun run build
          bun run solid1:package
          bun run solid1:daw
          git diff --check

      - name: Promote clean product changes
        run: |
          rm .github/fix-daw-visual-fidelity.py
          rm .github/workflows/fix-daw-visual-fidelity.yml
          git add packages/solid/src/host/nodes.ts \
                  packages/solid/src/native-style.ts \
                  packages/solid1/src/host/nodes.ts \
                  packages/solid1/src/native-style.ts \
                  packages/solid1/src/universal.ts \
                  packages/solid1/scripts/check-host-parity.ts \
                  examples/solid1-daw/src/test.tsx \
                  .github/fix-daw-visual-fidelity.py \
                  .github/workflows/fix-daw-visual-fidelity.yml
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "fix: align native DAW control geometry"
          git push origin HEAD:fix/source-first-example-fidelity
