name: Solid RC8 Lock

on:
  push:
    branches:
      - chore/solid-idioms-docs

permissions:
  contents: write

jobs:
  lockfile:
    if: github.event.head_commit.message != 'chore: refresh Solid rc8 lockfile'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Regenerate workspace lockfile
        run: bun install --lockfile-only
      - name: Commit generated lockfile
        shell: bash
        run: |
          if git diff --quiet -- bun.lock; then
            echo "bun.lock already matches the manifests"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          git commit -m "chore: refresh Solid rc8 lockfile"
          git push origin HEAD:chore/solid-idioms-docs
