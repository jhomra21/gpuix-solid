name: Source-first DAW debug

on:
  pull_request:
    paths:
      - ".github/workflows/source-first-daw-debug.yml"
      - "examples/solid1-daw/**"
      - "packages/solid1/**"

permissions:
  contents: read

jobs:
  daw:
    name: daw-debug (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Install GPUI Linux runtime dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfontconfig-dev \
            libwayland-dev \
            libxkbcommon-x11-dev \
            libx11-xcb-dev \
            libssl-dev \
            libzstd-dev \
            libvulkan1 \
            vulkan-validationlayers
      - run: bun install --frozen-lockfile
      - name: Probe audited automation shadow omission
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("examples/solid1-daw/scripts/generate-native-tailwind.mjs")
          text = path.read_text()
          anchor = '  ["shadow-black/50", "this only recolors the copied automation picker shadow-xl; GPUIX 0.7 cannot represent that layered source shadow exactly"],\n'
          replacement = anchor + '  ["shadow-black/30", "this only recolors the copied automation lane readout shadow-lg; GPUIX 0.7 cannot represent that layered source shadow exactly"],\n'
          if anchor not in text:
              raise SystemExit("shadow omission anchor missing")
          path.write_text(text.replace(anchor, replacement, 1))
          PY
      - name: Capture DAW validation
        shell: bash
        run: |
          set +e
          bun run solid1:daw > "$RUNNER_TEMP/solid1-daw.log" 2>&1
          status=$?
          cat "$RUNNER_TEMP/solid1-daw.log"
          printf '%s\n' "$status" > "$RUNNER_TEMP/solid1-daw.status"
          exit "$status"
      - name: Upload DAW debug output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: solid1-daw-debug-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/solid1-daw.log
            ${{ runner.temp }}/solid1-daw.status
          if-no-files-found: error
