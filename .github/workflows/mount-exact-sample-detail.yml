name: Mount exact Sample Detail

on:
  push:
    branches:
      - fix/source-first-example-fidelity
    paths:
      - .github/mount-exact-sample-detail.py
      - .github/mount-exact-sample-detail-order-fix.py
      - .github/mount-exact-sample-detail-dataset-fix.py
      - .github/mount-exact-sample-detail-resize-fix.py
      - .github/mount-exact-sample-detail-resize-test-fix.py
      - .github/mount-exact-sample-detail-signal-fix.py
      - .github/mount-exact-sample-detail-label-fix.py
      - .github/mount-exact-sample-detail-checkbox-fix.py
      - .github/mount-exact-sample-detail-checkbox-test-fix.py
      - .github/mount-exact-sample-detail-select-fix.py
      - .github/mount-exact-sample-detail-async-test-fix.py
      - .github/mount-exact-sample-detail-range-preflight.py
      - .github/mount-exact-sample-detail-range-fix.py
      - .github/mount-exact-sample-detail-range-native-fix.py
      - .github/mount-exact-sample-detail-range-layout-test.py
      - .github/mount-exact-sample-detail-range-hit-trace.py
      - .github/mount-exact-sample-detail-inline-flow-fix.py
      - .github/workflows/mount-exact-sample-detail.yml

permissions:
  contents: write

jobs:
  mount:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - name: Mount exact Sample Detail
        run: |
          python3 .github/mount-exact-sample-detail.py
          python3 .github/mount-exact-sample-detail-order-fix.py
          python3 .github/mount-exact-sample-detail-dataset-fix.py
          python3 .github/mount-exact-sample-detail-resize-fix.py
          python3 .github/mount-exact-sample-detail-resize-test-fix.py
          python3 .github/mount-exact-sample-detail-signal-fix.py
          python3 .github/mount-exact-sample-detail-label-fix.py
          python3 .github/mount-exact-sample-detail-checkbox-fix.py
          python3 .github/mount-exact-sample-detail-checkbox-test-fix.py
          python3 .github/mount-exact-sample-detail-select-fix.py
          python3 .github/mount-exact-sample-detail-async-test-fix.py
          python3 .github/mount-exact-sample-detail-range-preflight.py
          python3 .github/mount-exact-sample-detail-range-fix.py
          python3 .github/mount-exact-sample-detail-range-native-fix.py
          python3 .github/mount-exact-sample-detail-range-layout-test.py
          python3 .github/mount-exact-sample-detail-range-hit-trace.py
          python3 .github/mount-exact-sample-detail-inline-flow-fix.py
      - name: Install
        run: bun install --frozen-lockfile
      - name: Build Solid1 once for DAW
        run: |
          cd packages/solid1
          bun install --no-save
          bun run build
      - name: Validate exact DAW mount
        run: |
          cd examples/solid1-daw
          bun install --no-save
          bun run source:check
          bun run generate:styles
          ./node_modules/.bin/tsc --noEmit
          ./node_modules/.bin/vite build --config vite.test.config.ts
          bun scripts/run-test.mjs
      - name: Validate repository
        run: |
          bun run lint
          bun run typecheck
          bun run test
          bun run build
      - name: Validate Solid1 host consumers
        run: |
          bun run solid1:package
          bun run solid1:kobalte
          bun run solid1:blurred-window
          bun run solid1:tailwind
      - name: Check patch
        run: git diff --check
      - name: Commit validated mount
        run: |
          rm .github/mount-exact-sample-detail.py .github/mount-exact-sample-detail-order-fix.py .github/mount-exact-sample-detail-dataset-fix.py .github/mount-exact-sample-detail-resize-fix.py .github/mount-exact-sample-detail-resize-test-fix.py .github/mount-exact-sample-detail-signal-fix.py .github/mount-exact-sample-detail-label-fix.py .github/mount-exact-sample-detail-checkbox-fix.py .github/mount-exact-sample-detail-checkbox-test-fix.py .github/mount-exact-sample-detail-select-fix.py .github/mount-exact-sample-detail-async-test-fix.py .github/mount-exact-sample-detail-range-preflight.py .github/mount-exact-sample-detail-range-fix.py .github/mount-exact-sample-detail-range-native-fix.py .github/mount-exact-sample-detail-range-layout-test.py .github/mount-exact-sample-detail-range-hit-trace.py .github/mount-exact-sample-detail-inline-flow-fix.py .github/workflows/mount-exact-sample-detail.yml
          git add -A
          test -n "$(git status --porcelain)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat: mount exact Sample Detail UI"
          git push origin HEAD:fix/source-first-example-fidelity
