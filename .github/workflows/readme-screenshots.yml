name: README Screenshots

on:
  push:
    branches:
      - docs/gpuix-080-app-building
    paths:
      - ".github/workflows/readme-screenshots.yml"
      - "examples/counter/src/gpuix-08/**"
      - "examples/counter/src/dashboard/**"
      - "examples/counter/src/codeimage/**"
      - "examples/counter/src/todo/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.ref_name }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14

      - name: Install native display dependencies
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.sources
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb \
            xdotool \
            imagemagick \
            libfontconfig-dev \
            libwayland-dev \
            libwayland-client0 \
            libwayland-cursor0 \
            libxkbcommon-x11-dev \
            libxcb-xkb1 \
            libx11-xcb-dev \
            libegl1 \
            libgl1-mesa-dri \
            libvulkan1 \
            mesa-vulkan-drivers

      - run: bun install --frozen-lockfile

      - name: Build screenshot targets
        run: |
          bun run --filter 'gpuix-solid' build
          bun run --filter 'gpuix-solid-counter' build:gpuix-08
          bun run --filter 'gpuix-solid-counter' build:dashboard
          bun run --filter 'gpuix-solid-counter' build:codeimage
          bun run --filter 'gpuix-solid-counter' build:todo

      - name: Capture Solid-rendered native windows
        shell: bash
        env:
          DISPLAY: :99
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          set -euo pipefail
          mkdir -p docs/images logs
          Xvfb :99 -screen 0 1600x1100x24 -nolisten tcp >logs/xvfb.log 2>&1 &
          xvfb_pid=$!
          trap 'kill "$xvfb_pid" 2>/dev/null || true' EXIT
          sleep 2

          capture() {
            local title="$1"
            local command="$2"
            local output="$3"
            local log="$4"

            bash -lc "$command" >"logs/$log" 2>&1 &
            local app_pid=$!
            local window=""

            for _ in $(seq 1 40); do
              window=$(xdotool search --onlyvisible --name "$title" 2>/dev/null | tail -n 1 || true)
              if [ -n "$window" ]; then
                break
              fi
              if ! kill -0 "$app_pid" 2>/dev/null; then
                echo "Application exited before its window appeared: $title"
                cat "logs/$log"
                return 1
              fi
              sleep 1
            done

            if [ -z "$window" ]; then
              echo "Could not find visible window: $title"
              cat "logs/$log"
              kill "$app_pid" 2>/dev/null || true
              wait "$app_pid" 2>/dev/null || true
              return 1
            fi

            xdotool windowraise "$window" 2>/dev/null || true
            sleep 4
            import -display "$DISPLAY" -window "$window" "docs/images/$output"
            identify "docs/images/$output"

            kill "$app_pid" 2>/dev/null || true
            wait "$app_pid" 2>/dev/null || true
          }

          capture \
            "GPUix Solid · GPUIX 0.8" \
            "bun run --filter 'gpuix-solid-counter' start:gpuix-08" \
            "gpuix-08.png" \
            "gpuix-08.log"

          capture \
            "GPUix Solid Dashboard" \
            "bun run --filter 'gpuix-solid-counter' start:dashboard" \
            "dashboard.png" \
            "dashboard.log"

          capture \
            "CodeImage Native — Solid 2 + GPUIX" \
            "bun run --filter 'gpuix-solid-counter' start:codeimage" \
            "codeimage.png" \
            "codeimage.log"

          capture \
            "Todo" \
            "bun run --filter 'gpuix-solid-counter' start:todo" \
            "todo.png" \
            "todo.log"

          montage \
            docs/images/gpuix-08.png \
            docs/images/dashboard.png \
            docs/images/codeimage.png \
            docs/images/todo.png \
            -tile 2x2 -geometry '760x520+18+18' -background '#111111' \
            docs/images/gallery.png
          identify docs/images/gallery.png

      - name: Upload capture evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: readme-native-screenshots
          path: |
            docs/images/*.png
            logs
          if-no-files-found: warn

      - name: Commit generated screenshots to the docs branch
        if: github.event_name == 'push' && github.ref_name == 'docs/gpuix-080-app-building'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git add docs/images/*.png
          if git diff --cached --quiet; then
            echo "Screenshots are already current."
            exit 0
          fi
          git commit -m "docs: refresh Solid native README screenshots"
          git push origin "HEAD:${GITHUB_REF_NAME}"
