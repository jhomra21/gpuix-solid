name: README Screenshots

on:
  push:
    branches:
      - docs/gpuix-080-app-building
    paths:
      - ".github/workflows/readme-screenshots.yml"
      - "examples/counter/package.json"
      - "examples/counter/vite.readme-gallery.config.ts"
      - "examples/counter/src/readme-gallery/**"
      - "examples/counter/src/gpuix-08/**"
      - "examples/counter/src/dashboard/**"
      - "examples/counter/src/codeimage/**"
      - "examples/counter/src/todo/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: readme-screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.ref_name }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14

      - name: Install GPUI Linux runtime dependencies
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.sources
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfontconfig-dev \
            libwayland-dev \
            libxkbcommon-x11-dev \
            libx11-xcb-dev \
            libssl-dev \
            libzstd-dev \
            libvulkan1 \
            vulkan-validationlayers

      - run: bun install --frozen-lockfile

      - name: Build Solid host
        run: bun run --filter 'gpuix-solid' build

      - name: Capture native retained-tree gallery
        run: bun run --filter 'gpuix-solid-counter' capture:readme-gallery

      - name: Validate generated PNGs
        shell: bash
        run: |
          set -euo pipefail
          for image in gpuix-08 dashboard codeimage todo; do
            test -s "docs/images/${image}.png"
            file "docs/images/${image}.png"
            sha256sum "docs/images/${image}.png"
          done

      - name: Upload capture evidence
        uses: actions/upload-artifact@v4
        with:
          name: readme-native-retained-tree-screenshots
          path: docs/images/*.png
          if-no-files-found: error

      - name: Commit generated screenshots to the docs branch
        if: github.event_name == 'push' && github.ref_name == 'docs/gpuix-080-app-building'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git add docs/images/*.png
          if git diff --cached --quiet; then
            echo "Screenshots are already current."
            exit 0
          fi
          git commit -m "docs: refresh Solid native README screenshots"
          git push origin "HEAD:${GITHUB_REF_NAME}"
