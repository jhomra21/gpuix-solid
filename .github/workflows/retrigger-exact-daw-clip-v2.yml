name: Retrigger exact DAW clip closure

on:
  push:
    branches:
      - fix/source-first-example-fidelity
    paths:
      - .github/workflows/retrigger-exact-daw-clip-v2.yml

permissions:
  contents: write

jobs:
  retrigger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/source-first-example-fidelity
      - name: Retrigger validated closure workflow
        run: |
          set -euo pipefail
          printf '\n# retrigger after exact SourceTrackSidebar typing\n' >> .github/workflows/fix-exact-daw-clip-closure-v2.yml
          rm -f .github/workflows/retrigger-exact-daw-clip-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "ci: rerun exact DAW clip closure"
          git push origin HEAD:fix/source-first-example-fidelity
