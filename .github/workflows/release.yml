name: Publish Package

on:
  workflow_dispatch:
    inputs:
      tag:
        description: npm dist-tag
        required: true
        default: beta
        type: choice
        options:
          - beta
          - latest

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
      - name: Pin npm publishing client
        run: npm install --global npm@11.19.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Require main
        run: test "$GITHUB_REF_NAME" = "main"
      - run: bun install --frozen-lockfile
      - run: bun run release:check
      - name: Validate release version
        env:
          DIST_TAG: ${{ inputs.tag }}
        run: |
          version=$(node -p "require('./packages/solid/package.json').version")
          if [ "$version" = "0.0.0" ]; then
            echo "Refusing to publish placeholder version 0.0.0."
            exit 1
          fi

          case "$DIST_TAG" in
            beta)
              if [[ "$version" != *-* ]]; then
                echo "beta publishes require a prerelease version; got $version"
                exit 1
              fi
              ;;
            latest)
              if [[ "$version" == *-* ]]; then
                echo "latest publishes require a stable version; got $version"
                exit 1
              fi
              ;;
          esac

          if npm view "@jhomra21/gpuix-solid@$version" version >/dev/null 2>&1; then
            echo "@jhomra21/gpuix-solid@$version already exists on npm."
            exit 1
          fi
      - name: Inspect package tarball
        working-directory: packages/solid
        run: npm pack --dry-run
      - name: Publish to npm
        working-directory: packages/solid
        env:
          DIST_TAG: ${{ inputs.tag }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_BOOTSTRAP_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
        run: npm publish --access public --tag "$DIST_TAG" --provenance
