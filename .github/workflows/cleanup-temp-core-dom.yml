name: Cleanup temporary core DOM workflows

on:
  push:
    branches:
      - fix/source-first-example-fidelity

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/source-first-example-fidelity
          fetch-depth: 0
      - name: Remove temporary workflows
        run: |
          rm -f .github/workflows/core-dom-consolidation-v2.yml
          rm -f .github/workflows/core-dom-consolidation-v2-retry.yml
          rm -f .github/workflows/core-dom-consolidation-v2-retry2.yml
          rm -f .github/workflows/core-dom-consolidation-v2-retry3.yml
          rm -f .github/workflows/core-dom-consolidation-v2-retry4.yml
          rm -f .github/workflows/core-dom-consolidation-v2-retry5.yml
          rm -f .github/workflows/cleanup-temp-core-dom.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows
          git commit -m "chore: remove temporary core DOM workflows"
          git push origin HEAD:fix/source-first-example-fidelity