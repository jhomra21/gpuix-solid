name: Disposable DAW retained-render probe

on:
  pull_request:

permissions:
  contents: read

jobs:
  compare:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Check out candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          persist-credentials: false

      - name: Check out certified local-test baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ff45cc2a3dbcb6b3400990d3e51d876594805a42
          path: baseline
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Measure candidate
        working-directory: candidate
        run: |
          bun install --frozen-lockfile
          echo "=== candidate runtime 1a5b9e6cfa72471b188465b3b95613bf603e1217 ==="
          bun run solid1:package
          cp examples/solid1-daw/src/perf-retained-probe.tsx examples/solid1-daw/src/test-entry.tsx
          cd examples/solid1-daw
          bun install --no-save
          bun run build:test
          bun dist/test/test.js

      - name: Measure ff45 baseline with identical probe
        working-directory: baseline
        run: |
          cp ../candidate/examples/solid1-daw/src/perf-retained-probe.tsx examples/solid1-daw/src/test-entry.tsx
          bun install --frozen-lockfile
          echo "=== baseline runtime $(git rev-parse HEAD) ==="
          bun run solid1:package
          cd examples/solid1-daw
          bun install --no-save
          bun run build:test
          bun dist/test/test.js
