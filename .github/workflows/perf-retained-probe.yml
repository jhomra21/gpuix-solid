name: Disposable DAW retained-render probe

on:
  pull_request:

permissions:
  contents: read

jobs:
  compare:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Check out probe source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: probe
          persist-credentials: false

      - name: Check out certified production
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 759ee496fd8f1dcf92e8e7ac338da2b782ebd70b
          path: production
          persist-credentials: false

      - name: Check out pre-fix baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ff45cc2a3dbcb6b3400990d3e51d876594805a42
          path: baseline
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Prepare certified production
        working-directory: production
        run: |
          cp ../probe/examples/solid1-daw/src/perf-retained-probe.tsx examples/solid1-daw/src/test-entry.tsx
          bun install --frozen-lockfile
          echo "=== prepare production $(git rev-parse HEAD) ==="
          bun run solid1:package
          cd examples/solid1-daw
          bun install --no-save
          bun run build:test

      - name: Prepare pre-fix baseline with identical probe
        working-directory: baseline
        run: |
          cp ../probe/examples/solid1-daw/src/perf-retained-probe.tsx examples/solid1-daw/src/test-entry.tsx
          bun install --frozen-lockfile
          echo "=== prepare baseline $(git rev-parse HEAD) ==="
          bun run solid1:package
          cd examples/solid1-daw
          bun install --no-save
          bun run build:test

      - name: Measure production A1
        working-directory: production/examples/solid1-daw
        run: |
          echo "=== production A1 ==="
          bun dist/test/test.js

      - name: Measure baseline B1
        working-directory: baseline/examples/solid1-daw
        run: |
          echo "=== baseline B1 ==="
          bun dist/test/test.js

      - name: Measure baseline B2
        working-directory: baseline/examples/solid1-daw
        run: |
          echo "=== baseline B2 ==="
          bun dist/test/test.js

      - name: Measure production A2
        working-directory: production/examples/solid1-daw
        run: |
          echo "=== production A2 ==="
          bun dist/test/test.js
