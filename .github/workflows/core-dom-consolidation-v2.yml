name: Core DOM consolidation v2

on:
  push:
    branches:
      - fix/source-first-example-fidelity

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/source-first-example-fidelity
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - name: Consolidate DOM semantics into core host
        run: |
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent, indent

          root = Path.cwd()

          def replace_region(source: str, start_marker: str, end_marker: str, replacement: str) -> str:
            if source.count(start_marker) != 1 or source.count(end_marker) != 1:
              raise SystemExit(f"region markers changed: {start_marker!r} -> {end_marker!r}")
            start = source.index(start_marker)
            end = source.index(end_marker, start)
            return source[:start] + replacement + source[end:]

          # --- host/nodes.ts ---
          nodes_path = root / "packages/solid1/src/host/nodes.ts"
          nodes = nodes_path.read_text()

          global_marker = 'const customStyleProperties = new WeakMap<HostElementNode, Map<string, string>>()\n'
          if nodes.count(global_marker) != 1:
            raise SystemExit("customStyleProperties marker changed")
          nodes = nodes.replace(
            global_marker,
            global_marker + dedent('''\
            const connectedHostRoots = new Set<HostElementNode>()
            let activeHostElement: HostElementNode | null = null
            let globalPointerDownObservation = false
            '''),
            1,
          )

          class_start = '  readonly classList = {\n'
          class_end = '  readonly #eventListeners'
          class_index = nodes.index(class_start)
          class_end_index = nodes.index(class_end, class_index)
          nodes = nodes[:class_index] + '  readonly classList: HostClassList\n' + nodes[class_end_index:]

          ctor_marker = '    this.style = createHostStyleDeclaration(this, {})\n'
          if nodes.count(ctor_marker) != 1:
            raise SystemExit("constructor marker changed")
          nodes = nodes.replace(
            ctor_marker,
            ctor_marker + '    this.classList = createHostClassList(this)\n',
            1,
          )
          nodes = nodes.replace('    this.localName = tagName\n', '    this.localName = tagName.toLowerCase()\n', 1)
          nodes = nodes.replace('    this.tagName = tagName.toUpperCase()\n', '    this.tagName = this.localName.toUpperCase()\n', 1)

          focus_block = dedent('''\
          focus(): void {
            const root = this.root
            if (!root || !this.nativeAlive) return
            activeHostElement = this
            root.driver.enqueue("setEventListener", this.id, "keyDown", true)
            root.driver.enqueue("setEventListener", this.id, "keyUp", true)
            root.driver.flush()
            root.driver.renderer.focusElement?.(this.id)
          }

          blur(): void {
            const root = this.root
            if (!root || !this.nativeAlive) return
            if (activeHostElement === this) activeHostElement = null
            root.driver.flush()
            root.driver.renderer.blur?.()
          }

          ''')
          focus_block = indent(focus_block, '  ')
          nodes = replace_region(nodes, '  focus(): void {\n', '  select(): void {\n', focus_block)

          semantic_index = nodes.index('compareDocumentPosition(other: HostElementNode): number {')
          semantic_start = nodes.rfind('\n', 0, semantic_index) + 1
          semantic_end = nodes.index('  getBoundingClientRect(): {\n', semantic_index)
          semantic_block = dedent('''\
          compareDocumentPosition(other: HostElementNode): number {
            return compareHostDocumentPosition(this, other)
          }

          get dataset(): Record<string, string> {
            const dataset: Record<string, string> = {}
            for (const [name, value] of this.props) {
              if (!name.startsWith("data-") || value === null || value === undefined) continue
              dataset[dataAttributeProperty(name.slice(5))] = String(value)
            }
            return dataset
          }

          get className(): string {
            return String(this.props.get("className") ?? "")
          }

          set className(value: string) {
            setHostProperty(this, "className", value)
          }

          get tabIndex(): number {
            const value = this.props.get("tabIndex")
            if (value === null || value === undefined) return -1
            const parsed = Number(value)
            return Number.isFinite(parsed) ? parsed : -1
          }

          set tabIndex(value: number) {
            setHostProperty(this, "tabIndex", value)
          }

          getAttribute(name: string): string | null {
            const value = this.props.get(name)
            return value === null || value === undefined ? null : String(value)
          }

          hasAttribute(name: string): boolean {
            return this.props.has(name)
          }

          setAttribute(name: string, value: string): void {
            setHostProperty(this, name, String(value))
          }

          removeAttribute(name: string): void {
            setHostProperty(this, name, undefined)
          }

          contains(other: HostElementNode | null): boolean {
            if (!other) return false
            let current: HostElementNode | null = other
            while (current) {
              if (current === this) return true
              current = current.parentElement
            }
            return false
          }

          matches(selector: string): boolean {
            return selector.split(",").some((candidate) => matchesSimpleSelector(this, candidate.trim()))
          }

          closest(selector: string): HostElementNode | null {
            let current: HostElementNode | null = this
            while (current) {
              if (current.matches(selector)) return current
              current = current.parentElement
            }
            return null
          }

          querySelector(selector: string): HostElementNode | null {
            return this.querySelectorAll(selector)[0] ?? null
          }

          querySelectorAll(selector: string): HostElementNode[] {
            return hostDescendants(this).filter((candidate) => candidate.matches(selector))
          }

          insertAdjacentElement(position: string, element: HostElementNode): HostElementNode | null {
            if (position === "afterbegin") {
              insertHostNode(this, element, this.children[0] ?? null)
              return element
            }
            if (position === "beforeend") {
              insertHostNode(this, element)
              return element
            }
            return null
          }

          remove(): void {
            const parent = this.parent
            if (parent) removeHostNode(parent, this)
          }

          addEventListener(
            type: string,
            listener: EventListenerOrEventListenerObject | null,
          ): void {
            if (!listener) return
            const listeners = this.#eventListeners.get(type) ?? new Set<EventListenerOrEventListenerObject>()
            listeners.add(listener)
            this.#eventListeners.set(type, listeners)
          }

          removeEventListener(
            type: string,
            listener: EventListenerOrEventListenerObject | null,
          ): void {
            if (!listener) return
            const listeners = this.#eventListeners.get(type)
            listeners?.delete(listener)
            if (listeners?.size === 0) this.#eventListeners.delete(type)
          }

          dispatchEvent(event: Event): boolean {
            if (event.target === null) {
              Object.defineProperty(event, "target", { configurable: true, value: this })
            }
            Object.defineProperty(event, "currentTarget", { configurable: true, value: this })
            for (const listener of [...(this.#eventListeners.get(event.type) ?? [])]) {
              if (typeof listener === "function") listener.call(this, event)
              else listener.handleEvent(event)
            }
            return !event.defaultPrevented
          }

          ''')
          nodes = nodes[:semantic_start] + indent(semantic_block, '  ') + nodes[semantic_end:]

          # Event props share one native transport without overwriting one another.
          event_start = '  const eventType = EVENT_PROP_TO_TYPE.get(name)\n'
          event_end = '  if (value === undefined) node.props.delete(name)\n'
          event_block = dedent('''\
          const eventType = EVENT_PROP_TO_TYPE.get(name)
          if (eventType) {
            const nativeEventType = nativeEventTypeForDomEvent(eventType)
            const hadNativeHandler = nativeEventType ? hasNativeEventHandler(node, nativeEventType) : false
            const hadTransport = nativeEventType
              ? hadNativeHandler || (nativeEventType === "mouseDown" && globalPointerDownObservation)
              : false
            const handler = isHostEventHandler(value) ? value : undefined
            if (handler) node.events.set(eventType, handler)
            else node.events.delete(eventType)

            if (!node.root || !node.nativeAlive) return
            if (handler) node.root.events.set(node.id, eventType, handler)
            else node.root.events.delete(node.id, eventType)

            if (nativeEventType) {
              const hasNativeHandler = hasNativeEventHandler(node, nativeEventType)
              const hasTransport = hasNativeHandler || (nativeEventType === "mouseDown" && globalPointerDownObservation)
              if (hadTransport !== hasTransport) {
                node.root.driver.enqueue("setEventListener", node.id, nativeEventType, hasTransport)
              }
            }
            return
          }

          ''')
          nodes = replace_region(nodes, event_start, event_end, indent(event_block, '  '))

          # Root registration is intrinsic to host tree insertion/removal.
          insert_start = '  const oldParent = node.parent\n'
          insert_end = '  if (!root) return\n'
          insert_block = dedent('''\
          const oldParent = node.parent
          if (oldParent) {
            if (oldParent.kind === "root" && node.kind === "element") connectedHostRoots.delete(node)
            removeFromChildren(oldParent, node)
          }

          const index = anchor ? parent.children.indexOf(anchor) : parent.children.length
          parent.children.splice(index, 0, node)
          node.parent = parent
          if (parent.kind === "root" && node.kind === "element") connectedHostRoots.add(node)

          ''')
          nodes = replace_region(nodes, insert_start, insert_end, indent(insert_block, '  '))

          remove_marker = '  removeFromChildren(parent, node)\n  node.parent = null\n'
          if nodes.count(remove_marker) != 1:
            raise SystemExit("removeHostNode marker changed")
          nodes = nodes.replace(
            remove_marker,
            '  removeFromChildren(parent, node)\n'
            '  if (parent.kind === "root" && node.kind === "element") connectedHostRoots.delete(node)\n'
            '  node.parent = null\n',
            1,
          )

          selector_start = 'function matchesSimpleSelector(node: HostElementNode, selector: string): boolean {\n'
          selector_end = 'function compareHostDocumentPosition(reference: HostNode, other: HostNode): number {\n'
          helpers = dedent(r'''\
          function matchesSimpleSelector(node: HostElementNode, selector: string): boolean {
            if (!selector) return false
            if (selector === "*") return true

            const attributes = [...selector.matchAll(/\[([A-Za-z_:][\w:.-]*)(?:=(['"]?)(.*?)\2)?\]/g)]
            for (const attribute of attributes) {
              const name = attribute[1]
              if (!name || !node.hasAttribute(name)) return false
              const expected = attribute[3]
              if (expected !== undefined && node.getAttribute(name) !== expected) return false
            }

            let remainder = selector.replace(/\[[^\]]+\]/g, "")
            const id = remainder.match(/#([A-Za-z_][\w-]*)/)
            if (id?.[1] && node.getAttribute("id") !== id[1]) return false
            remainder = remainder.replace(/#[A-Za-z_][\w-]*/g, "")

            const classes = [...remainder.matchAll(/\.([A-Za-z_][\w-]*)/g)].map((match) => match[1])
            if (classes.some((className) => !className || !node.classList.contains(className))) return false
            remainder = remainder.replace(/\.[A-Za-z_][\w-]*/g, "").trim()

            return remainder === "" || (/^[A-Za-z][A-Za-z0-9-]*$/.test(remainder) && node.localName === remainder.toLowerCase())
          }

          function hostDescendants(root: HostElementNode): HostElementNode[] {
            const descendants: HostElementNode[] = []
            const pending = root.children.filter((child): child is HostElementNode => child.kind === "element").reverse()
            while (pending.length > 0) {
              const current = pending.pop()
              if (!current) continue
              descendants.push(current)
              const children = current.children.filter((child): child is HostElementNode => child.kind === "element")
              for (let index = children.length - 1; index >= 0; index -= 1) pending.push(children[index]!)
            }
            return descendants
          }

          type HostClassList = {
            add(...tokens: string[]): void
            remove(...tokens: string[]): void
            contains(token: string): boolean
            toggle(token: string, force?: boolean): boolean
            toString(): string
          }

          function createHostClassList(node: HostElementNode): HostClassList {
            const read = () => new Set(node.className.split(/\s+/).filter(Boolean))
            const write = (tokens: Set<string>) => { node.className = [...tokens].join(" ") }
            return {
              add(...tokens) {
                const current = read()
                for (const token of tokens) if (token) current.add(token)
                write(current)
              },
              remove(...tokens) {
                const current = read()
                for (const token of tokens) current.delete(token)
                write(current)
              },
              contains(token) {
                return read().has(token)
              },
              toggle(token, force) {
                const current = read()
                const enabled = force ?? !current.has(token)
                if (enabled) current.add(token)
                else current.delete(token)
                write(current)
                return enabled
              },
              toString() {
                return node.className
              },
            }
          }

          export function getConnectedHostRoots(): readonly HostElementNode[] {
            return [...connectedHostRoots].filter((node) => node.nativeAlive && node.parent?.kind === "root")
          }

          export function getActiveHostElement(): HostElementNode | null {
            return activeHostElement?.nativeAlive ? activeHostElement : null
          }

          export function setGlobalPointerDownObservation(active: boolean): void {
            if (globalPointerDownObservation === active) return
            globalPointerDownObservation = active
            const roots = new Set<HostRootNode>()
            for (const topLevel of getConnectedHostRoots()) {
              for (const candidate of [topLevel, ...hostDescendants(topLevel)]) {
                const root = candidate.root
                if (!root || !candidate.nativeAlive) continue
                roots.add(root)
                root.driver.enqueue(
                  "setEventListener",
                  candidate.id,
                  "mouseDown",
                  active || hasNativeEventHandler(candidate, "mouseDown"),
                )
              }
            }
            for (const root of roots) root.driver.flush()
          }

          ''')
          nodes = replace_region(nodes, selector_start, selector_end, helpers)

          adopt_start = '    for (const [eventType, handler] of node.events) {\n'
          adopt_end = '    for (const [name, value] of node.props) {\n'
          adopt_block = dedent('''\
          for (const [eventType, handler] of node.events) {
            root.events.set(node.id, eventType, handler)
            const nativeEventType = nativeEventTypeForDomEvent(eventType)
            if (nativeEventType) nativeEventTypes.add(nativeEventType)
          }
          if (globalPointerDownObservation) nativeEventTypes.add("mouseDown")
          for (const eventType of nativeEventTypes) {
            root.driver.enqueue("setEventListener", node.id, eventType, true)
          }
          ''')
          nodes = replace_region(nodes, adopt_start, adopt_end, indent(adopt_block, '    '))

          dead_marker = 'function markNativeDead(root: HostRootNode, node: HostNode): void {\n  node.nativeAlive = false\n'
          if nodes.count(dead_marker) != 1:
            raise SystemExit("markNativeDead marker changed")
          nodes = nodes.replace(
            dead_marker,
            'function markNativeDead(root: HostRootNode, node: HostNode): void {\n'
            '  if (node.kind === "element" && activeHostElement && node.contains(activeHostElement)) activeHostElement = null\n'
            '  node.nativeAlive = false\n',
            1,
          )

          nodes_path.write_text(nodes)
          (root / "packages/solid/src/host/nodes.ts").write_text(nodes)

          # --- host/events.ts ---
          events_path = root / "packages/solid1/src/host/events.ts"
          events = events_path.read_text()
          events = events.replace('type GlobalEventHandler = (event: EventPayload) => void\nconst globalListeners = new Map<string, Set<GlobalEventHandler>>()\n', '')
          events = events.replace('const EVENT_STATE = new WeakMap<object, { defaultPrevented: boolean; propagationStopped: boolean }>()\n', '')
          events = events.replace('\ninstallNativeDomGlobals()\n', '\n')
          events = events.replace('  EVENT_STATE.set(payload, state)\n', '')
          events = events.replace('  for (const handler of globalListeners.get(name) ?? []) handler(event)\n', '')
          globals_start = 'function installNativeDomGlobals(): void {\n'
          globals_end = 'type LastClick = {\n'
          if globals_start in events:
            events = replace_region(events, globals_start, globals_end, '')
          dispatch_old = '''  globalThis.document.dispatchEvent(createGlobalDomEvent(name, event, globalThis.document))
          globalThis.window.dispatchEvent(createGlobalDomEvent(name, event, globalThis.window))
          '''
          dispatch_new = '''  const documentTarget = globalThis.document
          const windowTarget = globalThis.window
          documentTarget?.dispatchEvent?.(createGlobalDomEvent(name, event, documentTarget))
          windowTarget?.dispatchEvent?.(createGlobalDomEvent(name, event, windowTarget))
          '''
          if dispatch_old not in events:
            raise SystemExit("global event dispatch marker changed")
          events = events.replace(dispatch_old, dispatch_new, 1)
          events_path.write_text(events)
          (root / "packages/solid/src/host/events.ts").write_text(events)

          # --- dom-environment.ts ---
          dom_path = root / "packages/solid1/src/dom-environment.ts"
          dom = dom_path.read_text()
          import_end = '} from "./host/nodes.js"\n'
          if dom.count(import_end) != 1:
            raise SystemExit("dom environment import marker changed")
          import_finish = dom.index(import_end) + len(import_end)
          dom = dedent('''\
          import {
            HostElementNode,
            createHostElement,
            getActiveHostElement,
            getConnectedHostRoots,
            setGlobalPointerDownObservation,
          } from "./host/nodes.js"
          ''') + dom[import_finish:]
          dom = dom.replace('type CompatListenerTarget = CompatEventTarget | HostElementNode\n', 'type CompatListenerTarget = CompatEventTarget\n')
          dom = dom.replace('const knownRoots = new Set<HostElementNode>()\n', '')
          dom = dom.replace('let hostDomCompatibilityInstalled = false\n', '')
          dom = dom.replace('  installHostDomCompatibility(documentTarget)\n\n', '')
          dom = dom.replace('      if (tagName === "body") return activeDomRoots()\n', '      if (tagName === "body") return getConnectedHostRoots()\n')

          type_marker = '  createTreeWalker?: (\n    root: CompatTreeElement,\n    whatToShow: number,\n    filter: CompatTreeWalkerFilter,\n  ) => CompatTreeWalker\n'
          type_addition = type_marker + dedent('''\
            contains?: (node: unknown) => boolean
            querySelector?: (selector: string) => HostElementNode | null
            querySelectorAll?: (selector: string) => HostElementNode[]
            readonly activeElement?: HostElementNode | CompatDocumentNode | null
          ''')
          if dom.count(type_marker) != 1:
            raise SystemExit("CompatDocument type marker changed")
          dom = dom.replace(type_marker, type_addition, 1)

          node_type_marker = '  getBoundingClientRect(): CompatRect\n'
          if dom.count(node_type_marker) != 1:
            raise SystemExit("CompatDocumentNode type marker changed")
          dom = dom.replace(node_type_marker, node_type_marker + '  focus(): void\n  blur(): void\n', 1)
          dom = dom.replace('let activeBody: CompatDocumentNode | undefined\n', 'let activeBody: CompatDocumentNode | undefined\nlet activeDocumentNode: CompatDocumentNode | undefined\n')

          assignment_marker = '  documentTarget.createElement = createCompatElement\n  documentTarget.createTreeWalker = createCompatTreeWalker\n'
          if dom.count(assignment_marker) != 1:
            raise SystemExit("document API assignment marker changed")
          assignment = assignment_marker + dedent('''\
            documentTarget.contains = (candidate) => {
              if (candidate === bodyTarget || candidate === documentElementTarget) return true
              return candidate instanceof HostElementNode && getConnectedHostRoots().some((root) => root.contains(candidate))
            }
            documentTarget.querySelectorAll = (selector) => queryDescendants(bodyTarget, selector)
            documentTarget.querySelector = (selector) => documentTarget.querySelectorAll?.(selector)[0] ?? null
            Object.defineProperty(documentTarget, "activeElement", {
              configurable: false,
              enumerable: true,
              get: () => getActiveHostElement() ?? activeDocumentNode ?? bodyTarget,
            })
          ''')
          dom = dom.replace(assignment_marker, assignment, 1)

          create_node_marker = '  const node: CompatDocumentNode = {\n'
          if dom.count(create_node_marker) != 1:
            raise SystemExit("document node creation marker changed")
          # Focus methods are added directly to the object before its closing bounding rect method.
          rect_tail = '''    getBoundingClientRect() {
              const width = windowTarget.innerWidth ?? 800
              const height = windowTarget.innerHeight ?? 600
              return {
                x: 0,
                y: 0,
                left: 0,
                top: 0,
                right: width,
                bottom: height,
                width,
                height,
              }
            },
          }
          '''
          rect_replacement = '''    getBoundingClientRect() {
              const width = windowTarget.innerWidth ?? 800
              const height = windowTarget.innerHeight ?? 600
              return {
                x: 0,
                y: 0,
                left: 0,
                top: 0,
                right: width,
                bottom: height,
                width,
                height,
              }
            },
            focus() {
              activeDocumentNode = node
            },
            blur() {
              if (activeDocumentNode === node) activeDocumentNode = activeBody
            },
          }
          '''
          if rect_tail not in dom:
            raise SystemExit("document node rect marker changed")
          dom = dom.replace(rect_tail, rect_replacement, 1)
          dom = dom.replace('  activeBody = bodyTarget\n', '  activeBody = bodyTarget\n  activeDocumentNode = bodyTarget\n', 1)

          compat_start = 'function installHostDomCompatibility(ownerDocument: CompatDocument): void {\n'
          child_start = 'function childElements(node: CompatTreeElement): HostElementNode[] {\n'
          if compat_start in dom:
            dom = replace_region(dom, compat_start, child_start, '')

          dom = dom.replace('  return descendantsOf(root).filter((node) => matchesSelector(node, selector))\n', '  return descendantsOf(root).filter((node) => node.matches(selector))\n')
          selector_start = 'function matchesSelector(node: HostElementNode, selector: string): boolean {\n'
          walker_start = 'function createCompatTreeWalker(\n'
          if selector_start in dom:
            dataset_only = dedent('''\
            function datasetFromAttributes(attributes: ReadonlyMap<string, string>) {
              return {
                liveAnnouncer: attributes.get("data-live-announcer"),
                reactAriaTopLayer: attributes.get("data-react-aria-top-layer"),
              } satisfies CompatDataset
            }

            ''')
            dom = replace_region(dom, selector_start, walker_start, dataset_only)

          listener_decl = 'const listeners = new WeakMap<CompatListenerTarget, Map<string, Set<CompatListener>>>()\n'
          if dom.count(listener_decl) != 1:
            raise SystemExit("listener declaration marker changed")
          dom = dom.replace(listener_decl, listener_decl + 'let pointerDownListenerCount = 0\n', 1)
          listener_start = 'function addCompatListener(target: CompatListenerTarget, type: string, listener: CompatListener | null): void {\n'
          dispatch_start = 'function dispatchCompatEvent(target: CompatListenerTarget, event: Event): boolean {\n'
          listener_block = dedent('''\
          function addCompatListener(target: CompatListenerTarget, type: string, listener: CompatListener | null): void {
            if (!listener) return
            let byType = listeners.get(target)
            if (!byType) {
              byType = new Map()
              listeners.set(target, byType)
            }
            let entries = byType.get(type)
            if (!entries) {
              entries = new Set()
              byType.set(type, entries)
            }
            const sizeBefore = entries.size
            entries.add(listener)
            if (type === "pointerdown" && entries.size !== sizeBefore) {
              pointerDownListenerCount += 1
              setGlobalPointerDownObservation(true)
            }
          }

          function removeCompatListener(target: CompatListenerTarget, type: string, listener: CompatListener | null): void {
            if (!listener) return
            const entries = listeners.get(target)?.get(type)
            if (!entries || !entries.delete(listener)) return
            if (type === "pointerdown") {
              pointerDownListenerCount = Math.max(0, pointerDownListenerCount - 1)
              if (pointerDownListenerCount === 0) setGlobalPointerDownObservation(false)
            }
          }

          ''')
          dom = replace_region(dom, listener_start, dispatch_start, listener_block)
          dom_path.write_text(dom)

          # --- web.ts ---
          web_path = root / "packages/solid1/src/web.ts"
          web = web_path.read_text()
          web = web.replace('import { EventRegistry } from "./host/events.js"\n', '')
          web = web.replace('import { HostElementNode, setHostProperty, type HostRootNode } from "./host/nodes.js"\n', 'import { HostElementNode, setHostProperty } from "./host/nodes.js"\n')
          for call in (
            'installElementConstructorCompatibility()\n',
            'installElementQueryCompatibility()\n',
            'installDocumentContainmentCompatibility()\n',
            'installDocumentFocusCompatibility()\n',
            'installDocumentPointerCaptureCompatibility()\n',
          ):
            web = web.replace(call, '')

          constructor_start = 'function installElementConstructorCompatibility(): void {\n'
          style_start = 'function installBrowserStyleMutationCompatibility(element: HostElementNode): void {\n'
          if constructor_start in web:
            web = replace_region(web, constructor_start, style_start, '')
          containment_start = 'function installDocumentContainmentCompatibility(): void {\n'
          document_style_start = 'function installDocumentStyleCompatibility(): void {\n'
          if containment_start in web:
            web = replace_region(web, containment_start, document_style_start, '')
          focus_start = 'function installDocumentFocusCompatibility(): void {\n'
          create_style_start = 'function createDocumentStyle(): CompatDocumentStyle {\n'
          if focus_start in web:
            web = replace_region(web, focus_start, create_style_start, '')
          web_path.write_text(web)

          # --- parity tests ---
