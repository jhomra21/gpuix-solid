name: GPUIX Latest Main

on:
  workflow_dispatch:
  schedule:
    - cron: "17 13 * * *"

permissions:
  contents: read

concurrency:
  group: gpuix-latest-main
  cancel-in-progress: true

jobs:
  latest-main:
    name: latest remorses/gpuix main
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Confirm native build toolchain
        run: rustc --version && cargo --version
      - run: bun install --frozen-lockfile
      - name: Verify Solid against latest upstream main
        run: bun run gpuix:edge:latest:check
