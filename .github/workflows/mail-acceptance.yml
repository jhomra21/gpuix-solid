name: Mail Acceptance

on:
  pull_request:
    paths:
      - "packages/solid/**"
      - "examples/counter/src/mail/**"
      - "examples/counter/vite.mail*.config.ts"
      - "scripts/check-mail-live-automation.mjs"
      - "package.json"
      - "bun.lock"
      - ".gpuix/**"
      - ".github/workflows/mail-acceptance.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mail-live-native:
    name: Mail live native (macOS)
    runs-on: macos-latest
    timeout-minutes: 20
    env:
      MAIL_ACCEPTANCE_SCREENSHOT: /tmp/gpuix-solid-mail-acceptance.png
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Build Solid runtime
        run: bun run --filter 'gpuix-solid' build
      - name: Run deterministic Mail contract
        run: bun run --filter 'gpuix-solid-counter' test:mail
      - name: Build live Mail example
        run: bun run --filter 'gpuix-solid-counter' build:mail
      - name: Run exhaustive live-native Mail acceptance
        run: node scripts/check-mail-live-automation.mjs
      - name: Upload Mail acceptance screenshot
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mail-acceptance-macos
          path: /tmp/gpuix-solid-mail-acceptance.png
          if-no-files-found: ignore
          retention-days: 7
