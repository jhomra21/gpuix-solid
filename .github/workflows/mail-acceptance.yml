name: Mail Acceptance

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mail-live-native:
    name: Mail live native (macOS)
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      MAIL_ACCEPTANCE_SCREENSHOT: /tmp/gpuix-solid-mail-acceptance.png
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Decide Mail acceptance scope
        id: scope
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "full=true" >> "$GITHUB_OUTPUT"
            echo "Manual dispatch: running full Mail acceptance."
            exit 0
          fi

          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          git diff --name-only "$base" "$head" > "$RUNNER_TEMP/mail-changed-files.txt"

          full=false
          while IFS= read -r file; do
            case "$file" in
              examples/counter/src/mail/*|              examples/counter/vite.mail*.config.ts|              scripts/check-mail-live-automation.mjs|              scripts/mail-parity/*|              packages/solid/src/automation/*|              packages/solid/src/runtime.ts|              packages/solid/src/root.ts|              packages/solid/src/batch-renderer-adapter.ts|              packages/solid/src/primitives/create-text-selection.ts|              packages/solid/src/host/events.ts|              .github/workflows/mail-acceptance.yml)
                full=true
                echo "Mail-sensitive change: $file"
                break
                ;;
            esac
          done < "$RUNNER_TEMP/mail-changed-files.txt"

          echo "full=$full" >> "$GITHUB_OUTPUT"

      - name: Skip unrelated Mail acceptance
        if: steps.scope.outputs.full != 'true'
        run: echo "No Mail-sensitive files changed; full native and differential Mail acceptance is skipped."

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: steps.scope.outputs.full == 'true'
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
        if: steps.scope.outputs.full == 'true'
      - name: Build Solid runtime
        if: steps.scope.outputs.full == 'true'
        run: bun run --filter 'gpuix-solid' build
      - name: Run deterministic Mail contract
        if: steps.scope.outputs.full == 'true'
        run: bun run --filter 'gpuix-solid-counter' test:mail
      - name: Build live Mail example
        if: steps.scope.outputs.full == 'true'
        run: bun run --filter 'gpuix-solid-counter' build:mail
      - name: Run exhaustive live-native Mail acceptance
        if: steps.scope.outputs.full == 'true'
        run: node scripts/check-mail-live-automation.mjs
      - name: Run React/Solid differential parity
        if: steps.scope.outputs.full == 'true'
        run: bun run mail:parity
      - name: Upload Mail acceptance artifacts
        if: always() && steps.scope.outputs.full == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mail-acceptance-macos
          path: |
            /tmp/gpuix-solid-mail-acceptance.png
            artifacts/mail-parity/
          if-no-files-found: ignore
          retention-days: 7
