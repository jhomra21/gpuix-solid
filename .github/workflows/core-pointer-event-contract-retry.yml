name: Core pointer event contract retry

on:
  push:
    branches:
      - fix/source-first-example-fidelity

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/source-first-example-fidelity
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - name: Apply reviewed pointer contract transform
        run: |
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          workflow = Path('.github/workflows/core-pointer-event-contract.yml').read_text()
          open_marker = "          python - <<'PY'\n"
          close_marker = "\n          PY\n"
          start = workflow.index(open_marker) + len(open_marker)
          end = workflow.index(close_marker, start)
          script = dedent(workflow[start:end])

          old_start = script.index("old_adopt = '''")
          old_end_marker = "nodes = nodes.replace(old_adopt, new_adopt, 1)"
          old_end = script.index(old_end_marker, old_start) + len(old_end_marker)
          replacement = "\n".join([
              "adopt_start_marker = '    for (const [eventType, handler] of node.events) {\\n'",
              "adopt_end_marker = '    for (const eventType of nativeEventTypes) {\\n'",
              "if nodes.count(adopt_start_marker) != 1 or nodes.count(adopt_end_marker) != 1:",
              "  raise SystemExit(\"adopt event loop markers changed\")",
              "adopt_start = nodes.index(adopt_start_marker)",
              "adopt_end = nodes.index(adopt_end_marker, adopt_start)",
              "new_adopt = '''    for (const [eventType, handler] of node.events) {",
              "      root.events.set(node.id, eventType, handler)",
              "      const nativeEventType = nativeEventTypeForDomEvent(eventType)",
              "      if (nativeEventType) nativeEventTypes.add(nativeEventType)",
              "    }",
              "'''",
              "nodes = nodes[:adopt_start] + new_adopt + nodes[adopt_end:]",
          ])
          script = script[:old_start] + replacement + script[old_end:]
          exec(compile(script, '<core-pointer-transform>', 'exec'))
          PY
      - name: Validate host and consumers
        run: |
          cd packages/solid1
          bun install --no-save
          bun run test
          bun run typecheck
          cd ../../examples/solid1-kobalte
          bun install --no-save
          bun run typecheck
      - name: Commit validated pointer contract
        run: |
          rm .github/workflows/core-pointer-event-contract.yml
          rm .github/workflows/core-pointer-event-contract-retry.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/solid1/src/host/events.ts packages/solid/src/host/events.ts packages/solid1/src/host/nodes.ts packages/solid/src/host/nodes.ts packages/solid1/src/host/types.ts packages/solid/src/host/types.ts packages/solid1/src/browser-event-compat.ts packages/solid1/src/root.ts packages/solid1/src/web.ts packages/solid1/scripts/check-host-parity.ts .github/workflows/core-pointer-event-contract.yml .github/workflows/core-pointer-event-contract-retry.yml
          git diff --check
          git commit -m "fix: implement core pointer capture semantics"
          git push origin HEAD:fix/source-first-example-fidelity
