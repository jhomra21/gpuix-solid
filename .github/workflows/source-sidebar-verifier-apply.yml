name: Validate source-owned sidebar verifier

on:
  push:
    branches:
      - fix/source-first-example-fidelity
    paths:
      - ".github/workflows/source-sidebar-verifier-apply.yml"
      - ".github/source-sidebar-verifier-apply.py"
      - ".github/source-sidebar-geometry-probe.py"
      - ".github/source-sidebar-postprocess.py"
      - ".github/source-sidebar-state-probe.py"
      - ".github/inline-grid-compat-probe.py"
      - ".github/empty-text-compat-probe.py"
      - ".github/interactive-hit-surface-probe.py"
      - ".github/arm-edge-hit-probe.py"
      - ".github/range-event-probe.py"
      - ".github/range-native-backing-probe.py"
      - ".github/automation-verifier-source-marker-probe.py"
      - ".github/clip-verifier-source-marker-probe.py"
      - ".github/clip-hit-stack-probe.py"
      - ".github/custom-props-center-click-probe.py"
      - ".github/dom-event-bubbling-probe.py"
      - ".github/pointer-events-inheritance-probe.py"
      - "packages/solid1/src/browser-grid-compat.ts"
      - "packages/solid1/scripts/check-browser-grid-compat.ts"
      - "packages/solid1/package.json"
      - "examples/solid1-daw/src/native/SourceTrackSidebar.tsx"

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/source-first-example-fidelity
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Apply verifier patch
        run: |
          python3 .github/source-sidebar-geometry-probe.py
          python3 .github/source-sidebar-verifier-apply.py
          python3 .github/source-sidebar-postprocess.py
          python3 .github/source-sidebar-state-probe.py
          python3 .github/inline-grid-compat-probe.py
          python3 .github/empty-text-compat-probe.py
          python3 .github/interactive-hit-surface-probe.py
          python3 .github/arm-edge-hit-probe.py
          python3 .github/range-native-backing-probe.py
          python3 .github/range-event-probe.py
          python3 .github/pointer-events-inheritance-probe.py
          python3 .github/custom-props-center-click-probe.py
          python3 .github/clip-hit-stack-probe.py
          python3 .github/automation-verifier-source-marker-probe.py
          python3 .github/clip-verifier-source-marker-probe.py
      - run: bun install --frozen-lockfile
      - name: Validate on native macOS
        run: |
          bun run solid1:package
          bun run solid1:daw
          git diff --check
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        if: always()
        with:
          name: source-sidebar-verifier-files
          path: |
            packages/solid1/src/host/nodes.ts
            packages/solid1/src/host/events.ts
            packages/solid1/src/universal.ts
            packages/solid1/src/testing.ts
            examples/solid1-daw/src/test.tsx
          if-no-files-found: error
