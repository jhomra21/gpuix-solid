name: Chat Solid 2 effect fix

on:
  push:
    branches:
      - experiment/chat-solid2-effect

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
      - name: Apply Solid 2 effect signature
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("examples/counter/src/chat/shell.tsx")
          source = path.read_text()
          pattern = re.compile(
              r"  createEffect\(\(\) => \{\n"
              r"    const count = turns\(\)\.length \+ \(props\.includeSafeMdx \? 1 : 0\)\n"
              r"    if \(firstTranscriptCommit\) \{\n"
              r"      firstTranscriptCommit = false\n"
              r"      return\n"
              r"    \}\n"
              r"    const currentList = listRef\n"
              r"    if \(!currentList \|\| count === 0\) return\n"
              r"    queueMicrotask\(\(\) => renderer\.scrollToItem\?\.\(currentList\.id, count - 1\)\)\n"
              r"  \}\)"
          )
          replacement = (
              "  createEffect(\n"
              "    () => turns().length + (props.includeSafeMdx ? 1 : 0),\n"
              "    (count) => {\n"
              "      if (firstTranscriptCommit) {\n"
              "        firstTranscriptCommit = false\n"
              "        return\n"
              "      }\n"
              "      const currentList = listRef\n"
              "      if (!currentList || count === 0) return\n"
              "      queueMicrotask(() => renderer.scrollToItem?.(currentList.id, count - 1))\n"
              "    },\n"
              "  )"
          )
          source, count = pattern.subn(replacement, source, count=1)
          if count != 1:
              raise SystemExit(f"Chat effect replacement count: {count}")
          path.write_text(source)
          PY
          git rm .github/workflows/chat-solid2-effect.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add examples/counter/src/chat/shell.tsx
          git commit -m "Fix Chat effect for Solid 2"
          git push origin HEAD:experiment/chat-solid2-effect
