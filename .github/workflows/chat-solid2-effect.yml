name: Chat Solid 2 effect fix

on:
  push:
    branches:
      - experiment/chat-solid2-effect

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
      - name: Apply Solid 2 effect signature
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("examples/counter/src/chat/shell.tsx")
          source = path.read_text()
          old = '''  createEffect(() => {
            const count = turns().length + (props.includeSafeMdx ? 1 : 0)
            if (firstTranscriptCommit) {
              firstTranscriptCommit = false
              return
            }
            const currentList = listRef
            if (!currentList || count === 0) return
            queueMicrotask(() => renderer.scrollToItem?.(currentList.id, count - 1))
          })'''
          new = '''  createEffect(
            () => turns().length + (props.includeSafeMdx ? 1 : 0),
            (count) => {
              if (firstTranscriptCommit) {
                firstTranscriptCommit = false
                return
              }
              const currentList = listRef
              if (!currentList || count === 0) return
              queueMicrotask(() => renderer.scrollToItem?.(currentList.id, count - 1))
            },
          )'''
          if old not in source:
              raise SystemExit("Chat effect block not found")
          path.write_text(source.replace(old, new, 1))
          PY
          git rm .github/workflows/chat-solid2-effect.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add examples/counter/src/chat/shell.tsx
          git commit -m "Fix Chat effect for Solid 2"
          git push origin HEAD:experiment/chat-solid2-effect
