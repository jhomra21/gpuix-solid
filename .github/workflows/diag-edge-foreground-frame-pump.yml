name: Diagnostic edge foreground frame pump

on:
  push:
    branches:
      - diag/edge-foreground-frame-pump-20260912

permissions:
  contents: read

jobs:
  foreground-frame-pump:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Confirm native build toolchain
        run: rustc --version && cargo --version
      - run: bun install --frozen-lockfile
      - name: Keep normal macOS frame pump under CI
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('packages/solid/src/runtime.ts')
          source = path.read_text()
          old = 'enableAutomation(compatibilityRenderer)'
          new = 'enableAutomation(compatibilityRenderer, { driveFrames: false })'
          if source.count(old) != 1:
              raise SystemExit(f'expected exactly one automation enable call, found {source.count(old)}')
          path.write_text(source.replace(old, new))
          PY
          git diff --check -- packages/solid/src/runtime.ts
          git diff -- packages/solid/src/runtime.ts
      - name: Build and verify exact current edge
        run: |
          bun run gpuix:edge:prepare
          bun run gpuix:edge:verify
      - name: Build Counter probe once
        run: |
          bun run --filter 'gpuix-solid' build
          bun run --filter 'gpuix-solid-counter' build:counter
      - name: Measure current nonblocking pump
        id: current
        working-directory: examples/counter
        shell: bash
        run: |
          set +e
          GPUIX_FOREGROUND_FRAME_PROBE=1 bun dist/counter/index.js 2>&1 | tee /tmp/current-pump.log
          status=${PIPESTATUS[0]}
          set -e
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "Current pump exit: $status"
      - name: Reverse only the macOS nonblocking-pump commit
        shell: bash
        run: |
          edge_checkout=".cache/gpuix/remorses--gpuix-e47bd1ca302e"
          zed_checkout="$edge_checkout/zed"
          pump_commit="df3c9b72600b9fd9e5eeb2794286642a7df86fdd"
          test "$(git -C "$edge_checkout" rev-parse HEAD)" = "e47bd1ca302ecab13e63363338fd44f6012ab2c8"
          git -C "$zed_checkout" show "$pump_commit" -- crates/gpui_macos/src/platform.rs \
            | git -C "$zed_checkout" apply --reverse --3way -
          git -C "$zed_checkout" diff --check -- crates/gpui_macos/src/platform.rs
          git -C "$zed_checkout" diff -- crates/gpui_macos/src/platform.rs
      - name: Rebuild and verify edge with wake-through pump only
        run: |
          bun run gpuix:edge:build
          bun run gpuix:edge:link
          bun run gpuix:edge:verify
      - name: Measure wake-through pump
        id: wake
        working-directory: examples/counter
        shell: bash
        run: |
          set +e
          GPUIX_FOREGROUND_FRAME_PROBE=1 bun dist/counter/index.js 2>&1 | tee /tmp/wake-pump.log
          status=${PIPESTATUS[0]}
          set -e
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "Wake-through pump exit: $status"
      - name: Classify A/B
        shell: bash
        env:
          CURRENT_STATUS: ${{ steps.current.outputs.status }}
          WAKE_STATUS: ${{ steps.wake.outputs.status }}
        run: |
          echo "current=$CURRENT_STATUS wake=$WAKE_STATUS"
          echo "--- current probe ---"
          grep '\[foreground-frame-probe\]' /tmp/current-pump.log || true
          echo "--- wake probe ---"
          grep '\[foreground-frame-probe\]' /tmp/wake-pump.log || true

          if [[ "$CURRENT_STATUS" == "42" && "$WAKE_STATUS" == "0" ]]; then
            echo "Confirmed: current nonblocking pump starves post-commit foreground frames; wake-through pump restores them."
            exit 0
          fi

          echo "Diagnostic did not produce the expected starvation/restoration split."
          exit 1
