name: Apply native half translation

on:
  push:
    branches:
      - fix/source-first-example-fidelity
    paths:
      - .github/workflows/apply-native-half-translation.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/source-first-example-fidelity
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - name: Apply native half translation compatibility
        run: python scripts/apply-native-half-translation.py
      - name: Generate exact DAW styles
        run: |
          cd examples/solid1-daw
          bun install --no-save
          bun run generate:styles
      - name: Validate shared host and exact DAW
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun run lint
          bun run typecheck
          cd packages/solid1
          bun install --no-save
          bun run typecheck
          bun run test
          bun run build
          cd ../../examples/solid1-daw
          bun run source:check
          bunx tsc --noEmit
          bun run build
          bun run source:check
          cd ../..
          git diff --check
      - name: Commit validated compatibility
        run: |
          set -euo pipefail
          rm -f scripts/apply-native-half-translation.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: support native half translations"
          git push origin HEAD:fix/source-first-example-fidelity

# rerun after parity-import anchor correction
