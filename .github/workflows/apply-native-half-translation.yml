name: Apply native half translation

on:
  push:
    branches:
      - fix/source-first-example-fidelity
    paths:
      - .github/workflows/apply-native-half-translation.yml
      - scripts/apply-native-half-translation.py
      - scripts/apply-native-relative-position.py
      - scripts/apply-daw-style-omissions.py

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/source-first-example-fidelity
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - name: Apply native compatibility changes
        run: |
          python scripts/apply-native-half-translation.py
          python scripts/apply-native-relative-position.py
          python scripts/apply-daw-style-omissions.py
          python - <<'PY'
          from pathlib import Path

          for package in ("solid", "solid1"):
              path = Path(f"packages/{package}/src/native-style.ts")
              text = path.read_text()
              old_parser = '''  if (classFraction !== undefined && parentSize !== undefined) return parentSize * classFraction
            if (value === undefined || parentSize === undefined || typeof value === "number") return value
            const percentage = value.trim().match(/^(-?(?:\\d+(?:\\.\\d+)?|\\.\\d+))%$/)
            if (!percentage) return value
            return parentSize * Number(percentage[1]) / 100
          '''
              new_parser = '''  if (classFraction !== undefined && parentSize !== undefined) return parentSize * classFraction
            if (value === undefined || parentSize === undefined) return value
            const numeric = Number(value)
            if (Number.isFinite(numeric)) return numeric
            const percentage = String(value).trim().match(/^(-?(?:\\d+(?:\\.\\d+)?|\\.\\d+))%$/)
            if (!percentage) return value
            return parentSize * Number(percentage[1]) / 100
          '''
              old_positions = '''  result.left = resolveRelativePosition(result.left, position?.leftFraction, parentWidth)
            result.right = resolveRelativePosition(result.right, position?.rightFraction, parentWidth)
            result.top = resolveRelativePosition(result.top, position?.topFraction, parentHeight)
            result.bottom = resolveRelativePosition(result.bottom, position?.bottomFraction, parentHeight)
            return result
          '''
              new_positions = '''  const left = resolveRelativePosition(result.left, position?.leftFraction, parentWidth)
            const right = resolveRelativePosition(result.right, position?.rightFraction, parentWidth)
            const top = resolveRelativePosition(result.top, position?.topFraction, parentHeight)
            const bottom = resolveRelativePosition(result.bottom, position?.bottomFraction, parentHeight)
            if (left === undefined) delete result.left
            else result.left = left
            if (right === undefined) delete result.right
            else result.right = right
            if (top === undefined) delete result.top
            else result.top = top
            if (bottom === undefined) delete result.bottom
            else result.bottom = bottom
            return result
          '''
              if old_parser not in text or old_positions not in text:
                  raise SystemExit(f"{path}: relative position compatibility anchor missing")
              path.write_text(text.replace(old_parser, new_parser, 1).replace(old_positions, new_positions, 1))

          path = Path("packages/solid1/src/universal.ts")
          text = path.read_text()
          old_dimension = '''function resolvedNativeDimension(value: DimensionValue | undefined, parentSize: number | undefined): number | undefined {
            if (value === undefined) return undefined
            if (typeof value === "number") return value
            const trimmed = value.trim()
            const percentage = trimmed.match(/^(-?(?:\\d+(?:\\.\\d+)?|\\.\\d+))%$/)
            if (percentage && parentSize !== undefined) return parentSize * Number(percentage[1]) / 100
            const number = Number(trimmed)
            return Number.isFinite(number) ? number : undefined
          }
          '''
          new_dimension = '''function resolvedNativeDimension(value: DimensionValue | undefined, parentSize: number | undefined): number | undefined {
            if (value === undefined) return undefined
            const number = Number(value)
            if (Number.isFinite(number)) return number
            const percentage = String(value).trim().match(/^(-?(?:\\d+(?:\\.\\d+)?|\\.\\d+))%$/)
            if (percentage && parentSize !== undefined) return parentSize * Number(percentage[1]) / 100
            return undefined
          }
          '''
          old_position = '''function resolvedNativePosition(value: DimensionValue | undefined, parentSize: number): number | undefined {
            if (value === undefined) return undefined
            if (typeof value === "number") return value
            const percentage = value.trim().match(/^(-?(?:\\d+(?:\\.\\d+)?|\\.\\d+))%$/)
            if (percentage) return parentSize * Number(percentage[1]) / 100
            const number = Number(value)
            return Number.isFinite(number) ? number : undefined
          }
          '''
          new_position = '''function resolvedNativePosition(value: DimensionValue | undefined, parentSize: number): number | undefined {
            if (value === undefined) return undefined
            const number = Number(value)
            if (Number.isFinite(number)) return number
            const percentage = String(value).trim().match(/^(-?(?:\\d+(?:\\.\\d+)?|\\.\\d+))%$/)
            if (percentage) return parentSize * Number(percentage[1]) / 100
            return undefined
          }
          '''
          if old_dimension not in text or old_position not in text:
              raise SystemExit(f"{path}: dimension parser anchor missing")
          path.write_text(text.replace(old_dimension, new_dimension, 1).replace(old_position, new_position, 1))
          PY
      - name: Generate exact DAW styles
        run: |
          set -o pipefail
          cd examples/solid1-daw
          bun install --no-save
          bun run generate:styles 2>&1 | tee /tmp/native-tailwind-generator.log
      - name: Upload DAW style generator log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-tailwind-generator-log
          path: /tmp/native-tailwind-generator.log
          if-no-files-found: error
      - name: Validate shared host and exact DAW
        run: |
          set -euo pipefail
          {
            bun install --frozen-lockfile
            bun run lint
            bun run typecheck
            cd packages/solid1
            bun install --no-save
            bun run typecheck
            bun run test
            bun run build
            cd ../../examples/solid1-daw
            bun run source:check
            bunx tsc --noEmit
            bun run build
            bun run source:check
            cd ../..
            git diff --check
          } 2>&1 | tee /tmp/native-closure-validation.log
      - name: Upload DAW closure validation log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-closure-validation-log
          path: /tmp/native-closure-validation.log
          if-no-files-found: ignore
      - name: Commit validated compatibility
        run: |
          set -euo pipefail
          rm -f scripts/apply-native-half-translation.py scripts/apply-native-relative-position.py scripts/apply-daw-style-omissions.py .github/workflows/apply-native-half-translation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: support exact DAW native style closure"
          git push origin HEAD:fix/source-first-example-fidelity
