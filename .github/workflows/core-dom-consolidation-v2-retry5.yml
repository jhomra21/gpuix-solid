name: Core DOM consolidation v2 retry5

on:
  push:
    branches:
      - fix/source-first-example-fidelity

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/source-first-example-fidelity
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - name: Apply consolidation and structurally decouple global events
        run: |
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          workflow = Path('.github/workflows/core-dom-consolidation-v2-retry3.yml').read_text()
          opening = "          python - <<'PY'\n"
          closing = "\n          PY\n"
          start = workflow.index(opening) + len(opening)
          end = workflow.index(closing, start)
          script = dedent(workflow[start:end])
          exec(compile(script, '<core-dom-consolidation-retry3>', 'exec'))

          replacement = '''function dispatchGlobalEvent(eventType: string, event: EventPayload): void {
            const name = globalEventName(eventType)
            if (!name) return
            const documentTarget = globalThis.document
            const windowTarget = globalThis.window
            if (documentTarget?.dispatchEvent) {
              documentTarget.dispatchEvent(createGlobalDomEvent(name, event, documentTarget))
            }
            if (windowTarget?.dispatchEvent) {
              windowTarget.dispatchEvent(createGlobalDomEvent(name, event, windowTarget))
            }
          }

          '''
          for path in [Path('packages/solid1/src/host/events.ts'), Path('packages/solid/src/host/events.ts')]:
            events = path.read_text()
            function_start = events.index('function dispatchGlobalEvent(eventType: string, event: EventPayload): void {\n')
            next_marker = 'type LastClick = {\n'
            function_end = events.index(next_marker, function_start)
            events = events[:function_start] + replacement + events[function_end:]
            path.write_text(events)
          PY
      - name: Validate consolidated core and consumers
        run: |
          cd packages/solid1
          bun install --no-save
          bun run test
          bun run typecheck
          cd ../../examples/solid1-kobalte
          bun install --no-save
          bun run typecheck
          cd ../solid1-daw
          bun install --no-save
          bun run typecheck
      - name: Commit validated consolidation
        run: |
          rm -f .github/workflows/core-dom-consolidation-v2.yml
          rm -f .github/workflows/core-dom-consolidation-v2-retry.yml
          rm -f .github/workflows/core-dom-consolidation-v2-retry2.yml
          rm -f .github/workflows/core-dom-consolidation-v2-retry3.yml
          rm -f .github/workflows/core-dom-consolidation-v2-retry4.yml
          rm -f .github/workflows/core-dom-consolidation-v2-retry5.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/solid1/src/host/nodes.ts packages/solid/src/host/nodes.ts packages/solid1/src/host/events.ts packages/solid/src/host/events.ts packages/solid1/src/dom-environment.ts packages/solid1/src/web.ts packages/solid1/scripts/check-host-parity.ts .github/workflows/core-dom-consolidation-v2.yml .github/workflows/core-dom-consolidation-v2-retry.yml .github/workflows/core-dom-consolidation-v2-retry2.yml .github/workflows/core-dom-consolidation-v2-retry3.yml .github/workflows/core-dom-consolidation-v2-retry4.yml .github/workflows/core-dom-consolidation-v2-retry5.yml
          git diff --check
          git commit -m "refactor: consolidate DOM semantics in core host"
          git push origin HEAD:fix/source-first-example-fidelity