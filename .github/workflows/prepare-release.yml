name: Prepare Release

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: Release version strategy
        required: true
        type: choice
        options:
          - beta-next
          - promote-stable
          - patch
          - minor
          - major
          - explicit
      version:
        description: Exact version when release_type is explicit
        required: false
        type: string
  issue_comment:
    types: [created]

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: prepare-release
  cancel-in-progress: false

jobs:
  prepare:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.number == 31 &&
        github.event.issue.pull_request == null &&
        github.event.comment.user.login == github.repository_owner &&
        startsWith(github.event.comment.body, '/release ')
      )
    runs-on: ubuntu-latest
    steps:
      - name: Require main as release source
        shell: bash
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Release preparation must run from main; got ${GITHUB_REF}."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Resolve release request
        id: request
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_TYPE: ${{ inputs.release_type }}
          MANUAL_VERSION: ${{ inputs.version }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        shell: bash
        run: |
          release_type="$MANUAL_TYPE"
          version="$MANUAL_VERSION"

          if [[ "$EVENT_NAME" == "issue_comment" ]]; then
            command=""
            extra=""
            read -r command release_type version extra <<< "$COMMENT_BODY"

            if [[ "$command" != "/release" || -n "$extra" ]]; then
              echo "Invalid release command. Expected: /release <type> [version]"
              exit 1
            fi
          fi

          case "$release_type" in
            beta-next|promote-stable|patch|minor|major)
              if [[ -n "$version" ]]; then
                echo "${release_type} does not accept an explicit version."
                exit 1
              fi
              ;;
            explicit)
              if [[ -z "$version" ]]; then
                echo "An explicit version is required when release_type=explicit."
                exit 1
              fi
              ;;
            *)
              echo "Unsupported release type: ${release_type:-<empty>}"
              exit 1
              ;;
          esac

          echo "release_type=${release_type}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Refuse a second open release PR
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          existing=$(gh pr list --state open --base main --json headRefName --jq '.[] | select(.headRefName | startswith("release/v")) | .headRefName' | head -n 1)
          if [[ -n "$existing" ]]; then
            echo "An open release PR already exists: $existing"
            exit 1
          fi

      - name: Prepare version and changelog
        id: release
        env:
          RELEASE_TYPE: ${{ steps.request.outputs.release_type }}
          EXPLICIT_VERSION: ${{ steps.request.outputs.version }}
        shell: bash
        run: |
          args=(prepare --type "$RELEASE_TYPE")
          if [[ "$RELEASE_TYPE" == "explicit" ]]; then
            args+=(--version "$EXPLICIT_VERSION")
          fi
          node scripts/release.mjs "${args[@]}"

      - name: Create release branch
        env:
          VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          branch="release/v${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add packages/solid/package.json CHANGELOG.md
          git commit -m "release: v${VERSION}"

          existing_sha=$(git ls-remote origin "refs/heads/${branch}" | awk '{print $1}')
          if [[ -n "$existing_sha" ]]; then
            echo "Replacing stale release branch ${branch} at ${existing_sha}."
            git push --force-with-lease="refs/heads/${branch}:${existing_sha}" --set-upstream origin "$branch"
          else
            git push --set-upstream origin "$branch"
          fi

      - name: Open release PR
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          branch="release/v${VERSION}"
          cat > /tmp/release-pr.md <<EOF_BODY
          ## Release v${VERSION}

          Generated by **Prepare Release** from the reviewed source currently on main.

          This PR must contain only the package version and changelog transition. The release commit intentionally avoids GitHub skip markers because they can suppress the merged-PR publication trigger after a rebase merge.

          Merge only after the explicitly dispatched **Release Check** workflow is green and the version/changelog are correct. Merging this PR triggers publication of one exact npm tarball, registry verification, the release tag, and the GitHub Release.
          EOF_BODY

          existing_pr=$(gh pr list \
            --state closed \
            --base main \
            --head "$branch" \
            --json number,mergedAt \
            --jq '.[] | select(.mergedAt == null) | .number' \
            | head -n 1)

          if [[ -n "$existing_pr" ]]; then
            if gh pr reopen "$existing_pr"; then
              gh pr edit "$existing_pr" \
                --title "release: v${VERSION}" \
                --body-file /tmp/release-pr.md
              echo "opened=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            echo "Closed release PR #${existing_pr} could not be reopened; creating a new release PR."
          fi

          if gh pr create \
            --base main \
            --head "$branch" \
            --title "release: v${VERSION}" \
            --body-file /tmp/release-pr.md; then
            echo "opened=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "opened=false" >> "$GITHUB_OUTPUT"
          {
            echo "### Release PR requires manual creation"
            echo
            echo "GitHub Actions could not open the pull request, usually because repository policy disallows Actions-created PRs."
            echo
            echo "The prepared branch was retained: \`${branch}\`."
            echo
            echo "Open a PR from \`${branch}\` into \`main\`, then merge only after Release Check is green."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Dispatch release validation
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: gh workflow run release-check.yml --ref "release/v${VERSION}"
