name: Apply GPUIX 0.7 public API parity

on:
  push:
    branches:
      - fix/source-first-example-fidelity

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/source-first-example-fidelity
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - name: Correct gradient typecheck insertion
        shell: python
        run: |
          from pathlib import Path
          path = Path("scripts/apply-gpuix07-public-api.py")
          text = path.read_text()
          start = text.index("# Public JSX typecheck exercises the structured gradient shape.")
          end = text.index("# Exact DAW selector behavior:")
          replacement = '''# Public typecheck exercises the structured gradient shape on the existing StyleDesc fixture.\npath = "packages/solid/test/intrinsics.typecheck.tsx"\nreplace(\n    path,\n    '  background: "#111",\\n',\n    ''' + '"""' + '''  background: {\n    type: "linear-gradient",\n    angle: 90,\n    stops: [\n      { color: "#7c3aed", position: 0 },\n      { color: "#06b6d4", position: 1 },\n    ],\n    colorSpace: "oklab",\n  },\n''' + '"""' + ''',\n)\n\n'''
          path.write_text(text[:start] + replacement + text[end:])
      - name: Apply 0.7 API patch
        run: python scripts/apply-gpuix07-public-api.py
      - name: Integrate structured backgrounds and exact optional handlers
        shell: python
        run: |
          from pathlib import Path

          def replace(path, old, new):
              file = Path(path)
              text = file.read_text()
              if old not in text:
                  raise SystemExit(f"missing integration marker in {path}: {old[:100]!r}")
              file.write_text(text.replace(old, new, 1))

          for path in ["packages/solid/src/native-style.ts", "packages/solid1/src/native-style.ts"]:
              replace(
                  path,
                  'import type { StyleDesc } from "./host/types.js"',
                  'import type { LinearGradientBackground, StyleDesc } from "./host/types.js"',
              )
              old = '''  const result: StyleDesc = { ...style }\n  for (const key of ["background", "backgroundColor", "color", "borderColor", "selectionColor"] as const) {\n    const value = result[key]\n    if (value !== undefined) result[key] = normalizePublishedNativeColor(value)\n  }\n'''
              new = '''  const result: StyleDesc = { ...style }\n  const background = result.background\n  if (background !== undefined) {\n    result.background = isLinearGradientBackground(background)\n      ? {\n          ...background,\n          stops: [\n            { ...background.stops[0], color: normalizePublishedNativeColor(background.stops[0].color) },\n            { ...background.stops[1], color: normalizePublishedNativeColor(background.stops[1].color) },\n          ],\n        }\n      : normalizePublishedNativeColor(background)\n  }\n  for (const key of ["backgroundColor", "color", "borderColor", "selectionColor"] as const) {\n    const value = result[key]\n    if (value !== undefined) result[key] = normalizePublishedNativeColor(value)\n  }\n'''
              replace(path, old, new)
              marker = 'function normalizePublishedNativeColor(value: string): string {'
              helper = '''function isLinearGradientBackground(\n  value: string | LinearGradientBackground,\n): value is LinearGradientBackground {\n  return Object(value) === value\n}\n\n'''
              replace(path, marker, helper + marker)

          for path in ["packages/solid/src/runtime.ts", "packages/solid1/src/runtime.ts"]:
              marker = '  const { renderer: injected, onEvent, onKeyDown, onKeyUp, debugFrameOverlay, ...windowOptions } = options\n'
              replacement = marker + '''  const windowKeyEventHandlers: WindowKeyEventHandlers = {}\n  if (onKeyDown) windowKeyEventHandlers.onKeyDown = onKeyDown\n  if (onKeyUp) windowKeyEventHandlers.onKeyUp = onKeyUp\n'''
              replace(path, marker, replacement)
              file = Path(path)
              file.write_text(file.read_text().replace('{ onKeyDown, onKeyUp }', 'windowKeyEventHandlers'))
      - name: Verify Solid 2 API
        run: |
          bun install --frozen-lockfile
          bun run --filter 'gpuix-solid' typecheck
          bun run --filter 'gpuix-solid' test
          bun run --filter 'gpuix-solid' build
      - name: Verify Solid 1 API and DAW source bridge
        run: |
          cd packages/solid1
          bun install --no-save
          bun run typecheck
          bun run test
          bun run build
          node scripts/validate-package.mjs
          cd ../../examples/solid1-daw
          bun install --no-save
          bun run source:check
          bun run typecheck
      - name: Remove temporary patch machinery
        run: |
          rm .github/workflows/apply-gpuix07-public-api.yml
          rm scripts/apply-gpuix07-public-api.py
      - name: Commit API parity fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/solid packages/solid1 examples/solid1-daw/src/test.tsx examples/counter/src/benchmarks/chat.tsx examples/counter/src/benchmarks/timeline.tsx .github/workflows/apply-gpuix07-public-api.yml scripts/apply-gpuix07-public-api.py
          git commit -m 'feat: expose GPUIX 0.7 host APIs'
          git push origin HEAD:fix/source-first-example-fidelity
