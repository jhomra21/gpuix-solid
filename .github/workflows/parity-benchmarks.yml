name: Parity benchmarks

on:
  push:
    branches:
      - experiment/parity-benchmarks

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Chat workload
        run: bun run perf:chat
      - name: Timeline workload
        run: bun run perf:timeline
      - name: Serialization workload
        env:
          TURNS: 1000
          ITERATIONS: 5
        run: bun run bench:serialization
