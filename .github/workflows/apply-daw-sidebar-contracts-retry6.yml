name: Apply DAW sidebar contracts retry6

on:
  push:
    branches:
      - fix/source-first-example-fidelity
    paths:
      - .github/workflows/apply-daw-sidebar-contracts-retry6.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/source-first-example-fidelity
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - name: Reapply validated DAW contract transformation
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess

          workflow = Path('.github/workflows/apply-daw-sidebar-contracts-retry5.yml').read_text().splitlines()
          wanted = {'Reapply source contract and context-menu fix', 'Match upstream track kind model'}
          current = None
          collecting = False
          blocks = []
          lines = []
          for line in workflow:
              if line.startswith('      - name: '):
                  if current in wanted and lines:
                      blocks.append((current, '\n'.join(lines) + '\n'))
                  current = line.split(': ', 1)[1]
                  collecting = False
                  lines = []
                  continue
              if current in wanted and line == '        run: |':
                  collecting = True
                  continue
              if collecting:
                  if line.startswith('      - '):
                      blocks.append((current, '\n'.join(lines) + '\n'))
                      current = None
                      collecting = False
                      lines = []
                  else:
                      lines.append(line[10:] if line.startswith('          ') else line)
          if current in wanted and lines:
              blocks.append((current, '\n'.join(lines) + '\n'))
          if {name for name, _ in blocks} != wanted:
              raise SystemExit('failed to recover DAW contract transformation')
          for name, script in blocks:
              print(f'== {name} ==')
              subprocess.run(['bash', '-euo', 'pipefail', '-c', script], check=True)
          PY
      - name: Normalize legacy native track kinds at adapter boundary
        run: |
          python - <<'PY'
          from pathlib import Path
          paths = [
              Path('examples/solid1-daw/src/native/TimelineWorkspace.tsx'),
              Path('examples/solid1-daw/src/native/TrackLane.tsx'),
          ]
          old = 'kind: track.kind === "midi" ? "instrument" : track.kind,'
          new = 'kind: track.kind === "midi" ? "instrument" : track.kind === "audio" ? "audio" : undefined,'
          for path in paths:
              text = path.read_text()
              if old not in text:
                  raise SystemExit(f'adapter kind expression not found in {path}')
              path.write_text(text.replace(old, new, 1))
          PY
      - name: Validate source, host, Kobalte, and DAW types
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          cd packages/solid1
          bun install --no-save
          bun run typecheck
          bun run test
          bun run build
          cd ../../examples/solid1-kobalte
          bun install --no-save
          bun run typecheck
          cd ../solid1-daw
          bun install --no-save
          bun run source:check
          bun run generate:styles
          bunx tsc --noEmit
          bun run source:check
      - name: Commit validated contracts
        run: |
          set -euo pipefail
          rm -f .github/workflows/diagnose-daw-compat.yml
          rm -f .github/workflows/apply-daw-sidebar-contracts.yml
          rm -f .github/workflows/apply-daw-sidebar-contracts-retry.yml
          rm -f .github/workflows/apply-daw-sidebar-contracts-retry2.yml
          rm -f .github/workflows/apply-daw-sidebar-contracts-retry3.yml
          rm -f .github/workflows/apply-daw-sidebar-contracts-retry4.yml
          rm -f .github/workflows/apply-daw-sidebar-contracts-retry5.yml
          rm -f .github/workflows/apply-daw-sidebar-contracts-retry6.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "refactor: source-lock DAW sidebar contracts"
          git push origin HEAD:fix/source-first-example-fidelity
