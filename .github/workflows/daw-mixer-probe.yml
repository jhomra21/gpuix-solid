name: Disposable DAW mixer visual probe

on:
  push:
    branches:
      - perf/daw-ab-20260912

permissions:
  contents: read

jobs:
  mixer-probe:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Patch disposable native-tree probe
        run: node scripts/patch-daw-perf-testing.mjs packages/solid1/src/testing.ts
      - name: Build Solid 1 package
        run: bun run solid1:package
      - name: Build focused DAW probe
        run: |
          cd examples/solid1-daw
          bun install --no-save
          cp src/mixer-visual-probe.tsx src/test-entry.tsx
          bun run build:test:edge
      - name: Run focused DAW probe
        run: bun examples/solid1-daw/dist/test/test.js
