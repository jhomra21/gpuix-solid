name: Rust Backtrace Diagnostic

on:
  push:
    branches:
      - fix/source-first-example-fidelity

permissions:
  contents: read

jobs:
  counter-live-backtrace:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Capture native live automation backtrace
        env:
          RUST_BACKTRACE: "full"
        run: bun run examples:live
