name: Normalize GPUIX surface example

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/rename-gpuix-surface.yml"
      - "scripts/rename-gpuix-surface.mjs"

permissions:
  contents: write

jobs:
  rename:
    if: github.head_ref == 'feat/gpuix-0.9-solid-parity'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.0
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.0.2
        with:
          bun-version: 1.3.14

      - name: Rename current surface
        run: node scripts/rename-gpuix-surface.mjs

      - name: Install exact lock
        run: bun install --frozen-lockfile

      - name: Validate renamed surface
        run: |
          bun run source:ownership
          bun run --filter 'gpuix-solid' build
          bun run --filter 'gpuix-solid-counter' typecheck
          bun run --filter 'gpuix-solid-counter' test:gpuix-surface

      - name: Check stale names
        run: |
          test ! -e examples/counter/src/gpuix-08
          test ! -e examples/counter/vite.gpuix-08.config.ts
          test ! -e examples/counter/vite.gpuix-08-test.config.ts
          ! grep -F 'example:gpuix-08' README.md examples/README.md examples/source-ownership.json package.json
          ! grep -F 'gpuix-08' examples/counter/package.json examples/counter/src/readme-gallery/capture.tsx scripts/test-published-foreground.mjs

      - name: Remove one-shot rename files
        run: |
          rm .github/workflows/rename-gpuix-surface.yml
          rm scripts/rename-gpuix-surface.mjs

      - name: Commit normalized surface
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "refactor: make GPUIX surface example version-neutral"
          git push origin HEAD:${{ github.head_ref }}
