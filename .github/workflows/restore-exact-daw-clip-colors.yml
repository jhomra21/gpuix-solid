name: Restore exact DAW clip colors

on:
  push:
    branches:
      - fix/source-first-example-fidelity
    paths:
      - .github/restore-exact-daw-clip-colors.py
      - .github/workflows/restore-exact-daw-clip-colors.yml

permissions:
  contents: write

jobs:
  validate-and-promote:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/source-first-example-fidelity
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Apply exact source and host compatibility
        run: python3 .github/restore-exact-daw-clip-colors.py

      - name: Install
        run: bun install --frozen-lockfile

      - name: Validate release-facing tree
        run: |
          bun run lint
          bun run typecheck
          bun run test
          bun run build
          bun run solid1:check
          bun run release:test
          git diff --check

      - name: Promote clean product changes
        if: success()
        run: |
          rm .github/restore-exact-daw-clip-colors.py
          rm .github/workflows/restore-exact-daw-clip-colors.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: restore exact DAW clip colors"
          git push origin HEAD:fix/source-first-example-fidelity
