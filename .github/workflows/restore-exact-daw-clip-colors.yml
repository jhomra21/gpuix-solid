name: Restore exact DAW clip colors

on:
  push:
    branches:
      - fix/source-first-example-fidelity
    paths:
      - .github/restore-exact-daw-clip-colors.py
      - .github/workflows/restore-exact-daw-clip-colors.yml

permissions:
  contents: write

jobs:
  validate-and-promote:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/source-first-example-fidelity
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Apply exact source and host compatibility
        run: |
          python3 - <<'PY'
          from pathlib import Path

          script_path = Path('.github/restore-exact-daw-clip-colors.py')
          script = script_path.read_text()
          old = '        mix_helper,\n        text,\n'
          new = '        lambda _match: mix_helper,\n        text,\n'
          if script.count(old) != 1:
              raise SystemExit('expected one regex replacement callback anchor')
          script_path.write_text(script.replace(old, new, 1))
          PY
          python3 .github/restore-exact-daw-clip-colors.py
          python3 - <<'PY'
          from pathlib import Path

          test_path = Path('examples/solid1-daw/src/test.tsx')
          text = test_path.read_text()

          select_anchor = (
              '  requireCondition(app.renderer.hasCustomProps(drumsAudioClip), "exact ClipComponent should expose the source clip title")\n'
              '  app.renderer.clickCenterCustomProps(drumsAudioClip)\n'
          )
          select_replacement = (
              '  requireCondition(app.renderer.hasCustomProps(drumsAudioClip), "exact ClipComponent should expose the source clip title")\n'
              '  const unselectedDrumsClipStyle = app.renderer.styleCustomPropsWithinTestId("lane-drums", drumsAudioClip)\n'
              '  requireCondition(\n'
              '    unselectedDrumsClipStyle.backgroundColor === "rgba(0, 167, 108, 0.2)",\n'
              '    `exact unselected audio clip should preserve the source 20% color mix, got ${JSON.stringify(unselectedDrumsClipStyle)}`,\n'
              '  )\n'
              '  requireCondition(\n'
              '    unselectedDrumsClipStyle.borderRadius === undefined,\n'
              '    `exact source ClipComponent should not gain a native rounded-corner approximation, got ${JSON.stringify(unselectedDrumsClipStyle)}`,\n'
              '  )\n'
              '  app.renderer.clickCenterCustomProps(drumsAudioClip)\n'
          )
          if text.count(select_anchor) != 1:
              raise SystemExit(f'expected one clip-selection insertion anchor, found {text.count(select_anchor)}')
          text = text.replace(select_anchor, select_replacement, 1)

          stale_assertion = (
              '  requireCondition(\n'
              '    app.renderer.styleCustomPropsWithinTestId("lane-drums", drumsAudioClip).borderColor === "#60a5fa",\n'
              '    `first exact audio-clip tap should select the source ClipComponent, got ${JSON.stringify(app.renderer.styleCustomPropsWithinTestId("lane-drums", drumsAudioClip))}`,\n'
              '  )\n'
          )
          exact_assertion = (
              '  const selectedDrumsClipStyle = app.renderer.styleCustomPropsWithinTestId("lane-drums", drumsAudioClip)\n'
              '  requireCondition(\n'
              '    selectedDrumsClipStyle.backgroundColor === "rgba(0, 167, 108, 0.3)" && selectedDrumsClipStyle.boxShadow !== undefined,\n'
              '    `first exact audio-clip tap should preserve the source 30% selected color mix and selection ring, got ${JSON.stringify(selectedDrumsClipStyle)}`,\n'
              '  )\n'
          )
          if text.count(stale_assertion) != 1:
              raise SystemExit(f'expected one stale clip-selection assertion, found {text.count(stale_assertion)}')
          test_path.write_text(text.replace(stale_assertion, exact_assertion, 1))
          PY

      - name: Install
        run: bun install --frozen-lockfile

      - name: Validate release-facing tree
        run: |
          bun run lint
          bun run typecheck
          bun run test
          bun run build
          bun run solid1:check
          bun run release:test
          git diff --check

      - name: Promote clean product changes
        if: success()
        run: |
          rm .github/restore-exact-daw-clip-colors.py
          rm .github/workflows/restore-exact-daw-clip-colors.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: restore exact DAW clip colors"
          git push origin HEAD:fix/source-first-example-fidelity
