name: Apply source-first closure

on:
  push:
    branches:
      - fix/source-first-example-fidelity
    paths:
      - ".github/apply-source-first-closure.py"
      - ".github/workflows/apply-source-first-closure.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/source-first-example-fidelity
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Install GPUI Linux runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfontconfig-dev \
            libwayland-dev \
            libxkbcommon-x11-dev \
            libssl-dev \
            libzstd-dev \
            libvulkan1 \
            vulkan-validationlayers
      - name: Restore exact pinned DAW stylesheet
        run: |
          curl --fail --location --silent --show-error \
            https://raw.githubusercontent.com/jhomra21/daw-browser-convex/2eaad47813b15aa8511bab8dc04625510c977b12/src/index.css \
            --output examples/solid1-daw/src/upstream/index.css
          test "$(git hash-object examples/solid1-daw/src/upstream/index.css)" = "49cd4caf64052b7bc042af98d83a4f550cb4f88e"
      - name: Apply permanent closure
        run: python3 .github/apply-source-first-closure.py
      - run: bun install --frozen-lockfile
      - name: Validate source-first closure
        run: |
          bun run lint
          bun run typecheck
          bun run test
          bun run build
          bun run solid1:package
          bun run solid1:daw
          git diff --check
      - name: Commit validated closure and remove scaffolding
        run: |
          rm -f .github/apply-source-first-closure.py
          rm -f .github/workflows/apply-source-first-closure.yml
          rm -f .github/source-first-probe.py
          rm -f .github/workflows/source-first-daw-debug.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: close source-first DAW style gaps"
          git push origin HEAD:fix/source-first-example-fidelity
