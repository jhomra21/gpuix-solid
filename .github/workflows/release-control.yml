name: Release Control

on:
  issue_comment:
    types: [created]

permissions:
  actions: write
  contents: write
  issues: write

concurrency:
  group: release-control
  cancel-in-progress: false

jobs:
  recover:
    if: >-
      github.event.issue.number == 31 &&
      github.event.issue.pull_request == null &&
      github.event.comment.user.login == github.repository_owner &&
      github.event.comment.body == '/recover-release'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch hardened publish recovery
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          echo "Dispatching publish.yml recovery from main."
          gh workflow run publish.yml --repo "$GITHUB_REPOSITORY" --ref main

  verify:
    if: >-
      github.event.issue.number == 31 &&
      github.event.issue.pull_request == null &&
      github.event.comment.user.login == github.repository_owner &&
      github.event.comment.body == '/verify-release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Use pinned npm registry client
        shell: bash
        run: npm install --global npm@11.19.0

      - name: Verify registry integrity, dist-tag, and provenance policy
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          package=$(node -p 'require("./packages/solid/package.json").name')
          version=$(node -p 'require("./packages/solid/package.json").version')
          metadata=$(npm view "${package}@${version}" --json)

          mapfile -t fields < <(
            printf '%s' "$metadata" | node -e '
              let source = ""
              process.stdin.on("data", (chunk) => { source += chunk })
              process.stdin.on("end", () => {
                let value = JSON.parse(source)
                if (Array.isArray(value)) value = value.at(-1)
                const attestations = value?.dist?.attestations
                process.stdout.write([
                  value?.version ?? "",
                  value?.dist?.integrity ?? "",
                  attestations?.url ?? "",
                  attestations?.provenance?.predicateType ?? "",
                ].join("\n"))
              })
            '
          )

          remote_version="${fields[0]:-}"
          remote_integrity="${fields[1]:-}"
          attestation_url="${fields[2]:-}"
          provenance_predicate="${fields[3]:-}"

          if [[ "$remote_version" != "$version" ]]; then
            echo "Registry returned version ${remote_version:-<missing>}; expected ${version}."
            exit 1
          fi
          if [[ "$remote_integrity" != sha512-* ]]; then
            echo "Registry integrity is missing or malformed: ${remote_integrity:-<missing>}"
            exit 1
          fi

          provenance_policy=$(node scripts/release-policy.mjs --package "$package" --version "$version")
          if [[ "$provenance_policy" == "required" ]]; then
            if [[ "$attestation_url" != https://registry.npmjs.org/-/npm/v1/attestations/* ]]; then
              echo "npm provenance attestation URL is missing or unexpected: ${attestation_url:-<missing>}"
              exit 1
            fi
            if [[ -z "$provenance_predicate" ]]; then
              echo "npm provenance predicate is missing."
              exit 1
            fi
            provenance_summary="provenance ${provenance_predicate}; attestation ${attestation_url}"
          elif [[ "$provenance_policy" == "bootstrap-exception" ]]; then
            if [[ -n "$attestation_url" || -n "$provenance_predicate" ]]; then
              if [[ "$attestation_url" != https://registry.npmjs.org/-/npm/v1/attestations/* ]]; then
                echo "npm provenance attestation URL is malformed for bootstrap release: ${attestation_url:-<missing>}"
                exit 1
              fi
              if [[ -z "$provenance_predicate" ]]; then
                echo "npm provenance predicate is incomplete for bootstrap release."
                exit 1
              fi
              provenance_summary="provenance ${provenance_predicate}; attestation ${attestation_url}"
            else
              provenance_summary="provenance intentionally absent for one-time manual bootstrap ${package}@${version}"
            fi
          else
            echo "Unknown provenance policy result: ${provenance_policy:-<missing>}"
            exit 1
          fi

          expected_tag=latest
          if [[ "$version" == *-* ]]; then expected_tag=beta; fi
          tagged_version=$(npm view "$package" dist-tags --json | node -e 'let s=""; process.stdin.on("data", c => s += c); process.stdin.on("end", () => { const tags=JSON.parse(s); process.stdout.write(tags[process.argv[1]] ?? ""); })' "$expected_tag")
          if [[ "$tagged_version" != "$version" ]]; then
            echo "Expected npm dist-tag ${expected_tag} -> ${version}, got ${tagged_version:-<missing>}."
            exit 1
          fi

          gh issue comment 31 --repo "$GITHUB_REPOSITORY" --body "Release verification complete: v${version}; npm ${expected_tag} -> ${version}; registry integrity verified; ${provenance_summary}."

  finalize:
    if: >-
      github.event.issue.number == 31 &&
      github.event.issue.pull_request == null &&
      github.event.comment.user.login == github.repository_owner &&
      github.event.comment.body == '/finalize-release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Validate package, tag, and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          package=$(node -p 'require("./packages/solid/package.json").name')
          version=$(node -p 'require("./packages/solid/package.json").version')
          tag="v${version}"
          git fetch --tags --force

          release_sha=""
          while read -r sha; do
            commit_version=$(git show "${sha}:packages/solid/package.json" | node -e 'let s=""; process.stdin.on("data", c => s += c); process.stdin.on("end", () => process.stdout.write(JSON.parse(s).version))')
            if [[ "$commit_version" != "$version" ]]; then
              continue
            fi

            parent_sha=$(git rev-parse "${sha}^" 2>/dev/null || true)
            parent_version=""
            if [[ -n "$parent_sha" ]] && git cat-file -e "${parent_sha}:packages/solid/package.json" 2>/dev/null; then
              parent_version=$(git show "${parent_sha}:packages/solid/package.json" | node -e 'let s=""; process.stdin.on("data", c => s += c); process.stdin.on("end", () => process.stdout.write(JSON.parse(s).version))')
            fi

            if [[ "$parent_version" != "$version" ]]; then
              release_sha="$sha"
              break
            fi
          done < <(git log --first-parent --format=%H -- packages/solid/package.json)

          if [[ -z "$release_sha" ]]; then
            echo "Could not locate the main-branch commit that introduced ${version}."
            exit 1
          fi

          if ! git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "${tag} does not exist; use /recover-release first."
            exit 1
          fi

          tagged_commit=$(git rev-list -n 1 "$tag")
          if [[ "$tagged_commit" != "$release_sha" ]]; then
            echo "${tag} points to ${tagged_commit}, expected ${release_sha}."
            exit 1
          fi

          remote_integrity=$(npm view "${package}@${version}" dist.integrity 2>/dev/null || true)
          if [[ "$remote_integrity" != sha512-* ]]; then
            echo "Could not verify npm integrity for ${package}@${version}."
            exit 1
          fi

          expected_tag=latest
          if [[ "$version" == *-* ]]; then expected_tag=beta; fi
          tagged_version=$(npm view "$package" dist-tags --json | node -e 'let s=""; process.stdin.on("data", c => s += c); process.stdin.on("end", () => { const tags=JSON.parse(s); process.stdout.write(tags[process.argv[1]] ?? ""); })' "$expected_tag")
          if [[ "$tagged_version" != "$version" ]]; then
            echo "Expected npm dist-tag ${expected_tag} -> ${version}, got ${tagged_version:-<missing>}."
            exit 1
          fi

          state="already existed"
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            node scripts/release.mjs notes --version "$version" > /tmp/release-notes.md
            args=(release create "$tag" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$tag" --notes-file /tmp/release-notes.md)
            if [[ "$version" == *-* ]]; then args+=(--prerelease); fi
            gh "${args[@]}"
            state="created"
          fi

          gh issue comment 31 --repo "$GITHUB_REPOSITORY" --body "Release finalization complete: ${tag} ${state}; tag target ${release_sha}; npm ${expected_tag} -> ${version}; registry integrity verified."
