name: Sync source fidelity references

on:
  push:
    branches:
      - fix/source-first-example-fidelity
    paths:
      - .github/workflows/sync-source-fidelity.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Vendor exact pinned GPUIX sources and assets
        shell: bash
        run: |
          set -euo pipefail
          PIN=09e0caeb1812eece10a3a8a7200ef18567610267
          rm -rf /tmp/gpuix-upstream examples/counter/upstream/gpuix
          git clone -q https://github.com/remorses/gpuix.git /tmp/gpuix-upstream
          git -C /tmp/gpuix-upstream checkout -q "$PIN"

          mkdir -p examples/counter/upstream/gpuix/examples
          mkdir -p examples/counter/upstream/gpuix/example-app
          cp -R /tmp/gpuix-upstream/examples/assets examples/counter/upstream/gpuix/examples/assets

          for file in counter.tsx native-text.tsx blurred-window.tsx diff.tsx timeline.tsx timeline-data.ts chat.tsx infinite-chat.tsx; do
            cp "/tmp/gpuix-upstream/examples/$file" "examples/counter/upstream/gpuix/examples/$file"
          done
          cp /tmp/gpuix-upstream/example-app/app.tsx examples/counter/upstream/gpuix/example-app/app.tsx

          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path

          pin = "09e0caeb1812eece10a3a8a7200ef18567610267"
          source = Path("/tmp/gpuix-upstream")
          dest = Path("examples/counter/upstream/gpuix")
          paths = [
              "examples/counter.tsx",
              "examples/native-text.tsx",
              "examples/blurred-window.tsx",
              "examples/diff.tsx",
              "examples/timeline.tsx",
              "examples/timeline-data.ts",
              "examples/chat.tsx",
              "examples/infinite-chat.tsx",
              "example-app/app.tsx",
          ]
          paths.extend(
              str(path.relative_to(source))
              for path in sorted((source / "examples/assets").rglob("*"))
              if path.is_file()
          )
          blobs = {}
          for path in paths:
              sha = subprocess.check_output(
                  ["git", "-C", str(source), "rev-parse", f"{pin}:{path}"],
                  text=True,
              ).strip()
              blobs[path] = sha
          lock = {
              "repository": "remorses/gpuix",
              "commit": pin,
              "blobs": blobs,
          }
          (dest / "upstream-lock.json").write_text(json.dumps(lock, indent=2) + "\n")
          PY

          git rm .github/workflows/sync-source-fidelity.yml
          git add examples/counter/upstream/gpuix
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "chore: vendor pinned GPUIX example sources"
          git push
