name: Temporary DAW Tailwind classList regeneration

on:
  push:
    branches:
      - fix/source-first-example-fidelity
    paths:
      - .github/workflows/tmp-daw-tailwind-classlist.yml

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/source-first-example-fidelity
          persist-credentials: true
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Commit source-aware DAW Tailwind compatibility
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          generator = Path("examples/solid1-daw/scripts/generate-native-tailwind.mjs")
          source = generator.read_text()
          old = "\n".join([
              '      if (ts.isJsxAttribute(node) && (node.name.text === "class" || node.name.text === "className")) {',
              '        collectClassExpression(node.initializer, candidates)',
              '        return',
              '      }',
          ])
          new = "\n".join([
              '      if (ts.isJsxAttribute(node)) {',
              '        const attributeName = node.name.text',
              '        if (attributeName === "class" || attributeName === "className") {',
              '          collectClassExpression(node.initializer, candidates)',
              '          return',
              '        }',
              '        if (attributeName === "classList") {',
              '          collectClassListExpression(node.initializer, candidates)',
              '          return',
              '        }',
              '      }',
          ])
          if old not in source:
              raise SystemExit("Could not find JSX class collector block")
          source = source.replace(old, new, 1)
          marker = 'function addClassString(value, candidates) {'
          helper = '''function collectClassListExpression(node, candidates) {
            if (!node) return

            if (ts.isJsxExpression(node)) {
              collectClassListExpression(node.expression, candidates)
              return
            }

            if (!ts.isObjectLiteralExpression(node)) return

            for (const property of node.properties) {
              if (ts.isPropertyAssignment(property)) {
                collectClassListKey(property.name, candidates)
                continue
              }
              if (ts.isSpreadAssignment(property)) {
                collectClassListExpression(property.expression, candidates)
              }
            }
          }

          function collectClassListKey(name, candidates) {
            if (ts.isStringLiteralLike(name) || ts.isNoSubstitutionTemplateLiteral(name)) {
              addClassString(name.text, candidates)
              return
            }
            if (ts.isIdentifier(name)) {
              addClassString(name.text, candidates)
              return
            }
            if (ts.isComputedPropertyName(name)) {
              collectClassExpression(name.expression, candidates)
            }
          }

          function addClassString(value, candidates) {'''
          if marker not in source:
              raise SystemExit("Could not find addClassString marker")
          generator.write_text(source.replace(marker, helper, 1))

          candidates = Path("examples/solid1-daw/src/native-tailwind-runtime-candidates.tsx")
          source = candidates.read_text()
          anchor = '      {/* TransportControls.tsx: centerIconButtonClass */}\n      <div class="h-7 w-7 text-muted-foreground hover:bg-timeline-surface-muted hover:text-foreground" />\n'
          replacement = anchor + '      {/* compat/utils.ts: bg-current fallback for the source record dot; GPUIX 0.7 cannot resolve inherited currentColor for native backgrounds */}\n      <div class="bg-muted-foreground" />\n'
          if anchor not in source:
              raise SystemExit("Could not find runtime candidate anchor")
          candidates.write_text(source.replace(anchor, replacement, 1))

          compat = Path("examples/solid1-daw/src/compat/utils.ts")
          source = compat.read_text()
          old = 'export function cn(...inputs: Parameters<typeof sourceCn>): string {\n  return sourceCn(...inputs)\n    .split(/\\s+/)\n    .map((className) => className === "bg-current" ? "bg-muted-foreground" : className)\n    .join(" ")\n}\n'
          new = '// GPUIX 0.7 parses absolute background colors but has no inherited currentColor\n// background contract. The only pinned DAW bg-current use is the inactive record\n// dot inside a text-muted-foreground button, so preserve that source base-state\n// color until native parent-state/currentColor inheritance is representable.\nexport function cn(...inputs: Parameters<typeof sourceCn>): string {\n  return sourceCn(...inputs)\n    .split(/\\s+/)\n    .map((className) => className === "bg-current" ? "bg-muted-foreground" : className)\n    .join(" ")\n}\n'
          if old not in source:
              raise SystemExit("Could not find compat cn implementation")
          compat.write_text(source.replace(old, new, 1))
          PY
      - name: Validate source-derived native Tailwind manifest
        run: |
          cd examples/solid1-daw
          bun install --no-save
          bun scripts/generate-native-tailwind.mjs
          grep -q '"bg-muted-foreground"' src/native-tailwind.generated.ts
          bun run source:check
      - name: Commit and self-clean
        shell: bash
        run: |
          git rm .github/workflows/tmp-daw-tailwind-classlist.yml
          git add examples/solid1-daw/scripts/generate-native-tailwind.mjs examples/solid1-daw/src/native-tailwind-runtime-candidates.tsx examples/solid1-daw/src/compat/utils.ts
          git diff --check --cached
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: account for Solid classList Tailwind styles"
          git push origin HEAD:fix/source-first-example-fidelity
