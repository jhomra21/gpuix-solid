name: Temporary DAW Tailwind classList regeneration

on:
  push:
    branches:
      - fix/source-first-example-fidelity
    paths:
      - .github/workflows/tmp-daw-tailwind-classlist.yml

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/source-first-example-fidelity
          persist-credentials: true
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Teach the DAW Tailwind collector about Solid classList
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("examples/solid1-daw/scripts/generate-native-tailwind.mjs")
          source = path.read_text()
          old = "\n".join([
              '      if (ts.isJsxAttribute(node) && (node.name.text === "class" || node.name.text === "className")) {',
              '        collectClassExpression(node.initializer, candidates)',
              '        return',
              '      }',
          ])
          new = "\n".join([
              '      if (ts.isJsxAttribute(node)) {',
              '        const attributeName = node.name.text',
              '        if (attributeName === "class" || attributeName === "className") {',
              '          collectClassExpression(node.initializer, candidates)',
              '          return',
              '        }',
              '        if (attributeName === "classList") {',
              '          collectClassListExpression(node.initializer, candidates)',
              '          return',
              '        }',
              '      }',
          ])
          if old not in source:
              raise SystemExit("Could not find JSX class collector block")
          source = source.replace(old, new, 1)

          marker = 'function addClassString(value, candidates) {'
          helper = '''function collectClassListExpression(node, candidates) {
            if (!node) return

            if (ts.isJsxExpression(node)) {
              collectClassListExpression(node.expression, candidates)
              return
            }

            if (!ts.isObjectLiteralExpression(node)) return

            for (const property of node.properties) {
              if (ts.isPropertyAssignment(property)) {
                collectClassListKey(property.name, candidates)
                continue
              }
              if (ts.isSpreadAssignment(property)) {
                collectClassListExpression(property.expression, candidates)
              }
            }
          }

          function collectClassListKey(name, candidates) {
            if (ts.isStringLiteralLike(name) || ts.isNoSubstitutionTemplateLiteral(name)) {
              addClassString(name.text, candidates)
              return
            }
            if (ts.isIdentifier(name)) {
              addClassString(name.text, candidates)
              return
            }
            if (ts.isComputedPropertyName(name)) {
              collectClassExpression(name.expression, candidates)
            }
          }

          function addClassString(value, candidates) {'''
          if marker not in source:
              raise SystemExit("Could not find addClassString marker")
          source = source.replace(marker, helper, 1)
          path.write_text(source)
          PY
      - name: Regenerate the source-derived native Tailwind manifest
        run: |
          cd examples/solid1-daw
          bun install --no-save
          bun scripts/generate-native-tailwind.mjs
          grep -q '"bg-muted-foreground"' src/native-tailwind.generated.ts
      - name: Commit the generic collector fix and regenerated manifest
        shell: bash
        run: |
          git rm .github/workflows/tmp-daw-tailwind-classlist.yml
          git add examples/solid1-daw/scripts/generate-native-tailwind.mjs examples/solid1-daw/src/native-tailwind.generated.ts
          git diff --check --cached
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: collect Solid classList styles for DAW"
          git push origin HEAD:fix/source-first-example-fidelity
