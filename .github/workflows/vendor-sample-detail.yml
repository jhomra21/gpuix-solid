name: Vendor exact Sample Detail closure

on:
  push:
    branches:
      - fix/source-first-example-fidelity
    paths:
      - .github/vendor-sample-detail.py
      - .github/sample-detail-closure-fix.py
      - .github/workflows/vendor-sample-detail.yml

permissions:
  contents: write

jobs:
  close-source:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - name: Vendor pinned Sample Detail source
        run: |
          python3 .github/vendor-sample-detail.py
          python3 .github/sample-detail-closure-fix.py
      - name: Install
        run: bun install --frozen-lockfile
      - name: Validate repository
        run: |
          bun run lint
          bun run typecheck
          bun run test
          bun run build
      - name: Build the Solid1 host once
        run: |
          cd packages/solid1
          bun install --no-save
          bun run build
      - name: Validate DAW against the built host
        run: |
          cd examples/solid1-daw
          bun install --no-save
          bun run source:check
          bun run generate:styles
          ./node_modules/.bin/tsc --noEmit
          ./node_modules/.bin/vite build --config vite.test.config.ts
          bun scripts/run-test.mjs
      - name: Check patch
        run: git diff --check
      - name: Commit validated source closure
        run: |
          rm .github/vendor-sample-detail.py .github/sample-detail-closure-fix.py .github/workflows/vendor-sample-detail.yml
          git add -A
          test -n "$(git status --porcelain)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat: restore exact Sample Detail source closure"
          git push origin HEAD:fix/source-first-example-fidelity
