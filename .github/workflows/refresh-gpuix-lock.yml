name: Finish GPUIX 0.7 migration

on:
  push:
    branches:
      - fix/source-first-example-fidelity

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/source-first-example-fidelity
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - name: Resolve GPUIX 0.7 and adopt its test availability API
        shell: python
        run: |
          import pathlib
          import subprocess

          subprocess.run(["bun", "install"], check=True)

          for path in [
              pathlib.Path("packages/solid/src/testing.ts"),
              pathlib.Path("packages/solid1/src/testing.ts"),
          ]:
              text = path.read_text()
              old_type = "type NativeModule = { TestGpuixRenderer?: NativeTestRendererConstructor }"
              new_type = """type NativeModule = {
            TestGpuixRenderer?: NativeTestRendererConstructor
            hasTestGpuixRenderer?: () => boolean
          }"""
              if old_type not in text:
                  raise SystemExit(f"missing NativeModule marker in {path}")
              text = text.replace(old_type, new_type, 1)
              marker = "    return nativeModule.TestGpuixRenderer\n"
              replacement = "    if (nativeModule.hasTestGpuixRenderer?.() !== true) return undefined\n    return nativeModule.TestGpuixRenderer\n"
              if marker not in text:
                  raise SystemExit(f"missing renderer return marker in {path}")
              text = text.replace(marker, replacement, 1)
              text = text.replace(
                  "/** Whether this installed native build exports the GPU-backed test renderer. */",
                  "/** Whether this installed native build provides the real GPU-backed test renderer. */",
              )
              path.write_text(text)

          pathlib.Path(".github/workflows/refresh-gpuix-lock.yml").unlink()
      - name: Verify migration
        run: |
          grep -F '"@gpuix/native": "^0.7.0"' packages/solid/package.json
          grep -F '"@gpuix/native": "^0.7.0"' packages/solid1/package.json
          grep -F '@gpuix/native@0.7.0' bun.lock
          test ! -e .github/workflows/refresh-gpuix-lock.yml
      - name: Commit generated lock and compatibility update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bun.lock packages/solid/src/testing.ts packages/solid1/src/testing.ts .github/workflows/refresh-gpuix-lock.yml
          git commit -m 'chore: finish GPUIX 0.7 migration'
          git push origin HEAD:fix/source-first-example-fidelity
