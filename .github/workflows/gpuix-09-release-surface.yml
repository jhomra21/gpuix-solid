name: GPUIX 0.9 release surface

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/gpuix-09-release-surface.yml"
      - "scripts/finish-gpuix-09-release-surface.mjs"

permissions:
  contents: write

jobs:
  refresh:
    if: github.head_ref == 'feat/gpuix-0.9-solid-parity'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.0
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.0.2
        with:
          bun-version: 1.3.14

      - name: Match current examples wording
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("scripts/finish-gpuix-09-release-surface.mjs")
          source = path.read_text()
          source = source.replace(
              '"All Solid 2 examples run through the `gpuix-solid` workspace package and the published `@gpuix/native ^0.8.0` contract.",',
              '"All Solid 2 examples compile with Solid\'s universal renderer and execute as native Bun processes through `@gpuix/native ^0.8.0`. They are not browser apps or Electron windows.",',
          ).replace(
              '"All Solid 2 examples run through the `gpuix-solid` workspace package and the exact published `@gpuix/native@0.9.0` contract.",',
              '"All Solid 2 examples compile with Solid\'s universal renderer and execute as native Bun processes through exact `@gpuix/native@0.9.0`. They are not browser apps or Electron windows.",',
          )
          path.write_text(source)
          PY

      - name: Refresh current 0.9 docs and example
        run: node scripts/finish-gpuix-09-release-surface.mjs

      - name: Finish focused examples wording
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("examples/README.md")
          source = path.read_text()
          replacements = {
              "## Focused GPUIX 0.8 surface": "## Focused GPUIX 0.9 surface",
              "It currently demonstrates three 0.8 capabilities that have both Solid host mappings and runnable native checks:": "It demonstrates the current GPUIX 0.9 surface with Solid host mappings and runnable native checks:",
              "Upstream GPUIX 0.8 also contains other useful native changes, including HTTP image loading, file-drop/window work, and updated interaction behavior.": "The GPUIX 0.9 baseline also carries the earlier HTTP image, file-drop/window, and interaction improvements.",
              "The native execution baseline is GPUIX 0.8.": "The native execution baseline is GPUIX 0.9.",
          }
          for old, new in replacements.items():
              if old not in source:
                  raise SystemExit(f"missing examples wording: {old}")
              source = source.replace(old, new)
          marker = '- **Text decoration:** `underline` and `line-through` use the public `textDecoration` style property. The Solid regression verifies the retained style, while the source-edge detector separately verifies that decoration changes native painted screenshot output.\n'
          addition = marker + '- **Reactive window selection:** `createTextSelection()` exposes the current native selection as a Solid accessor, owns its native subscription through the calling Solid owner, and clears through the same primitive.\n'
          if marker not in source:
              raise SystemExit("missing text-decoration bullet")
          source = source.replace(marker, addition)
          path.write_text(source)
          PY

      - name: Install exact lock
        run: bun install --frozen-lockfile

      - name: Validate current release-surface example
        run: |
          bun run --filter 'gpuix-solid-counter' typecheck
          bun run --filter 'gpuix-solid-counter' test:gpuix-08

      - name: Check stale current-baseline wording
        run: |
          ! grep -F 'Both packages target `@gpuix/native ^0.8.0`' README.md
          ! grep -F 'The stable `0.1.x` line targets `@gpuix/native ^0.8.0`' packages/solid/README.md
          ! grep -F 'Published React baseline: `@gpuix/react@0.8.0`' docs/upstream-parity.md
          ! grep -F 'The repository continuously exercises the GPUIX 0.8 native packages' docs/compatibility.md

      - name: Remove one-shot refresh files
        run: |
          rm .github/workflows/gpuix-09-release-surface.yml
          rm scripts/finish-gpuix-09-release-surface.mjs

      - name: Commit release-facing surface
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "docs: align examples with GPUIX 0.9"
          git push origin HEAD:${{ github.head_ref }}
