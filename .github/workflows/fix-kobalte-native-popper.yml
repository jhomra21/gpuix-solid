name: Fix Kobalte native popper type

on:
  push:
    branches:
      - fix/source-first-example-fidelity
    paths:
      - .github/fix-kobalte-native-popper.py
      - .github/workflows/fix-kobalte-native-popper.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - name: Apply popper host correction
        run: python3 .github/fix-kobalte-native-popper.py
      - name: Install
        run: bun install --frozen-lockfile
      - name: Validate host and Kobalte
        run: |
          bun run lint
          bun run solid1:package
          bun run solid1:kobalte
          git diff --check
      - name: Commit validated correction
        run: |
          rm .github/fix-kobalte-native-popper.py
          rm .github/workflows/fix-kobalte-native-popper.yml
          rm -f .github/workflows/kobalte-macos-ab.yml
          git add -A
          test -n "$(git status --porcelain)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: preserve native anchored popper type"
          git push origin HEAD:fix/source-first-example-fidelity
