name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Install GPUI Linux runtime dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.sources
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfontconfig-dev \
            libwayland-dev \
            libxkbcommon-x11-dev \
            libx11-xcb-dev \
            libssl-dev \
            libzstd-dev \
            libvulkan1 \
            vulkan-validationlayers
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - name: Run logic tests
        run: bun run test:logic
      - run: bun run build
      - name: Run desktop live-native drag acceptance
        if: matrix.os == 'macos-latest'
        run: node scripts/check-desktop-live-automation.mjs
      - name: Run Diffusion native regression
        if: matrix.os == 'macos-latest'
        run: bun run --filter 'gpuix-solid-counter' test:diffusion
      - name: Run Diffusion live-native regression
        if: matrix.os == 'macos-latest' && !cancelled()
        run: node scripts/check-gpuix-edge-live-automation.mjs Diffusion
      - name: Run Solid 1 DAW native regression
        if: matrix.os == 'macos-latest' && !cancelled()
        run: |
          cd packages/solid1
          bun install --no-save
          bun run build
          cd ../../examples/solid1-daw
          bun install --no-save
          bun run test:native:edge
      - name: Upload desktop drag preview artifact
        if: matrix.os == 'macos-latest' && always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-drag-preview-macos
          path: /tmp/gpuix-solid-desktop-drag-preview.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Verify Solid 1 package and consumer builds
        run: bun run solid1:check
      - run: node --test scripts/release.test.mjs

  diffusion-source:
    name: Diffusion runtime source
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun run diffusion:runtime:source
      - name: Install Diffusion source style compiler
        working-directory: examples/solid1-diffusion
        run: bun install --no-save
      - name: Compile Diffusion native source styles
        working-directory: examples/solid1-diffusion
        run: bun run source:prepare && bun run generate:styles
      - name: Build Diffusion source harness
        working-directory: examples/solid1-diffusion
        run: bun run build:test:edge

  package:
    name: package smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Use pinned npm publishing client
        run: npm install --global npm@11.19.0 --ignore-scripts
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Install GPUI Linux runtime dependencies
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.sources
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfontconfig-dev \
            libwayland-dev \
            libxkbcommon-x11-dev \
            libssl-dev \
            libzstd-dev \
            libvulkan1 \
            vulkan-validationlayers
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Validate staged package
        run: node packages/solid/scripts/validate-package.mjs
      - name: Smoke exact package tarball
        run: node packages/solid/scripts/smoke-package.mjs
      - name: Build Solid 1 package
        working-directory: packages/solid1
        run: bun install --no-save && bun run test && bun run build
      - name: Validate staged Solid 1 package
        working-directory: packages/solid1
        run: bun run validate:package
      - name: Smoke exact Solid 1 package tarball
        working-directory: packages/solid1
        run: bun run smoke:package

  edge-native:
    name: GPUIX pinned edge (macOS)
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/.cache/gpuix-cargo-target
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Confirm native build toolchain
        run: rustc --version && cargo --version
      - name: Restore pinned GPUIX Cargo build
        id: gpuix-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .cache/gpuix-cargo-target
          key: gpuix-edge-macos-${{ hashFiles('.gpuix/edge.json', 'patches/gpuix/*.patch') }}
      - run: bun install --frozen-lockfile
      - name: Install Solid 1 and Diffusion source host
        run: |
          cd packages/solid1
          bun install --no-save
          cd ../../examples/solid1-diffusion
          bun install --no-save
      - name: Build and link pinned GPUIX source
        run: bun run gpuix:edge:prepare
      - name: Save pinned GPUIX Cargo build
        if: steps.gpuix-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .cache/gpuix-cargo-target
          key: gpuix-edge-macos-${{ hashFiles('.gpuix/edge.json', 'patches/gpuix/*.patch') }}
      - run: bun run gpuix:edge:status
      - run: bun run gpuix:edge:verify
      - name: Run Diffusion Solid 1 source acceptance
        working-directory: examples/solid1-diffusion
        run: bun run test:native:edge
      - name: Upload Diffusion source screenshot
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: solid1-diffusion-source-macos
          path: |
            /tmp/gpuix-solid1-diffusion-source.png
            /tmp/gpuix-solid1-diffusion-editor.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Verify source compatibility against pinned GPUIX
        run: bun run gpuix:edge:check
