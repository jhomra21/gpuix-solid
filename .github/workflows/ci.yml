name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Install GPUI Linux runtime dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.sources
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfontconfig-dev \
            libwayland-dev \
            libxkbcommon-x11-dev \
            libx11-xcb-dev \
            libssl-dev \
            libzstd-dev \
            libvulkan1 \
            vulkan-validationlayers
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build
      - name: Verify Solid 1 package and DAW showcase
        run: bun run solid1:check
      - name: Upload Solid 2 source-first screenshots
        if: always() && matrix.os == 'macos-latest'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: solid2-source-first-native-macos
          path: /tmp/gpuix-solid-*.png
          if-no-files-found: ignore
      - name: Upload native Kobalte screenshots
        if: always() && matrix.os == 'macos-latest'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: solid1-kobalte-native-macos
          path: /tmp/gpuix-solid1-kobalte-*.png
          if-no-files-found: ignore
      - name: Upload native blurred-window screenshot
        if: always() && matrix.os == 'macos-latest'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: solid1-blurred-window-native-macos
          path: /tmp/gpuix-solid1-blurred-window.png
          if-no-files-found: ignore
      - name: Upload native DAW screenshots
        if: always() && matrix.os == 'macos-latest'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: solid1-daw-native-macos
          path: /tmp/gpuix-solid1-daw-*.png
          if-no-files-found: ignore
      - run: node --test scripts/release.test.mjs

  package:
    name: package smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Use pinned npm publishing client
        run: npm install --global npm@11.19.0 --ignore-scripts
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Install GPUI Linux runtime dependencies
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.sources
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfontconfig-dev \
            libwayland-dev \
            libxkbcommon-x11-dev \
            libssl-dev \
            libzstd-dev \
            libvulkan1 \
            vulkan-validationlayers
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Validate staged package
        run: node packages/solid/scripts/validate-package.mjs
      - name: Smoke exact package tarball
        run: node packages/solid/scripts/smoke-package.mjs
      - name: Build Solid 1 package
        working-directory: packages/solid1
        run: bun install --no-save && bun run test && bun run build
      - name: Validate staged Solid 1 package
        working-directory: packages/solid1
        run: bun run validate:package
      - name: Smoke exact Solid 1 package tarball
        working-directory: packages/solid1
        run: bun run smoke:package

  edge-native:
    name: GPUIX pinned edge (macOS)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Confirm native build toolchain
        run: rustc --version && cargo --version
      - run: bun install --frozen-lockfile
      - name: Build and link pinned GPUIX source
        run: bun run gpuix:edge:prepare
      - run: bun run gpuix:edge:status
      - name: Verify Solid and live examples against pinned GPUIX source
        run: bun run gpuix:edge:check
