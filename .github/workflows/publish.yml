name: Publish Package

on:
  pull_request:
    branches:
      - main
    types:
      - closed
  workflow_dispatch:

concurrency:
  group: npm-publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  detect:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'release/v'))
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.release.outputs.release }}
      version: ${{ steps.release.outputs.version }}
      release_sha: ${{ steps.release.outputs.release_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Detect approved release source
        id: release
        env:
          RELEASE_HEAD: ${{ github.event.pull_request.head.ref }}
          RELEASE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          version=$(node -p 'require("./packages/solid/package.json").version')
          echo "version=${version}" >> "$GITHUB_OUTPUT"

          if [[ "$version" == "0.0.0" ]]; then
            echo "Refusing to publish placeholder version 0.0.0."
            exit 1
          fi

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
              echo "Manual publish recovery is restricted to main; got ${GITHUB_REF}."
              exit 1
            fi

            version_commit=""
            while read -r sha; do
              commit_version=$(git show "${sha}:packages/solid/package.json" | node -e 'let s=""; process.stdin.on("data", c => s += c); process.stdin.on("end", () => process.stdout.write(JSON.parse(s).version))')
              if [[ "$commit_version" != "$version" ]]; then
                continue
              fi

              parent_sha=$(git rev-parse "${sha}^" 2>/dev/null || true)
              parent_version=""
              if [[ -n "$parent_sha" ]] && git cat-file -e "${parent_sha}:packages/solid/package.json" 2>/dev/null; then
                parent_version=$(git show "${parent_sha}:packages/solid/package.json" | node -e 'let s=""; process.stdin.on("data", c => s += c); process.stdin.on("end", () => process.stdout.write(JSON.parse(s).version))')
              fi

              if [[ "$parent_version" != "$version" ]]; then
                version_commit="$sha"
                break
              fi
            done < <(git log --first-parent --format=%H -- packages/solid/package.json)

            if [[ -z "$version_commit" ]]; then
              echo "Could not locate the main-branch commit that introduced ${version}."
              exit 1
            fi
            if ! git merge-base --is-ancestor "$version_commit" HEAD; then
              echo "Resolved version commit ${version_commit} is not an ancestor of current main."
              exit 1
            fi

            if ! git diff --quiet "$version_commit" HEAD -- \
              packages/solid/src \
              packages/solid/package.json \
              packages/solid/jsx-runtime.d.ts \
              packages/solid/jsx-dev-runtime.d.ts \
              packages/solid/tsconfig.build.json \
              packages/solid/tsconfig.json \
              bun.lock; then
              echo "Publishable runtime inputs changed after version ${version} was introduced. Prepare a new version."
              git diff --name-only "$version_commit" HEAD -- \
                packages/solid/src \
                packages/solid/package.json \
                packages/solid/jsx-runtime.d.ts \
                packages/solid/jsx-dev-runtime.d.ts \
                packages/solid/tsconfig.build.json \
                packages/solid/tsconfig.json \
                bun.lock
              exit 1
            fi

            node scripts/release.mjs notes --version "$version" >/dev/null
            echo "release_sha=${version_commit}" >> "$GITHUB_OUTPUT"
            echo "release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          expected_branch="release/v${version}"
          if [[ "$RELEASE_HEAD" != "$expected_branch" ]]; then
            echo "Merged release branch ${RELEASE_HEAD} does not match package version ${version}."
            exit 1
          fi

          previous=$(git show "${RELEASE_BASE_SHA}:packages/solid/package.json" | node -e 'let s=""; process.stdin.on("data", c => s += c); process.stdin.on("end", () => process.stdout.write(JSON.parse(s).version))')
          node scripts/release.mjs assert-newer --from "$previous" --to "$version"
          node scripts/release.mjs notes --version "$version" >/dev/null
          echo "release_sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "release=true" >> "$GITHUB_OUTPUT"

  artifact:
    needs: detect
    if: needs.detect.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.detect.outputs.release_sha }}
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Use pinned npm publishing client
        run: |
          npm install --global npm@11.19.0 --ignore-scripts
          npm --version

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install GPUI Linux runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfontconfig-dev \
            libwayland-dev \
            libxkbcommon-x11-dev \
            libx11-xcb-dev \
            libssl-dev \
            libzstd-dev \
            libvulkan1 \
            vulkan-validationlayers

      - name: Install workspace
        run: bun install --frozen-lockfile

      - name: Validate source before packaging
        run: |
          bun run release:check
          node --test scripts/release.test.mjs

      - name: Smoke exact package tarball
        run: node packages/solid/scripts/smoke-package.mjs

      - name: Pack exact publish candidate
        id: pack
        shell: bash
        run: |
          cd packages/solid
          node scripts/stage-package.mjs
          npm pack .publish --json > pack.json
          filename=$(node -e 'const p=require("./pack.json"); process.stdout.write(p[0].filename)')
          package=$(node -e 'const p=require("./pack.json"); process.stdout.write(p[0].name)')
          version=$(node -e 'const p=require("./pack.json"); process.stdout.write(p[0].version)')
          integrity=$(node -e 'const p=require("./pack.json"); process.stdout.write(p[0].integrity)')
          expected="${{ needs.detect.outputs.version }}"

          if [[ "$package" != "gpuix-solid" ]]; then
            echo "Packed package name ${package} is not gpuix-solid."
            exit 1
          fi
          if [[ "$version" != "$expected" ]]; then
            echo "Packed version ${version} does not match detected release ${expected}."
            exit 1
          fi
          if [[ "$integrity" != sha512-* ]]; then
            echo "Unexpected npm integrity format: ${integrity}"
            exit 1
          fi

          tarball=$(realpath "$filename")
          actual_integrity="sha512-$(openssl dgst -sha512 -binary "$tarball" | openssl base64 -A)"
          if [[ "$actual_integrity" != "$integrity" ]]; then
            echo "Packed tarball bytes do not match npm pack integrity metadata."
            exit 1
          fi

          if [[ "$version" == *-* ]]; then
            npm publish "$tarball" --dry-run --access public --tag beta
          else
            npm publish "$tarball" --dry-run --access public
          fi

          echo "tarball=${tarball}" >> "$GITHUB_OUTPUT"

      - name: Upload publish candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: npm-package
          path: |
            packages/solid/*.tgz
            packages/solid/pack.json
          if-no-files-found: error
          retention-days: 14

  publish:
    needs:
      - detect
      - artifact
    if: needs.detect.outputs.release == 'true'
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      actions: read
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.detect.outputs.release_sha }}
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Use pinned OIDC-capable npm client
        run: |
          npm install --global npm@11.19.0 --ignore-scripts
          npm --version

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: npm-package
          path: release-artifact

      - name: Verify exact release artifact
        id: artifact
        shell: bash
        run: |
          mapfile -t tarballs < <(find release-artifact -maxdepth 1 -type f -name '*.tgz' -print)
          if [[ "${#tarballs[@]}" -ne 1 ]]; then
            echo "Expected exactly one npm tarball; found ${#tarballs[@]}."
            exit 1
          fi
          tarball=$(realpath "${tarballs[0]}")

          entry_count=$(node -e 'const p=require("./release-artifact/pack.json"); process.stdout.write(String(p.length))')
          if [[ "$entry_count" != "1" ]]; then
            echo "Expected pack.json to describe exactly one package; found ${entry_count}."
            exit 1
          fi

          package=$(node -e 'const p=require("./release-artifact/pack.json")[0]; process.stdout.write(p.name)')
          version=$(node -e 'const p=require("./release-artifact/pack.json")[0]; process.stdout.write(p.version)')
          integrity=$(node -e 'const p=require("./release-artifact/pack.json")[0]; process.stdout.write(p.integrity)')
          expected="${{ needs.detect.outputs.version }}"

          if [[ "$package" != "gpuix-solid" || "$version" != "$expected" ]]; then
            echo "Artifact identity mismatch: ${package}@${version}, expected gpuix-solid@${expected}."
            exit 1
          fi

          actual_integrity="sha512-$(openssl dgst -sha512 -binary "$tarball" | openssl base64 -A)"
          if [[ "$actual_integrity" != "$integrity" ]]; then
            echo "Downloaded tarball bytes do not match npm pack integrity metadata."
            exit 1
          fi

          echo "tarball=${tarball}" >> "$GITHUB_OUTPUT"
          echo "package=${package}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "integrity=${integrity}" >> "$GITHUB_OUTPUT"

      - name: Publish exact artifact or verify recovery
        env:
          PACKAGE: ${{ steps.artifact.outputs.package }}
          VERSION: ${{ steps.artifact.outputs.version }}
          INTEGRITY: ${{ steps.artifact.outputs.integrity }}
          TARBALL: ${{ steps.artifact.outputs.tarball }}
        shell: bash
        run: |
          remote_integrity=$(npm view "${PACKAGE}@${VERSION}" dist.integrity 2>/dev/null || true)
          if [[ -n "$remote_integrity" ]]; then
            if [[ "$remote_integrity" != "$INTEGRITY" ]]; then
              echo "${PACKAGE}@${VERSION} already exists with different bytes."
              exit 1
            fi
            echo "${PACKAGE}@${VERSION} already exists with matching integrity; continuing recovery."
          else
            if [[ "$VERSION" == *-* ]]; then
              npm publish "$TARBALL" --access public --tag beta --provenance
            else
              npm publish "$TARBALL" --access public --provenance
            fi
          fi

      - name: Verify npm registry state
        env:
          PACKAGE: ${{ steps.artifact.outputs.package }}
          VERSION: ${{ steps.artifact.outputs.version }}
          INTEGRITY: ${{ steps.artifact.outputs.integrity }}
        shell: bash
        run: |
          verified=0
          for attempt in $(seq 1 12); do
            remote_integrity=$(npm view "${PACKAGE}@${VERSION}" dist.integrity 2>/dev/null || true)
            if [[ "$remote_integrity" == "$INTEGRITY" ]]; then
              verified=1
              break
            fi
            sleep 5
          done
          if [[ "$verified" -ne 1 ]]; then
            echo "Registry integrity never matched the published artifact."
            exit 1
          fi

          expected_tag=latest
          if [[ "$VERSION" == *-* ]]; then expected_tag=beta; fi
          tagged_version=$(npm view "$PACKAGE" dist-tags --json | node -e 'let s=""; process.stdin.on("data", c => s += c); process.stdin.on("end", () => { const tags=JSON.parse(s); process.stdout.write(tags[process.argv[1]] ?? ""); })' "$expected_tag")
          if [[ "$tagged_version" != "$VERSION" ]]; then
            echo "Expected dist-tag ${expected_tag} -> ${VERSION}, got ${tagged_version:-<missing>}."
            exit 1
          fi

      - name: Create release tag after npm succeeds
        env:
          VERSION: ${{ steps.artifact.outputs.version }}
          RELEASE_SHA: ${{ needs.detect.outputs.release_sha }}
        shell: bash
        run: |
          tag="v${VERSION}"
          git fetch --tags --force
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            tagged_commit=$(git rev-list -n 1 "$tag")
            if [[ "$tagged_commit" != "$RELEASE_SHA" ]]; then
              echo "${tag} already points to ${tagged_commit}, expected ${RELEASE_SHA}."
              exit 1
            fi
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$tag" "$RELEASE_SHA" -m "$tag"
            git push origin "refs/tags/${tag}"
          fi

      - name: Create GitHub Release after npm succeeds
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.artifact.outputs.version }}
        shell: bash
        run: |
          tag="v${VERSION}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "GitHub Release ${tag} already exists; continuing recovery."
            exit 0
          fi

          node scripts/release.mjs notes --version "$VERSION" > /tmp/release-notes.md
          args=(release create "$tag" --verify-tag --title "$tag" --notes-file /tmp/release-notes.md)
          if [[ "$VERSION" == *-* ]]; then args+=(--prerelease); fi
          gh "${args[@]}"