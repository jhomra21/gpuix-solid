name: Finalize GPUIX 0.7 source contract

on:
  push:
    branches:
      - fix/source-first-example-fidelity

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/source-first-example-fidelity
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - name: Update GPUIX 0.7 provenance and docs
        shell: python
        run: |
          from pathlib import Path
          import json

          RELEASE_COMMIT = "a24b4a42eb516c7b940eb8d34ecebb077df623bd"

          def replace(path, old, new, count=1):
              file = Path(path)
              text = file.read_text()
              if old not in text:
                  raise SystemExit(f"missing contract marker in {path}: {old[:160]!r}")
              file.write_text(text.replace(old, new, count))

          # Immutable GPUIX 0.7.0 source provenance. Blob ids are unchanged at the release commit.
          lock_path = Path("examples/counter/upstream/gpuix/upstream-lock.json")
          lock = json.loads(lock_path.read_text())
          if lock.get("repository") != "remorses/gpuix":
              raise SystemExit("unexpected GPUIX source-lock repository")
          lock["commit"] = RELEASE_COMMIT
          lock_path.write_text(json.dumps(lock, indent=2) + "\n")

          # Root README: published/runtime contract, one Blurred Window target, source-check scope.
          replace(
              "README.md",
              "Against the published GPUIX React 0.6 desktop surface, GPUix Solid now has Solid 2 counterparts for Counter, Native Text, Blurred Window, Todo, Diff, Timeline, Chat, and Infinite Chat. The remaining upstream runtime gap is the browser/WebGPU WebAssembly renderer.",
              "Against the published GPUIX React 0.7 desktop surface, GPUix Solid has Solid 2 parity counterparts for Counter, Native Text, Todo, Diff, Timeline, Chat, and Infinite Chat. The single Blurred Window target is intentionally the custom native-glass showcase rather than a second parity fixture. The remaining upstream runtime gap is the browser/WebGPU WebAssembly renderer.",
          )
          replace(
              "README.md",
              "Its peer range is `solid-js >=1.9.0 <2`, and it uses `@gpuix/native ^0.6.0`.",
              "Its peer range is `solid-js >=1.9.0 <2`, and it uses `@gpuix/native ^0.7.0`.",
          )
          replace(
              "README.md",
              '| [Blurred window](./examples/counter/src/blurred-window.tsx) | `bun run example:blurred-window` | Strict upstream GPUIX 0.6 native blur, transparent titlebar, resize behavior, and traffic-light placement |\n',
              "",
          )
          replace(
              "README.md",
              "The custom animated username/welcome version of Blurred Window is intentionally separate from parity and runs with `bun run example:blurred-window-showcase`.",
              "Blurred Window intentionally has one runnable target: `bun run example:blurred-window`. It is the animated username/welcome glass showcase, using GPUIX native blur/window behavior; there is no separate parity/showcase command.",
          )
          replace(
              "README.md",
              "`bun run source:check` verifies the pinned GPUIX, Dashboard, CodeImage, and TanStack snapshots against recorded Git blob hashes.",
              "`bun run source:check` verifies the pinned GPUIX, Dashboard, CodeImage, TanStack, and Diffusion Studio snapshots against recorded Git blob hashes.",
          )
          replace("README.md", "The GPUIX 0.6 line validates", "The GPUIX 0.7 line validates")
          replace("README.md", "| Native renderer | `@gpuix/native ^0.6.0` |", "| Native renderer | `@gpuix/native ^0.7.0` |")
          replace("README.md", "The root lockfile currently resolves GPUIX 0.6 desktop bindings", "The root lockfile currently resolves GPUIX 0.7 desktop bindings")
          replace(
              "README.md",
              "The published GPUIX 0.6 desktop example set now has Solid 2 counterparts for Counter, Native Text, Blurred Window, Todo, Diff, Timeline, Chat, and Infinite Chat. The DAW remains a separate Solid fixture and does not stand in for Timeline.",
              "The published GPUIX 0.7 desktop example set has Solid 2 parity counterparts for Counter, Native Text, Todo, Diff, Timeline, Chat, and Infinite Chat. The repository's single Blurred Window target is the custom showcase, and the DAW remains a separate Solid fixture that does not stand in for Timeline.",
          )

          # Compatibility guide follows the actual dependency/lock contract.
          compat = Path("docs/compatibility.md")
          compat_text = compat.read_text().replace("^0.6.0", "^0.7.0").replace("GPUIX 0.6", "GPUIX 0.7").replace("current 0.6 line", "current 0.7 line")
          compat.write_text(compat_text)

          # Examples guide already has the single Blurred Window target; update only the release contract.
          examples = Path("examples/README.md")
          examples_text = examples.read_text().replace("published GPUIX 0.6 desktop examples", "published GPUIX 0.7 desktop examples").replace("targets `@gpuix/native ^0.6.0`", "targets `@gpuix/native ^0.7.0`")
          examples.write_text(examples_text)

          # Solid 1 package docs use the public 0.7 test-renderer availability contract.
          replace(
              "packages/solid1/README.md",
              "- `TestGpuixRenderer` integration when the native platform binding exposes it",
              "- `TestGpuixRenderer` integration when `hasTestGpuixRenderer()` reports GPU-backed test support",
          )

          # Published-parity doc: move the baseline and capability table to the 0.7 release.
          parity = Path("docs/upstream-parity.md")
          text = parity.read_text()
          old_audit = '''- Upstream repository: `remorses/gpuix`\n- Published React baseline: `@gpuix/react@0.6.0`\n- Published baseline commit: `322993eecf6134ef652f31b0fb905e77e131d08a`\n- Upstream `main` audited at: `09e0caeb1812eece10a3a8a7200ef18567610267`\n- Native package used by GPUix Solid: `@gpuix/native ^0.6.0`\n\nThe published baseline is the compatibility requirement. Changes present only on upstream `main` stay separate until the corresponding native package is released.\n'''
          new_audit = f'''- Upstream repository: `remorses/gpuix`\n- Published React baseline: `@gpuix/react@0.7.0`\n- Published/native release commit: `{RELEASE_COMMIT}`\n- Source snapshot commit: `{RELEASE_COMMIT}`\n- Native package used by GPUix Solid: `@gpuix/native ^0.7.0`\n\nThe published 0.7 release is the compatibility requirement. Source-fidelity snapshots are pinned to that immutable release commit. Work present only on newer upstream `main` remains outside the parity baseline until it is separately audited and supported by a matching native release.\n'''
          if old_audit not in text:
              raise SystemExit("missing upstream parity audit block")
          text = text.replace(old_audit, new_audit, 1)
          text = text.replace("`remorses/gpuix@09e0caeb1812eece10a3a8a7200ef18567610267`;", f"`remorses/gpuix@{RELEASE_COMMIT}`;", 1)
          source_tail = "- `jhomra21/cloudflare-workers-solid-tanstack-spa-betterauth-D1-KV@47139f07c018dc2ba505bbb5915750fdba19e961`."
          if source_tail not in text:
              raise SystemExit("missing source snapshot list tail")
          text = text.replace(source_tail, source_tail[:-1] + ";\n- `diffusionstudio/editor@585fb010dcca36919f096f4b1275d535acab0cb9`.", 1)
          text = text.replace(
              "| Blurred window | `examples/blurred-window.tsx` | `examples/counter/src/blurred-window.tsx` | parity |",
              "| Blurred window source | `examples/blurred-window.tsx` | source snapshot only; runnable target is the custom showcase | reference |",
              1,
          )
          old_blur = '''`example:blurred-window` is the strict upstream parity fixture. The animated username/welcome extension is preserved separately as `example:blurred-window-showcase` so local showcase work cannot silently change the parity example.\n'''
          new_blur = '''There is deliberately one Solid 2 runnable target: `example:blurred-window`. It is the custom animated username/welcome glass showcase. The exact upstream `examples/blurred-window.tsx` source remains hash-pinned as a reference for the native blur/window contract, but the repository does not advertise a second parity target or a `blurred-window-showcase` command.\n'''
          if old_blur not in text:
              raise SystemExit("missing blurred-window parity boundary")
          text = text.replace(old_blur, new_blur, 1)

          start = text.index("## Published 0.6 API parity")
          end = text.index("## Performance workloads")
          api_section = '''## Published 0.7 API parity\n\nThe parity branch targets the published React 0.7 host and testing surface required by these examples. The Solid packages expose the same native capabilities while keeping Solid-specific naming where the framework API itself differs.\n\n| Area | Published React 0.7 capability | GPUix Solid status |\n| --- | --- | --- |\n| Host events | `onAuxClick`, `onHighlight` | parity |\n| Text find | `highlight`, `useTextSearch`, `findRanges` | parity |\n| Virtual list | logical `getListScrollTop`, `scrollToItem(..., offsetInItem)` | parity |\n| Window | insets and `activateWindow()` | parity |\n| Structured backgrounds | two-stop `linear-gradient` `StyleDesc` backgrounds | parity |\n| Window keyboard | root-level `onKeyDown` / `onKeyUp` through `setWindowKeyEvents` | parity |\n| Focus traversal | `focusNext()` / `focusPrevious()` | parity |\n| Test renderer | `hasTestGpuixRenderer()` availability, painted highlights and logical list anchor | parity |\n| Live automation | native click, fill and key input through the renderer | parity |\n| Components | Select, Combobox, Tooltip, anchored floating surfaces | parity |\n| Animation | React `motion.div` | parity via Solid `animate.div` |\n\n`animate.div` is intentionally named for the Solid package rather than copying React's component name. The native animation behavior is the capability being matched.\n\nThe automation layer also normalizes text fill into GPUI-native keystrokes, including shifted keystrokes for uppercase input. That behavior is covered by a real native controlled-input regression because application fixtures such as Dashboard rely on exact confirmation text rather than test-only state mutation.\n\n'''
          text = text[:start] + api_section + text[end:]

          old_main = '''## Upstream main ahead of 0.6\n\nAt the audit pin above, upstream `main` adds structured two-stop linear gradient backgrounds after the `0.6.0` release. GPUix Solid does not expose that API while it consumes `@gpuix/native@0.6.0`. It moves into the published-baseline table when a matching native release is available.\n'''
          new_main = '''## 0.7 release deltas adopted\n\nStructured two-stop gradients, root-level window key routing, focus traversal, and the public native test-renderer availability guard are now part of the published 0.7 baseline and are exposed by both Solid renderer packages. The GPUIX source lock points at the same immutable 0.7.0 release commit. Newer upstream-`main`-only work remains outside the compatibility baseline until it is separately audited.\n'''
          if old_main not in text:
              raise SystemExit("missing old upstream-main section")
          text = text.replace(old_main, new_main, 1)
          parity.write_text(text)

      - name: Verify provenance and stale-contract removal
        run: |
          bun install --frozen-lockfile
          bun run gpuix:check-version
          bun run --filter 'gpuix-solid-counter' source:check
          if grep -nE 'GPUIX 0\.6|React 0\.6|\^0\.6\.0|@gpuix/(native|react)@0\.6\.0|blurred-window-showcase' README.md docs/compatibility.md docs/upstream-parity.md examples/README.md packages/solid1/README.md; then
            echo 'stale GPUIX 0.6 or removed Blurred Window target remains in current contract docs' >&2
            exit 1
          fi
          grep -n 'a24b4a42eb516c7b940eb8d34ecebb077df623bd' examples/counter/upstream/gpuix/upstream-lock.json docs/upstream-parity.md
          git diff --check
      - name: Remove temporary workflow
        run: rm .github/workflows/finalize-gpuix07-contract.yml
      - name: Commit finalized contract
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md docs/compatibility.md docs/upstream-parity.md examples/README.md examples/counter/upstream/gpuix/upstream-lock.json packages/solid1/README.md .github/workflows/finalize-gpuix07-contract.yml
          git commit -m 'docs: align source contract with GPUIX 0.7'
          git push origin HEAD:fix/source-first-example-fidelity
