name: GPUIX 0.9 migration bootstrap

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/gpuix-09-bootstrap.yml"
      - "scripts/upgrade-gpuix-09.mjs"
      - "scripts/upgrade-gpuix-09-version-policy.mjs"
      - "scripts/upgrade-gpuix-09-fixes.mjs"

permissions:
  contents: write

jobs:
  migrate:
    if: github.head_ref == 'feat/gpuix-0.9-solid-parity'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.0
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.0.2
        with:
          bun-version: 1.3.14

      - name: Apply deterministic 0.9 migration
        run: |
          node scripts/upgrade-gpuix-09.mjs
          node scripts/upgrade-gpuix-09-version-policy.mjs
          node scripts/upgrade-gpuix-09-fixes.mjs

      - name: Resolve exact 0.9 native packages and regenerate lock
        run: bun install

      - name: Validate migrated Solid 2 surface
        run: |
          bun run gpuix:check-version
          bun run lint:code
          bun run --filter 'gpuix-solid' typecheck
          bun run --filter 'gpuix-solid' test
          bun run --filter 'gpuix-solid' build

      - name: Validate migrated Solid 1 surface
        run: |
          cd packages/solid1
          bun install --no-save
          bun run test
          bun run typecheck

      - name: Remove bootstrap-only files
        run: |
          rm .github/workflows/gpuix-09-bootstrap.yml
          rm scripts/upgrade-gpuix-09.mjs
          rm scripts/upgrade-gpuix-09-version-policy.mjs
          rm scripts/upgrade-gpuix-09-fixes.mjs

      - name: Commit migrated tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: target GPUIX 0.9 selection events"
          git push origin HEAD:${{ github.head_ref }}
