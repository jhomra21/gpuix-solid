name: Core host native semantic APIs

on:
  push:
    branches:
      - fix/source-first-example-fidelity

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/source-first-example-fidelity
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - name: Move semantic element APIs into the host
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path.cwd()
          solid1_nodes = root / "packages/solid1/src/host/nodes.ts"
          nodes = solid1_nodes.read_text()

          listener_marker = '  readonly #capturedPointers = new Set<number>()\n'
          if nodes.count(listener_marker) != 1:
            raise SystemExit("host pointer field marker changed")
          if '#eventListeners' not in nodes:
            nodes = nodes.replace(
              listener_marker,
              listener_marker + '  readonly #eventListeners = new Map<string, Set<EventListenerOrEventListenerObject>>()\n',
              1,
            )

          start_marker = '  compareDocumentPosition(other: HostElementNode): number {\n'
          end_marker = '  getBoundingClientRect(): {\n'
          if nodes.count(start_marker) != 1 or nodes.count(end_marker) != 1:
            raise SystemExit("semantic API markers changed")
          start = nodes.index(start_marker)
          end = nodes.index(end_marker, start)
          methods = '''  compareDocumentPosition(other: HostElementNode): number {
            return compareHostDocumentPosition(this, other)
          }

          get dataset(): Record<string, string> {
            const dataset: Record<string, string> = {}
            for (const [name, value] of this.props) {
              if (!name.startsWith("data-") || value === null || value === undefined) continue
              dataset[dataAttributeProperty(name.slice(5))] = String(value)
            }
            return dataset
          }

          getAttribute(name: string): string | null {
            const value = this.props.get(name)
            return value === null || value === undefined ? null : String(value)
          }

          hasAttribute(name: string): boolean {
            return this.props.has(name)
          }

          setAttribute(name: string, value: string): void {
            setHostProperty(this, name, String(value))
          }

          removeAttribute(name: string): void {
            setHostProperty(this, name, undefined)
          }

          contains(other: HostElementNode | null): boolean {
            if (!other) return false
            let current: HostElementNode | null = other
            while (current) {
              if (current === this) return true
              current = current.parentElement
            }
            return false
          }

          matches(selector: string): boolean {
            return selector.split(",").some((candidate) => matchesSimpleSelector(this, candidate.trim()))
          }

          closest(selector: string): HostElementNode | null {
            let current: HostElementNode | null = this
            while (current) {
              if (current.matches(selector)) return current
              current = current.parentElement
            }
            return null
          }

          addEventListener(
            type: string,
            listener: EventListenerOrEventListenerObject | null,
          ): void {
            if (!listener) return
            const listeners = this.#eventListeners.get(type) ?? new Set<EventListenerOrEventListenerObject>()
            listeners.add(listener)
            this.#eventListeners.set(type, listeners)
          }

          removeEventListener(
            type: string,
            listener: EventListenerOrEventListenerObject | null,
          ): void {
            if (!listener) return
            const listeners = this.#eventListeners.get(type)
            listeners?.delete(listener)
            if (listeners?.size === 0) this.#eventListeners.delete(type)
          }

          dispatchEvent(event: Event): boolean {
            if (event.target === null) {
              Object.defineProperty(event, "target", { configurable: true, value: this })
            }
            Object.defineProperty(event, "currentTarget", { configurable: true, value: this })
            for (const listener of [...(this.#eventListeners.get(event.type) ?? [])]) {
              if (typeof listener === "function") listener.call(this, event)
              else listener.handleEvent(event)
            }
            return !event.defaultPrevented
          }

          '''
          nodes = nodes[:start] + methods + nodes[end:]
          solid1_nodes.write_text(nodes)
          (root / "packages/solid/src/host/nodes.ts").write_text(nodes)

          web_path = root / "packages/solid1/src/web.ts"
          web = web_path.read_text()
          web = web.replace('type LocalEventListener = (event: Event) => void\n\n', '')
          web = web.replace('    installSemanticTagMetadata(element, current)\n', '')
          semantic_marker = 'function installSemanticTagMetadata(element: ReturnType<typeof createElement>, tagName: string): void {\n'
          if semantic_marker in web:
            start = web.index(semantic_marker)
            web = web[:start].rstrip() + '\n'
          web_path.write_text(web)

          parity_path = root / "packages/solid1/scripts/check-host-parity.ts"
          parity = parity_path.read_text()
          footer = 'console.log("solid1 host parity: passed")\n'
          if 'native host EventTarget listener must fire' not in parity:
            tests = '''const semanticButton = createHostElement("div", "button")
          if (semanticButton.localName !== "button" || semanticButton.tagName !== "BUTTON") throw new Error("host must retain semantic tag identity")
          let localEvents = 0
          semanticButton.addEventListener("click", () => { localEvents += 1 })
          semanticButton.dispatchEvent(new Event("click", { cancelable: true }))
          if (localEvents !== 1) throw new Error("native host EventTarget listener must fire")

          '''
            if parity.count(footer) != 1:
              raise SystemExit("host parity footer changed")
            parity = parity.replace(footer, tests + footer, 1)
          parity_path.write_text(parity)
          PY
      - name: Validate core host and Kobalte consumer
        run: |
          cd packages/solid1
          bun install --no-save
          bun run test
          bun run typecheck
          cd ../../examples/solid1-kobalte
          bun install --no-save
          bun run typecheck
      - name: Commit validated host APIs
        run: |
          rm .github/workflows/core-host-native-semantics.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/solid1/src/host/nodes.ts packages/solid/src/host/nodes.ts packages/solid1/src/web.ts packages/solid1/scripts/check-host-parity.ts .github/workflows/core-host-native-semantics.yml
          git diff --check
          git commit -m "refactor: make semantic APIs native to host elements"
          git push origin HEAD:fix/source-first-example-fidelity
