name: Diagnostic GPUIX edge foreground live apps

on:
  push:
    branches:
      - diag/gpuix-edge-foreground-reentrancy-20260912

permissions:
  contents: read

jobs:
  foreground-live:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Keep automation transport but exercise the normal macOS frame pump
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('packages/solid/src/automation/server.ts')
          s = p.read_text()
          old = 'const driveFrames = options.driveFrames ?? process.platform === "darwin"'
          if old not in s:
              raise SystemExit('expected macOS automation frame ownership line not found')
          p.write_text(s.replace(old, 'const driveFrames = options.driveFrames ?? false', 1))
          PY
      - name: Fetch exact pinned GPUIX edge source
        run: bun run gpuix:edge:sync
      - name: Patch macOS invalidation to avoid leasing GpuixView
        run: |
          python3 - <<'PY'
          from pathlib import Path
          candidates = list(Path('.cache/gpuix').glob('remorses--gpuix-*/packages/native/src/renderer.rs'))
          if len(candidates) != 1:
              raise SystemExit(f'expected one edge renderer.rs, got {candidates}')
          p = candidates[0]
          s = p.read_text()
          old = '#[cfg(target_os = "macos")]\nfn invalidate_window() -> Result<()> {\n    update_window(|_view, window, cx| {\n        cx.notify();\n        window.refresh();\n    })\n}\n'
          new = '#[cfg(target_os = "macos")]\nfn invalidate_window() -> Result<()> {\n    // Retained-tree mutations may be committed from a JS event callback that\n    // originated inside GpuixView. Invalidating must not lease that view again.\n    update_window_without_view(|window, _cx| {\n        window.refresh();\n    })\n}\n'
          if old not in s:
              raise SystemExit('expected typed macOS invalidate_window implementation not found')
          p.write_text(s.replace(old, new, 1))
          print(p)
          PY
      - name: Build and link patched exact edge source
        run: |
          bun run gpuix:edge:build
          bun run gpuix:edge:link
      - run: bun run gpuix:edge:status
      - name: Build live applications against patched edge
        run: bun run build
      - name: Make existing live suite use focused foreground windows
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/check-gpuix-edge-live-automation.mjs')
          s = p.read_text()
          old = 'GPUIX_BACKGROUND: "1",'
          if old not in s:
              raise SystemExit('expected background-mode assignment not found')
          p.write_text(s.replace(old, 'GPUIX_BACKGROUND: "0",', 1))
          PY
          git diff --check
          git diff -- packages/solid/src/automation/server.ts scripts/check-gpuix-edge-live-automation.mjs
      - name: Run exact live suite with normal frame pump and safe invalidation
        run: bun run examples:live
