name: Kobalte macOS A/B

on:
  push:
    branches:
      - fix/source-first-example-fidelity
    paths:
      - .github/workflows/kobalte-macos-ab.yml

permissions:
  contents: read

jobs:
  kobalte:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: accepted
            ref: 93901e31a54f9b967b571b0a94eee5404c742f5f
          - name: current
            ref: fix/source-first-example-fidelity
    name: ${{ matrix.name }}
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ matrix.ref }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run solid1:kobalte
