name: Native 0.7.0 foreground diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  patched-native-macos:
    if: github.head_ref == 'diagnostic/native-0.7.0-foreground-click'
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - name: Build exact patched native 0.7.0
        run: node scripts/diagnose-native-0.7.0-foreground-click.mjs prepare
      - name: Show patched native status
        run: node scripts/diagnose-native-0.7.0-foreground-click.mjs status
