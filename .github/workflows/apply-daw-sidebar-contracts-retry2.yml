name: Apply DAW sidebar contracts retry2

on:
  push:
    branches:
      - fix/source-first-example-fidelity
    paths:
      - .github/workflows/apply-daw-sidebar-contracts-retry2.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/source-first-example-fidelity
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - name: Reapply source contract transformation
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess

          workflow = Path('.github/workflows/apply-daw-sidebar-contracts-retry.yml').read_text().splitlines()
          wanted = {'Reapply validated transformation', 'Complete exact timeline-core dependency closure'}
          current = None
          collecting = False
          blocks = []
          lines = []
          for line in workflow:
              if line.startswith('      - name: '):
                  if current in wanted and lines:
                      blocks.append((current, '\n'.join(lines) + '\n'))
                  current = line.split(': ', 1)[1]
                  collecting = False
                  lines = []
                  continue
              if current in wanted and line == '        run: |':
                  collecting = True
                  continue
              if collecting:
                  if line.startswith('      - '):
                      blocks.append((current, '\n'.join(lines) + '\n'))
                      current = None
                      collecting = False
                      lines = []
                  else:
                      lines.append(line[10:] if line.startswith('          ') else line)
          if current in wanted and lines:
              blocks.append((current, '\n'.join(lines) + '\n'))
          if {name for name, _ in blocks} != wanted:
              raise SystemExit('failed to recover source transformation blocks')
          for name, script in blocks:
              print(f'== {name} ==')
              subprocess.run(['bash', '-euo', 'pipefail', '-c', script], check=True)
          PY
      - name: Fix reusable context-menu DOM event contract
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('packages/solid1/src/kobalte/context-menu.tsx')
          text = path.read_text()
          text = text.replace(
              'export interface ContextMenuTriggerProps<T = "div"> extends NativeComponentProps { as?: T }',
              'type ContextMenuDomEvent = EventPayload & { preventDefault: () => void; stopPropagation: () => void }\nexport interface ContextMenuTriggerProps<T = "div"> extends Omit<NativeComponentProps, "onContextMenu"> { as?: T; onContextMenu?: (event: ContextMenuDomEvent) => void }',
          )
          marker = 'function isContextClick(event: EventPayload): boolean {\n'
          helper = '''function asContextMenuDomEvent(event: EventPayload): ContextMenuDomEvent {
            // Host JSX events are normalized by EventRegistry before component handlers run.
            return event as ContextMenuDomEvent
          }

          '''
          if 'function asContextMenuDomEvent' not in text:
              text = text.replace(marker, helper + marker)
          old = '''      onMouseDown={(event: EventPayload) => {
                props.onMouseDown?.(event)
                context.openAt(event)
              }}
          '''
          new = '''      onContextMenu={(event: EventPayload) => {
                props.onContextMenu?.(asContextMenuDomEvent(event))
                context.openAt(event)
              }}
              onMouseDown={(event: EventPayload) => {
                props.onMouseDown?.(event)
                context.openAt(event)
              }}
          '''
          if 'props.onContextMenu?.(asContextMenuDomEvent(event))' not in text:
              if old not in text:
                  raise SystemExit('context menu trigger anchor not found')
              text = text.replace(old, new)
          path.write_text(text)
          PY
      - name: Validate source, host, Kobalte, and DAW types
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          cd packages/solid1
          bun install --no-save
          bun run typecheck
          bun run test
          bun run build
          cd ../../examples/solid1-kobalte
          bun install --no-save
          bun run typecheck
          cd ../solid1-daw
          bun install --no-save
          bun run source:check
          bun run generate:styles
          bunx tsc --noEmit
          bun run source:check
      - name: Commit validated contracts
        run: |
          set -euo pipefail
          rm -f .github/workflows/diagnose-daw-compat.yml
          rm -f .github/workflows/apply-daw-sidebar-contracts.yml
          rm -f .github/workflows/apply-daw-sidebar-contracts-retry.yml
          rm -f .github/workflows/apply-daw-sidebar-contracts-retry2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "refactor: source-lock DAW sidebar contracts"
          git push origin HEAD:fix/source-first-example-fidelity
