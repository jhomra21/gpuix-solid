name: MediaBunny Compatibility

on:
  pull_request:
    paths:
      - "examples/mediabunny/**"
      - ".github/workflows/mediabunny.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: ${{ matrix.backend }} (macOS)
    runs-on: macos-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        backend:
          - server
          - webcodecs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Install pinned media dependencies
        working-directory: examples/mediabunny
        run: bun install --no-save
      - name: Run MediaBunny ${{ matrix.backend }} workload
        working-directory: examples/mediabunny
        run: |
          mkdir -p reports
          bun run bench:${{ matrix.backend }} > reports/${{ matrix.backend }}.json
          cat reports/${{ matrix.backend }}.json
      - name: Upload benchmark report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mediabunny-${{ matrix.backend }}-macos
          path: examples/mediabunny/reports/${{ matrix.backend }}.json
          if-no-files-found: warn
          retention-days: 14
