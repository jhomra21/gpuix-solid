name: Diagnostic published GPUIX foreground live apps

on:
  push:
    branches:
      - diag/gpuix-published-foreground-20260912

permissions:
  contents: read

jobs:
  foreground-live:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Confirm published native package
        run: bun -e 'console.log(require("@gpuix/native/package.json").version)'
      - name: Keep automation transport but exercise the normal macOS frame pump
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('packages/solid/src/automation/server.ts')
          s = p.read_text()
          old = 'const driveFrames = options.driveFrames ?? process.platform === "darwin"'
          if old not in s:
              raise SystemExit('expected macOS automation frame ownership line not found')
          p.write_text(s.replace(old, 'const driveFrames = options.driveFrames ?? false', 1))
          PY
      - name: Build live applications against published runtime
        run: bun run build
      - name: Make existing live suite use focused foreground windows
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/check-gpuix-edge-live-automation.mjs')
          s = p.read_text()
          old = 'GPUIX_BACKGROUND: "1",'
          if old not in s:
              raise SystemExit('expected background-mode assignment not found')
          p.write_text(s.replace(old, 'GPUIX_BACKGROUND: "0",', 1))
          PY
          git diff --check
          git diff -- packages/solid/src/automation/server.ts scripts/check-gpuix-edge-live-automation.mjs
      - name: Run exact live suite with published runtime and normal frame pump
        run: bun run examples:live
