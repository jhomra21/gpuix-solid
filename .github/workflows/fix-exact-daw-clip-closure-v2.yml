name: Fix exact DAW clip closure v2

on:
  push:
    branches:
      - fix/source-first-example-fidelity
    paths:
      - .github/workflows/fix-exact-daw-clip-closure-v2.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/source-first-example-fidelity
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - name: Restore exact clip and pure contract closure
        run: |
          set -euo pipefail
          rm -rf /tmp/daw-upstream
          git clone --filter=blob:none https://github.com/jhomra21/daw-browser-convex.git /tmp/daw-upstream
          git -C /tmp/daw-upstream fetch --depth=1 origin 2eaad47813b15aa8511bab8dc04625510c977b12
          git -C /tmp/daw-upstream checkout --detach FETCH_HEAD
          cp /tmp/daw-upstream/src/components/timeline/ClipComponent.tsx examples/solid1-daw/src/upstream/components/timeline/ClipComponent.tsx
          cp /tmp/daw-upstream/src/components/timeline/ClipFadeOverlay.tsx examples/solid1-daw/src/upstream/components/timeline/ClipFadeOverlay.tsx
          cp /tmp/daw-upstream/src/components/timeline/clip-fade-interaction.ts examples/solid1-daw/src/upstream/components/timeline/clip-fade-interaction.ts
          cp /tmp/daw-upstream/src/lib/timeline-runtime-types.ts examples/solid1-daw/src/upstream/lib/timeline-runtime-types.ts
          cp /tmp/daw-upstream/src/lib/timeline-range-selection.ts examples/solid1-daw/src/upstream/lib/timeline-range-selection.ts
          cat > examples/solid1-daw/src/compat/useClipWaveformViewModel.ts <<'EOF'
          import type { RuntimeClip } from "../upstream/lib/timeline-runtime-types"

          type Options = {
            clip: () => RuntimeClip
            cssWidthPx: () => number
            projectBpm: () => number
            ensureClipBuffer?: (clipId: string, sampleUrl?: string) => Promise<void>
          }

          export function useClipWaveformViewModel(options: Options) {
            return {
              layout: () => {
                const width = Math.max(0, Math.floor(options.cssWidthPx()))
                return { padPx: 0, drawCols: width, audioStartPx: 0, audioEndPx: width }
              },
              peaks: (): Uint8Array | null => null,
            }
          }
          EOF
          cat > examples/solid1-daw/src/compat/render-waveform.ts <<'EOF'
          type WaveformRenderOptions = {
            ctx: CanvasRenderingContext2D
            peaks: Uint8Array
            drawCols: number
            padPx: number
            topY: number
            contentH: number
            cssW: number
            cssH: number
            fillStyle: string
            boundaryStyle: string
            maxHeightFraction: number
            amplitudeScaleAtColumn?: (column: number) => number
          }

          export function drawWaveformPeaks(_options: WaveformRenderOptions): void {
            // GPUIX 0.7 has no Canvas 2D surface. Exact source feature-detects this through getContext().
          }
          EOF
      - name: Point DAW source at exact pure contracts
        run: |
          python - <<'PY'
          from pathlib import Path

          tsconfig = Path('examples/solid1-daw/tsconfig.json')
          text = tsconfig.read_text()
          replacements = {
            '"src/compat/timeline-core-types.ts"': '"src/upstream/packages/timeline-core/types.ts"',
            '"src/compat/clip-fades.ts"': '"src/upstream/packages/timeline-core/clip-fades.ts"',
            '"src/compat/timeline-range-selection.ts"': '"src/upstream/lib/timeline-range-selection.ts"',
          }
          for old, new in replacements.items():
            text = text.replace(old, new)
          anchor = '      "solid-js/web": [\n        "src/compat/solid-web.ts"\n      ],\n'
          additions = '''      "@daw-browser/waveforms/render-waveform": [
                "src/compat/render-waveform.ts"
              ],
              "~/hooks/useClipWaveformViewModel": [
                "src/compat/useClipWaveformViewModel.ts"
              ],
              "~/lib/timeline-runtime-types": [
                "src/upstream/lib/timeline-runtime-types.ts"
              ],
          '''
          if '"@daw-browser/waveforms/render-waveform"' not in text:
            if anchor not in text: raise SystemExit('tsconfig alias anchor missing')
            text = text.replace(anchor, anchor + additions, 1)
          tsconfig.write_text(text)

          aliases = Path('examples/solid1-daw/kobalte-native-aliases.ts')
          text = aliases.read_text()
          text = text.replace('compat("timeline-core-types.ts")', 'upstream("packages/timeline-core/types.ts")')
          text = text.replace('compat("clip-fades.ts")', 'upstream("packages/timeline-core/clip-fades.ts")')
          text = text.replace('compat("timeline-range-selection.ts")', 'upstream("lib/timeline-range-selection.ts")')
          anchor = '  { find: /^@daw-browser\\/shared$/, replacement: compat("daw-browser-shared.ts") },\n'
          additions = '''  { find: /^@daw-browser\\/waveforms\\/render-waveform$/, replacement: compat("render-waveform.ts") },
            { find: /^~\\/hooks\\/useClipWaveformViewModel$/, replacement: compat("useClipWaveformViewModel.ts") },
            { find: /^~\\/lib\\/timeline-runtime-types$/, replacement: upstream("lib/timeline-runtime-types.ts") },
          '''
          if 'waveforms\\/render-waveform' not in text:
            if anchor not in text: raise SystemExit('vite alias anchor missing')
            text = text.replace(anchor, anchor + additions, 1)
          aliases.write_text(text)

          checker = Path('examples/solid1-daw/scripts/check-upstream-source-parity.mjs')
          text = checker.read_text()
          track_lane = '  ["src/upstream/components/timeline/TrackLane.tsx", "src/components/timeline/TrackLane.tsx", "82850963b07f67a3655068d8fe14122e290ece96"],\n'
          clip_entries = '''  ["src/upstream/components/timeline/ClipComponent.tsx", "src/components/timeline/ClipComponent.tsx", "c3a04366bba4de6bc4b64973d859bb62e154b3af"],
            ["src/upstream/components/timeline/ClipFadeOverlay.tsx", "src/components/timeline/ClipFadeOverlay.tsx", "a59881604bc1bef7199946883e2d763df957df8d"],
            ["src/upstream/components/timeline/clip-fade-interaction.ts", "src/components/timeline/clip-fade-interaction.ts", "732e2355096848ce3a84f3bd5e42dd6b50d0c5e9"],
          '''
          if 'c3a04366bba4de6bc4b64973d859bb62e154b3af' not in text:
            if track_lane not in text: raise SystemExit('source checker TrackLane anchor missing')
            text = text.replace(track_lane, track_lane + clip_entries, 1)
          lib_anchor = '  ["src/upstream/lib/timeline-utils.ts", "src/lib/timeline-utils.ts", "4ddf52866d6f616ffe6b9da2e8c1362dfe9dad39"],\n'
          lib_entries = '''  ["src/upstream/lib/timeline-runtime-types.ts", "src/lib/timeline-runtime-types.ts", "7b5c026817b3a22428862999815e93501e9d75bc"],
            ["src/upstream/lib/timeline-range-selection.ts", "src/lib/timeline-range-selection.ts", "d197450a36b15e1f909f5ab3713d6535f1a60217"],
          '''
          if '7b5c026817b3a22428862999815e93501e9d75bc' not in text:
            if lib_anchor not in text: raise SystemExit('source checker timeline-utils anchor missing')
            text = text.replace(lib_anchor, lib_anchor + lib_entries, 1)
          checker.write_text(text)

          # Native state adapters now satisfy the exact Track<TBuffer> contract.
          for rel in ('TimelineWorkspace.tsx', 'TrackLane.tsx'):
            path = Path('examples/solid1-daw/src/native') / rel
            source = path.read_text()
            anchor = '    name: track.name,\n'
            if '    volume: track.volume,\n' not in source:
              if anchor not in source: raise SystemExit(f'{rel}: sourceTrack name anchor missing')
              source = source.replace(anchor, anchor + '    volume: track.volume,\n', 1)
            path.write_text(source)

          # Native wrappers import the exact core schema too; keep one canonical Track/Clip definition.
          compat_types = Path('examples/solid1-daw/src/compat/timeline-core-types.ts')
          compat_types.write_text('''import type { Clip as CoreClip, Track as CoreTrack } from "../upstream/packages/timeline-core/types"\n\nexport type { TrackId, TrackChannelRole, TrackSend, TrackRouting } from "../upstream/packages/timeline-core/types"\nexport type RuntimeClip = CoreClip<AudioBuffer>\nexport type Clip = RuntimeClip\nexport type Track = CoreTrack<AudioBuffer>\n''')

          jsx = Path('packages/solid1/jsx-runtime.d.ts')
          text = jsx.read_text()
          if '"vector-effect"?: string | undefined' not in text:
            anchor = '  "clip-path"?: string | undefined\n'
            if anchor not in text: raise SystemExit('jsx SVG anchor missing')
            text = text.replace(anchor, anchor + '  "vector-effect"?: string | undefined\n  "data-fade-hover-side"?: string | undefined\n  "on:pointerenter"?: ((event: PointerEvent) => void) | undefined\n  "on:pointerleave"?: ((event: PointerEvent) => void) | undefined\n', 1)
          text = text.replace('    canvas: JSXProps<HostProps>\n', '    canvas: DomCompatibleProps<HostProps, SolidJSX.CanvasHTMLAttributes<HTMLCanvasElement>>\n', 1)
          jsx.write_text(text)

          for package in ('solid', 'solid1'):
            nodes = Path(f'packages/{package}/src/host/nodes.ts')
            text = nodes.read_text()
            if 'getContext(_contextId: string): null' not in text:
              anchor = '  get clientWidth(): number {\n'
              method = '''  getContext(_contextId: string): null {
                // GPUIX 0.7 does not expose Canvas 2D; browser-source code can feature-detect a null context.
                return null
              }

            '''
              if anchor not in text: raise SystemExit(f'{nodes}: clientWidth anchor missing')
              text = text.replace(anchor, method + anchor, 1)
            nodes.write_text(text)
          PY
      - name: Apply shared host lint cleanup
        run: python scripts/fix-source-first-host-lint.py
      - name: Validate exact type closure
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun run lint
          bun run typecheck
          cd packages/solid1
          bun install --no-save
          bun run typecheck
          bun run test
          bun run build
          cd ../../examples/solid1-kobalte
          bun install --no-save
          bun run typecheck
          cd ../solid1-daw
          bun install --no-save
          bun run source:check
          bun run generate:styles
          bunx tsc --noEmit
          bun run build
          bun run source:check
      - name: Commit validated exact type closure
        run: |
          set -euo pipefail
          rm -f examples/solid1-daw/src/compat/clip-fades.ts
          rm -f examples/solid1-daw/src/compat/timeline-range-selection.ts
          rm -f scripts/fix-source-first-host-lint.py
          rm -f .github/workflows/fix-source-first-host-lint.yml
          rm -f .github/workflows/fix-exact-daw-clip-closure.yml
          rm -f .github/workflows/fix-exact-daw-clip-closure-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "refactor: close exact DAW clip source graph"
          git push origin HEAD:fix/source-first-example-fidelity
