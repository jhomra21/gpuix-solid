name: Fix exact DAW clip closure v2

on:
  push:
    branches:
      - fix/source-first-example-fidelity
    paths:
      - .github/workflows/fix-exact-daw-clip-closure-v2.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/source-first-example-fidelity
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - name: Restore pinned exact source files
        run: |
          set -euo pipefail
          rm -rf /tmp/daw-upstream
          git clone --filter=blob:none https://github.com/jhomra21/daw-browser-convex.git /tmp/daw-upstream
          git -C /tmp/daw-upstream fetch --depth=1 origin 2eaad47813b15aa8511bab8dc04625510c977b12
          git -C /tmp/daw-upstream checkout --detach FETCH_HEAD
          cp /tmp/daw-upstream/src/components/timeline/ClipComponent.tsx examples/solid1-daw/src/upstream/components/timeline/ClipComponent.tsx
          cp /tmp/daw-upstream/src/components/timeline/ClipFadeOverlay.tsx examples/solid1-daw/src/upstream/components/timeline/ClipFadeOverlay.tsx
          cp /tmp/daw-upstream/src/components/timeline/clip-fade-interaction.ts examples/solid1-daw/src/upstream/components/timeline/clip-fade-interaction.ts
          cp /tmp/daw-upstream/src/lib/timeline-runtime-types.ts examples/solid1-daw/src/upstream/lib/timeline-runtime-types.ts
          cp /tmp/daw-upstream/src/lib/timeline-range-selection.ts examples/solid1-daw/src/upstream/lib/timeline-range-selection.ts
      - name: Apply exact source closure
        run: |
          python scripts/apply-exact-daw-clip-closure.py
          python scripts/fix-source-first-host-lint.py
      - name: Validate exact source closure
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun run lint
          bun run typecheck
          bun run test
          bun run build
          cd packages/solid1
          bun install --no-save
          bun run typecheck
          bun run test
          bun run build
          cd ../../examples/solid1-kobalte
          bun install --no-save
          bun run typecheck
          cd ../solid1-daw
          bun install --no-save
          bun run source:check
          bun run generate:styles
          bunx tsc --noEmit
          bun run build
          bun run source:check
      - name: Commit validated source changes
        run: |
          set -euo pipefail
          rm -f examples/solid1-daw/src/compat/clip-fades.ts
          rm -f examples/solid1-daw/src/compat/timeline-range-selection.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add examples packages
          git diff --cached --check
          git commit -m "refactor: close exact DAW clip source graph"
          git push origin HEAD:fix/source-first-example-fidelity
