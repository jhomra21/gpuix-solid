name: Apply DAW sidebar contracts retry3

on:
  push:
    branches:
      - fix/source-first-example-fidelity
    paths:
      - .github/workflows/apply-daw-sidebar-contracts-retry3.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/source-first-example-fidelity
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - name: Reapply source contract transformation
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess

          workflow = Path('.github/workflows/apply-daw-sidebar-contracts-retry2.yml').read_text().splitlines()
          target = 'Reapply source contract transformation'
          current = None
          collecting = False
          lines = []
          for line in workflow:
              if line.startswith('      - name: '):
                  if current == target and lines:
                      break
                  current = line.split(': ', 1)[1]
                  collecting = False
                  continue
              if current == target and line == '        run: |':
                  collecting = True
                  continue
              if collecting:
                  if line.startswith('      - '):
                      break
                  lines.append(line[10:] if line.startswith('          ') else line)
          if not lines:
              raise SystemExit('failed to recover source transformation')
          subprocess.run(['bash', '-euo', 'pipefail', '-c', '\n'.join(lines) + '\n'], check=True)
          PY
      - name: Fix reusable context-menu DOM event contract
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('packages/solid1/src/kobalte/context-menu.tsx')
          text = path.read_text()

          old_interface = 'export interface ContextMenuTriggerProps<T = "div"> extends NativeComponentProps { as?: T }'
          new_interface = 'type ContextMenuDomEvent = EventPayload & { preventDefault: () => void; stopPropagation: () => void }\nexport interface ContextMenuTriggerProps<T = "div"> extends Omit<NativeComponentProps, "onContextMenu"> { as?: T; onContextMenu?: (event: ContextMenuDomEvent) => void }'
          if old_interface in text:
              text = text.replace(old_interface, new_interface, 1)
          elif new_interface not in text:
              raise SystemExit('ContextMenuTriggerProps interface not found')

          marker = 'function isContextClick(event: EventPayload): boolean {'
          helper = '''function asContextMenuDomEvent(event: EventPayload): ContextMenuDomEvent {
            // Host JSX handlers receive the EventRegistry-normalized DOM-compatible payload.
            return event as ContextMenuDomEvent
          }

          '''
          if 'function asContextMenuDomEvent' not in text:
              index = text.find(marker)
              if index < 0:
                  raise SystemExit('isContextClick marker not found')
              text = text[:index] + helper + text[index:]

          trigger_start = text.find('export function Trigger<T = "div">')
          if trigger_start < 0:
              raise SystemExit('ContextMenu Trigger function not found')
          content_start = text.find('export function Content<T = "div">', trigger_start)
          if content_start < 0:
              raise SystemExit('ContextMenu Content function not found')
          segment = text[trigger_start:content_start]
          handler_line = 'onMouseDown={(event: EventPayload) => {'
          mouse_index = segment.find(handler_line)
          if mouse_index < 0:
              raise SystemExit('Trigger onMouseDown handler not found')
          if 'props.onContextMenu?.(asContextMenuDomEvent(event))' not in segment:
              indent_start = segment.rfind('\n', 0, mouse_index) + 1
              indent = segment[indent_start:mouse_index]
              insertion = (
                  f'{indent}onContextMenu={{(event: EventPayload) => {{\n'
                  f'{indent}  props.onContextMenu?.(asContextMenuDomEvent(event))\n'
                  f'{indent}  context.openAt(event)\n'
                  f'{indent}}}}}\n'
              )
              segment = segment[:indent_start] + insertion + segment[indent_start:]
              text = text[:trigger_start] + segment + text[content_start:]

          path.write_text(text)
          PY
      - name: Validate source, host, Kobalte, and DAW types
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          cd packages/solid1
          bun install --no-save
          bun run typecheck
          bun run test
          bun run build
          cd ../../examples/solid1-kobalte
          bun install --no-save
          bun run typecheck
          cd ../solid1-daw
          bun install --no-save
          bun run source:check
          bun run generate:styles
          bunx tsc --noEmit
          bun run source:check
      - name: Commit validated contracts
        run: |
          set -euo pipefail
          rm -f .github/workflows/diagnose-daw-compat.yml
          rm -f .github/workflows/apply-daw-sidebar-contracts.yml
          rm -f .github/workflows/apply-daw-sidebar-contracts-retry.yml
          rm -f .github/workflows/apply-daw-sidebar-contracts-retry2.yml
          rm -f .github/workflows/apply-daw-sidebar-contracts-retry3.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "refactor: source-lock DAW sidebar contracts"
          git push origin HEAD:fix/source-first-example-fidelity
