name: Solid 1 core semantic DOM compatibility

on:
  push:
    branches:
      - fix/source-first-example-fidelity

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/source-first-example-fidelity
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - name: Apply core semantic DOM support
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path.cwd()
          solid1_nodes = root / "packages/solid1/src/host/nodes.ts"
          solid2_nodes = root / "packages/solid/src/host/nodes.ts"
          nodes = solid1_nodes.read_text()

          start_marker = "  compareDocumentPosition(other: HostElementNode): number {\n"
          end_marker = "  getBoundingClientRect(): {\n"
          if nodes.count(start_marker) != 1 or nodes.count(end_marker) != 1:
            raise SystemExit("semantic DOM host markers changed; refusing unsafe patch")
          start = nodes.index(start_marker)
          end = nodes.index(end_marker, start)
          semantic_methods = '''  compareDocumentPosition(other: HostElementNode): number {
            return compareHostDocumentPosition(this, other)
          }

          get dataset(): Record<string, string> {
            const dataset: Record<string, string> = {}
            for (const [name, value] of this.props) {
              if (!name.startsWith("data-") || value === null || value === undefined) continue
              dataset[dataAttributeProperty(name.slice(5))] = String(value)
            }
            return dataset
          }

          getAttribute(name: string): string | null {
            const value = this.props.get(name)
            return value === null || value === undefined ? null : String(value)
          }

          hasAttribute(name: string): boolean {
            return this.props.has(name)
          }

          setAttribute(name: string, value: string): void {
            setHostProperty(this, name, String(value))
          }

          removeAttribute(name: string): void {
            setHostProperty(this, name, undefined)
          }

          contains(other: HostElementNode | null): boolean {
            if (!other) return false
            let current: HostElementNode | null = other
            while (current) {
              if (current === this) return true
              current = current.parentElement
            }
            return false
          }

          matches(selector: string): boolean {
            return selector.split(",").some((candidate) => matchesSimpleSelector(this, candidate.trim()))
          }

          closest(selector: string): HostElementNode | null {
            let current: HostElementNode | null = this
            while (current) {
              if (current.matches(selector)) return current
              current = current.parentElement
            }
            return null
          }

          '''
          nodes = nodes[:start] + semantic_methods + nodes[end:]

          helper_marker = "function compareHostDocumentPosition(reference: HostNode, other: HostNode): number {\n"
          if nodes.count(helper_marker) != 1:
            raise SystemExit("document-position helper marker changed; refusing unsafe patch")
          helpers = '''function dataAttributeProperty(name: string): string {
            return name.replace(/-([a-z])/g, (_match, letter: string) => letter.toUpperCase())
          }

          function matchesSimpleSelector(node: HostElementNode, selector: string): boolean {
            if (!selector) return false
            const attribute = selector.match(/^\\[([A-Za-z_:][\\w:.-]*)(?:=(['\"]?)(.*?)\\2)?\\]$/)
            if (attribute) {
              const name = attribute[1]
              if (!name || !node.hasAttribute(name)) return false
              const expected = attribute[3]
              return expected === undefined || node.getAttribute(name) === expected
            }
            return /^[A-Za-z][A-Za-z0-9-]*$/.test(selector) && node.localName === selector.toLowerCase()
          }

          '''
          nodes = nodes.replace(helper_marker, helpers + helper_marker, 1)
          solid1_nodes.write_text(nodes)
          solid2_nodes.write_text(nodes)

          universal_path = root / "packages/solid1/src/universal.ts"
          universal = universal_path.read_text()
          if '  "output",\n' not in universal:
            universal = universal.replace('  "samp",\n])', '  "samp",\n  "output",\n  "option",\n])')
          if '  "select",\n' not in universal:
            universal = universal.replace('  "a",\n])', '  "a",\n  "select",\n])')
          if '    const node = createHostElement(type)\n' not in universal:
            raise SystemExit("universal semantic element construction changed; refusing unsafe patch")
          universal = universal.replace('    const node = createHostElement(type)\n', '    const node = createHostElement(type, tagName)\n', 1)
          universal_path.write_text(universal)

          jsx_path = root / "packages/solid1/jsx-runtime.d.ts"
          jsx = jsx_path.read_text()
          if '    select: DomCompatibleProps' not in jsx:
            marker = '    button: SemanticDomProps\n'
            if jsx.count(marker) != 1:
              raise SystemExit("JSX button marker changed; refusing unsafe patch")
            jsx = jsx.replace(
              marker,
              marker
              + '    output: DomCompatibleProps<HostProps, SolidJSX.HTMLAttributes<HTMLOutputElement>>\n'
              + '    select: DomCompatibleProps<HostProps, SolidJSX.SelectHTMLAttributes<HTMLSelectElement>>\n'
              + '    option: DomCompatibleProps<HostProps, SolidJSX.OptionHTMLAttributes<HTMLOptionElement>>\n',
              1,
            )
          jsx_path.write_text(jsx)

          parity_path = root / "packages/solid1/scripts/check-host-parity.ts"
          parity = parity_path.read_text()
          if 'from "../src/host/nodes.ts"' not in parity:
            marker = '} from "../src/native-style.ts"\n'
            if parity.count(marker) != 1:
              raise SystemExit("host parity import marker changed; refusing unsafe patch")
            parity = parity.replace(
              marker,
              marker + 'import { createHostElement, insertHostNode, setHostProperty } from "../src/host/nodes.ts"\n',
              1,
            )
          if 'closest must resolve ancestor data attributes' not in parity:
            marker = 'console.log("solid1 host parity: passed")\n'
            if parity.count(marker) != 1:
              raise SystemExit("host parity footer marker changed; refusing unsafe patch")
            tests = '''const selectorRoot = createHostElement("div", "section")
          const selectorButton = createHostElement("div", "button")
          const selectorLabel = createHostElement("text", "span")
          setHostProperty(selectorButton, "data-track-name", "true")
          setHostProperty(selectorButton, "role", "button")
          setHostProperty(selectorButton, "data-track-id", "track-7")
          insertHostNode(selectorRoot, selectorButton)
          insertHostNode(selectorButton, selectorLabel)
          if (selectorLabel.closest("[data-track-name]") !== selectorButton) throw new Error("closest must resolve ancestor data attributes")
          if (selectorLabel.closest("button, input, select, textarea, [role='button']") !== selectorButton) throw new Error("closest must resolve selector lists and semantic tags")
          if (!selectorRoot.contains(selectorLabel) || selectorLabel.contains(selectorRoot)) throw new Error("contains must follow host ancestry")
          if (selectorButton.dataset.trackId !== "track-7") throw new Error("dataset must expose data-* properties")
          selectorButton.removeAttribute("data-track-name")
          if (selectorLabel.closest("[data-track-name]") !== null) throw new Error("removeAttribute must update selector matching")

          '''
            parity = parity.replace(marker, tests + marker, 1)
          parity_path.write_text(parity)
          PY
      - name: Validate Solid 1 host
        run: |
          cd packages/solid1
          bun install --no-save
          bun run test
          bun run typecheck
      - name: Commit validated core support
        run: |
          rm .github/workflows/solid1-core-semantic-dom.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/solid1/src/host/nodes.ts packages/solid/src/host/nodes.ts packages/solid1/src/universal.ts packages/solid1/jsx-runtime.d.ts packages/solid1/scripts/check-host-parity.ts .github/workflows/solid1-core-semantic-dom.yml
          git diff --check
          git commit -m "fix: add core semantic DOM matching"
          git push origin HEAD:fix/source-first-example-fidelity
