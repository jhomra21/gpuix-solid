name: Update GPUIX 0.8 lockfile

on:
  push:
    branches: [feat/gpuix-080-release-baseline]

permissions:
  contents: write

jobs:
  lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/gpuix-080-release-baseline
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - name: Regenerate lockfile from published GPUIX 0.8 packages
        run: bun install
      - name: Verify lockfile-only generated change
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          if [[ "$changed" != "bun.lock" ]]; then
            echo "Expected bun install to change only bun.lock, got:"
            printf '%s\n' "$changed"
            exit 1
          fi
          bun run gpuix:check-version
          git diff --check
      - name: Commit regenerated lockfile
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          git commit -m "chore: regenerate lockfile for GPUIX 0.8"
          git push origin HEAD:feat/gpuix-080-release-baseline
