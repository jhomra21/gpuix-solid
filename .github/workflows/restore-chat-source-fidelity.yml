name: Restore Chat source fidelity

on:
  push:
    branches:
      - fix/source-first-example-fidelity
    paths:
      - .github/workflows/restore-chat-source-fidelity.yml

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore pinned Chat source shape
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
