name: Rename Solid 2 package once

on:
  push:
    branches:
      - feat/solid1-package-daw-showcase

permissions:
  contents: write

jobs:
  rename:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/solid1-package-daw-showcase
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Rename Solid 2 package identity
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          root = Path('.')
          old = '@jhomra21/gpuix-solid'
          new = 'gpuix-solid'
          pattern = re.compile(re.escape(old) + r'(?!1)')
          changed = []

          for path in root.rglob('*'):
              if not path.is_file() or '.git' in path.parts:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              updated = pattern.sub(new, text)
              if updated != text:
                  path.write_text(updated, encoding='utf-8')
                  changed.append(str(path))

          releasing_path = Path('RELEASING.md')
          releasing = releasing_path.read_text(encoding='utf-8')
          releasing = releasing.replace(
              '- Scoped publishes are public and use npm provenance.',
              '- Publishes are public and use npm provenance.',
          )
          releasing = releasing.replace(
              '## First publication bootstrap\n\nThe one-time bootstrap is complete.',
              '## Original scoped-package bootstrap\n\nThe original scoped-package bootstrap is complete.',
          )
          releasing = releasing.replace(
              'That manual bootstrap must not be repeated for later versions.',
              'That bootstrap applies only to the original scoped package.',
          )
          releasing = releasing.replace(
              '`0.1.0-beta.2` was the first steady-state tokenless release. It was published through Trusted Publishing/OIDC and the registry exposed a SLSA provenance v1 attestation for the published package.',
              '`0.1.0-beta.2` was the first steady-state tokenless release for the original scoped package. It was published through Trusted Publishing/OIDC and the registry exposed a SLSA provenance v1 attestation for the published package.',
          )
          migration = '''## `gpuix-solid` package-name migration bootstrap

The Solid 2 npm package now publishes as `gpuix-solid`. This is a new npm package identity; npm does not rename or transfer the existing `@jhomra21/gpuix-solid` package in place.

npm requires a package to exist before a Trusted Publisher can be attached to it. Therefore the first `gpuix-solid` release is a one-time new-package bootstrap: publish the exact sanitized tarball produced by this release tooling once using an interactive npm maintainer session, verify its registry SHA-512 integrity against that tarball, then configure `gpuix-solid` with the Trusted Publisher settings below. Do not add an npm token to GitHub Actions for this bootstrap.

After that first `gpuix-solid` publication and trust configuration, all later releases return to the normal tokenless OIDC flow. The old scoped package remains a separate registry entry; deprecating it is a separate explicit maintenance action after the new package is confirmed healthy.

'''
          marker = '## Trusted Publisher configuration\n'
          if migration not in releasing:
              if marker not in releasing:
                  raise SystemExit('Trusted Publisher configuration heading not found')
              releasing = releasing.replace(marker, migration + marker, 1)
          releasing_path.write_text(releasing, encoding='utf-8')

          changelog_path = Path('CHANGELOG.md')
          changelog = changelog_path.read_text(encoding='utf-8')
          note = '- Rename the Solid 2 npm package from `@jhomra21/gpuix-solid` to `gpuix-solid`, including workspace consumers, JSX compiler configuration, package smoke tests, documentation, and release identity checks.\n'
          if note not in changelog:
              anchor = '<!-- Add user-facing changes here before preparing a release. -->\n\n'
              if anchor not in changelog:
                  raise SystemExit('Unreleased changelog anchor not found')
              changelog = changelog.replace(anchor, anchor + note + '\n', 1)
          changelog_path.write_text(changelog, encoding='utf-8')

          allowed_legacy = {'CHANGELOG.md', 'RELEASING.md'}
          stale = []
          for path in root.rglob('*'):
              if not path.is_file() or '.git' in path.parts:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              if pattern.search(text) and str(path) not in allowed_legacy:
                  stale.append(str(path))
          if stale:
              raise SystemExit('Unexpected legacy Solid 2 package references remain: ' + ', '.join(stale))

          print(f'Renamed Solid 2 package identity in {len(changed)} files')
          PY

      - name: Validate renamed workspace
        shell: bash
        run: |
          bun install --frozen-lockfile
          bun run typecheck
          bun run build
          node --test scripts/release.test.mjs
          node packages/solid/scripts/validate-package.mjs
          git diff --check

      - name: Commit rename and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/rename-solid2-package-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "chore: rename Solid 2 npm package to gpuix-solid"
          git push origin HEAD:feat/solid1-package-daw-showcase
