name: Rename Solid 2 package once

on:
  push:
    branches:
      - feat/solid1-package-daw-showcase

permissions:
  contents: write

jobs:
  rename:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/solid1-package-daw-showcase
          fetch-depth: 0

      - name: Rename package identity outside workflow files
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          old = '@jhomra21/gpuix-solid'
          pattern = re.compile(re.escape(old) + r'(?!1)')
          changed = []

          for path in Path('.').rglob('*'):
              if not path.is_file() or '.git' in path.parts:
                  continue
              if len(path.parts) >= 2 and path.parts[0] == '.github' and path.parts[1] == 'workflows':
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              updated = pattern.sub('gpuix-solid', text)
              if updated != text:
                  path.write_text(updated, encoding='utf-8')
                  changed.append(str(path))

          print(f'renamed package identity in {len(changed)} non-workflow files')
          PY

          git diff --check

      - name: Commit migration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "chore: rename Solid 2 npm package to gpuix-solid"
          git push origin HEAD:feat/solid1-package-daw-showcase
