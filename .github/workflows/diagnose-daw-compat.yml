name: Diagnose DAW compatibility

on:
  push:
    branches:
      - fix/source-first-example-fidelity
    paths:
      - .github/workflows/diagnose-daw-compat.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: cd examples/solid1-daw && bun run typecheck
