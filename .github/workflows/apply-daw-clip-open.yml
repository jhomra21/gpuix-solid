name: Apply DAW clip-open fidelity patch

on:
  push:
    branches:
      - fix/source-first-example-fidelity

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/source-first-example-fidelity
      - name: Wire source clip-open behavior through the native Canvas boundary
        shell: python
        run: |
          from pathlib import Path

          def replace(path, old, new):
              file = Path(path)
              text = file.read_text()
              if old not in text:
                  raise SystemExit(f"missing patch marker in {path}: {old[:100]!r}")
              file.write_text(text.replace(old, new, 1))

          replace(
              "examples/solid1-daw/src/native/ClipComponent.tsx",
              """  onSelect: () => void\n  onMouseDown: (event: EventPayload) => void\n}""",
              """  onSelect: () => void\n  onOpen: () => void\n  onMouseDown: (event: EventPayload) => void\n}""",
          )
          replace(
              "examples/solid1-daw/src/native/ClipComponent.tsx",
              """const ClipComponent = (props: ClipComponentProps): JSX.Element => {\n  const width = () => Math.max(6, Math.floor(props.clip.duration * props.pixelsPerSecond))""",
              """const DOUBLE_TAP_MS = 700\nconst DOUBLE_TAP_DISTANCE_PX = 8\nlet lastClipTap: { clipId: string; at: number; x: number; y: number } | undefined\n\nconst ClipComponent = (props: ClipComponentProps): JSX.Element => {\n  const width = () => Math.max(6, Math.floor(props.clip.duration * props.pixelsPerSecond))""",
          )
          replace(
              "examples/solid1-daw/src/native/ClipComponent.tsx",
              """  const color = () => visualColor(props.clip)\n\n  return (""",
              """  const color = () => visualColor(props.clip)\n\n  const handleClick = (event: EventPayload): void => {\n    const now = performance.now()\n    const x = event.x ?? 0\n    const y = event.y ?? 0\n    const previous = lastClipTap\n    lastClipTap = { clipId: props.clip.id, at: now, x, y }\n    props.onSelect()\n    if (!previous || previous.clipId !== props.clip.id || now - previous.at > DOUBLE_TAP_MS) return\n    if (Math.abs(x - previous.x) > DOUBLE_TAP_DISTANCE_PX || Math.abs(y - previous.y) > DOUBLE_TAP_DISTANCE_PX) return\n    lastClipTap = undefined\n    props.onOpen()\n  }\n\n  return (""",
          )
          replace(
              "examples/solid1-daw/src/native/ClipComponent.tsx",
              """      onClick={props.onSelect}\n      onMouseDown={props.onMouseDown}""",
              """      onClick={handleClick}\n      onMouseDown={props.onMouseDown}""",
          )

          replace(
              "examples/solid1-daw/src/upstream/components/timeline/ClipComponent.tsx",
              """    onSelect={() => props.contextMenu.selectClip(props.trackId, props.clip.id)}\n    onMouseDown={(event) => props.onPointerDown(props.trackId, props.clip.id, pointerEvent(event))}""",
              """    onSelect={() => props.contextMenu.selectClip(props.trackId, props.clip.id)}\n    onOpen={() => props.onDblClick?.(props.trackId, props.clip.id)}\n    onMouseDown={(event) => props.onPointerDown(props.trackId, props.clip.id, pointerEvent(event))}""",
          )

          replace(
              "examples/solid1-daw/src/native/TrackLane.tsx",
              """  onSelectClip: (trackId: string, clipId: string) => void\n  onClipMouseDown: (trackId: string, clipId: string, event: PointerEvent) => void""",
              """  onSelectClip: (trackId: string, clipId: string) => void\n  onOpenClip: (trackId: string, clipId: string) => void\n  onClipMouseDown: (trackId: string, clipId: string, event: PointerEvent) => void""",
          )
          replace(
              "examples/solid1-daw/src/native/TrackLane.tsx",
              """        onClipPointerUp={() => {}}\n        onClipResizeStart={() => {}}\n        clipContextMenu={{""",
              """        onClipPointerUp={() => {}}\n        onClipResizeStart={() => {}}\n        onClipDblClick={props.onOpenClip}\n        clipContextMenu={{""",
          )

          replace(
              "examples/solid1-daw/src/native/TimelineWorkspace.tsx",
              """  onSelectClip: (trackId: string, clipId: string) => void\n  onClipMouseDown: (trackId: string, clipId: string, event: PointerEvent) => void""",
              """  onSelectClip: (trackId: string, clipId: string) => void\n  onOpenClip: (trackId: string, clipId: string) => void\n  onClipMouseDown: (trackId: string, clipId: string, event: PointerEvent) => void""",
          )
          replace(
              "examples/solid1-daw/src/native/TimelineWorkspace.tsx",
              """      onSelectClip={props.onSelectClip}\n      onClipMouseDown={props.onClipMouseDown}""",
              """      onSelectClip={props.onSelectClip}\n      onOpenClip={props.onOpenClip}\n      onClipMouseDown={props.onClipMouseDown}""",
          )

          replace(
              "examples/solid1-daw/src/native/Timeline.tsx",
              """  const beginClipDrag = (trackId: string, clipId: string, event: PointerEvent): void => {""",
              """  const openClip = (trackId: string, clipId: string): void => {\n    const clip = findClip(tracks(), clipId)?.clip\n    selectClip(trackId, clipId)\n    if (clip?.kind !== \"audio\") return\n    setBottomTab(\"clip\")\n    setBottomPanelOpen(true)\n  }\n\n  const beginClipDrag = (trackId: string, clipId: string, event: PointerEvent): void => {""",
          )
          replace(
              "examples/solid1-daw/src/native/Timeline.tsx",
              """        onSelectClip={selectClip}\n        onClipMouseDown={beginClipDrag}""",
              """        onSelectClip={selectClip}\n        onOpenClip={openClip}\n        onClipMouseDown={beginClipDrag}""",
          )

          replace(
              "examples/solid1-daw/src/test.tsx",
              """  app.renderer.scrollTestId(\"daw-test-viewport\", 0, 0)\n  app.renderer.clickCenterTestId(\"clip-drums-a\")\n  app.renderer.scrollTestId(\"daw-test-viewport\", 0, -260)\n  app.renderer.clickTextWithinTestId(\"bottom-panel\", \"CLIP\")\n  requireCondition(app.renderer.hasTestId(\"clip-panel\") && !app.renderer.hasTestId(\"effects-panel\"), \"an audio clip should enable Sample Detail\")""",
              """  app.renderer.scrollTestId(\"daw-test-viewport\", 0, 0)\n  app.renderer.clickCenterTestId(\"clip-drums-a\")\n  requireCondition(app.renderer.hasTestId(\"effects-panel\") && !app.renderer.hasTestId(\"clip-panel\"), \"first audio-clip tap should select without opening Sample Detail\")\n  app.renderer.clickCenterTestId(\"clip-drums-a\")\n  app.renderer.scrollTestId(\"daw-test-viewport\", 0, -260)\n  requireCondition(app.renderer.hasTestId(\"clip-panel\") && !app.renderer.hasTestId(\"effects-panel\"), \"second audio-clip tap should open Sample Detail like upstream\")""",
          )
          replace(
              "examples/solid1-daw/src/test.tsx",
              "solid1 DAW drag validation: deferred to the gpuix-solid core GPUIX 0.5 pointer-capture migration",
              "solid1 DAW drag validation: held-pointer continuation remains a manual GPUIX 0.7 acceptance item",
          )

          Path(".github/workflows/apply-daw-clip-open.yml").unlink()
      - name: Commit source-fidelity patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add examples/solid1-daw/src .github/workflows/apply-daw-clip-open.yml
          git commit -m 'fix(daw): preserve upstream audio clip open behavior'
          git push origin HEAD:fix/source-first-example-fidelity
