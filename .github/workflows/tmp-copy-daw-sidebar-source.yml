name: Temporary copy pinned DAW sidebar source

on:
  push:
    branches:
      - fix/source-first-example-fidelity
    paths:
      - .github/workflows/tmp-copy-daw-sidebar-source.yml

permissions:
  contents: write

jobs:
  copy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/source-first-example-fidelity
          persist-credentials: true
          fetch-depth: 0
      - name: Copy exact pinned sidebar source
        shell: bash
        run: |
          set -euo pipefail
          REV=2eaad47813b15aa8511bab8dc04625510c977b12
          BASE=https://raw.githubusercontent.com/jhomra21/daw-browser-convex/$REV/src/components/timeline
          DEST=examples/solid1-daw/src/upstream/components/timeline
          mkdir -p "$DEST/context-menu"
          curl --fail --silent --show-error "$BASE/TrackSidebar.tsx" -o "$DEST/TrackSidebar.tsx"
          curl --fail --silent --show-error "$BASE/TrackSidebarRow.tsx" -o "$DEST/TrackSidebarRow.tsx"
          curl --fail --silent --show-error "$BASE/MasterSidebarRow.tsx" -o "$DEST/MasterSidebarRow.tsx"
          curl --fail --silent --show-error "$BASE/MixerVolumeSlider.tsx" -o "$DEST/MixerVolumeSlider.tsx"
          curl --fail --silent --show-error "$BASE/automation-parameter-picker.tsx" -o "$DEST/automation-parameter-picker.tsx"
          curl --fail --silent --show-error "$BASE/context-menu/timeline-context-menu.tsx" -o "$DEST/context-menu/timeline-context-menu.tsx"
          curl --fail --silent --show-error "$BASE/track-send-targets.ts" -o "$DEST/track-send-targets.ts"
          git diff --check -- "$DEST"
      - name: Commit and self-clean
        shell: bash
        run: |
          git rm .github/workflows/tmp-copy-daw-sidebar-source.yml
          git add examples/solid1-daw/src/upstream/components/timeline
          git diff --check --cached
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: copy pinned DAW sidebar source"
          git push origin HEAD:fix/source-first-example-fidelity
