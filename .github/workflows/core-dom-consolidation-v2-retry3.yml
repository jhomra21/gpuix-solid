name: Core DOM consolidation v2 retry3

on:
  push:
    branches:
      - fix/source-first-example-fidelity

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/source-first-example-fidelity
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - name: Apply consolidation and normalize generated helper
        run: |
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          workflow = Path('.github/workflows/core-dom-consolidation-v2-retry2.yml').read_text()
          opening = "          python - <<'PY'\n"
          closing = "\n          PY\n"
          start = workflow.index(opening) + len(opening)
          end = workflow.index(closing, start)
          script = dedent(workflow[start:end])
          exec(compile(script, '<core-dom-consolidation-retry2>', 'exec'))

          solid1 = Path('packages/solid1/src/host/nodes.ts')
          nodes = solid1.read_text()
          bad = '\n\\\nfunction matchesSimpleSelector'
          if nodes.count(bad) != 1:
            raise SystemExit(f'expected one generated selector escape, found {nodes.count(bad)}')
          nodes = nodes.replace(bad, '\nfunction matchesSimpleSelector', 1)
          solid1.write_text(nodes)
          Path('packages/solid/src/host/nodes.ts').write_text(nodes)
          PY
      - name: Validate consolidated core and consumers
        run: |
          cd packages/solid1
          bun install --no-save
          bun run test
          bun run typecheck
          cd ../../examples/solid1-kobalte
          bun install --no-save
          bun run typecheck
          cd ../solid1-daw
          bun install --no-save
          bun run typecheck
      - name: Commit validated consolidation
        run: |
          rm -f .github/workflows/core-dom-consolidation-v2.yml
          rm -f .github/workflows/core-dom-consolidation-v2-retry.yml
          rm -f .github/workflows/core-dom-consolidation-v2-retry2.yml
          rm -f .github/workflows/core-dom-consolidation-v2-retry3.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/solid1/src/host/nodes.ts packages/solid/src/host/nodes.ts packages/solid1/src/host/events.ts packages/solid/src/host/events.ts packages/solid1/src/dom-environment.ts packages/solid1/src/web.ts packages/solid1/scripts/check-host-parity.ts .github/workflows/core-dom-consolidation-v2.yml .github/workflows/core-dom-consolidation-v2-retry.yml .github/workflows/core-dom-consolidation-v2-retry2.yml .github/workflows/core-dom-consolidation-v2-retry3.yml
          git diff --check
          git commit -m "refactor: consolidate DOM semantics in core host"
          git push origin HEAD:fix/source-first-example-fidelity