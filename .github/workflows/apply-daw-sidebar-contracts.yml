name: Apply DAW sidebar contracts

on:
  push:
    branches:
      - fix/source-first-example-fidelity
    paths:
      - .github/workflows/apply-daw-sidebar-contracts.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/source-first-example-fidelity
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - name: Copy pinned pure upstream modules
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/jhomra21/daw-browser-convex.git /tmp/daw-upstream
          git -C /tmp/daw-upstream fetch --depth=1 origin 2eaad47813b15aa8511bab8dc04625510c977b12
          git -C /tmp/daw-upstream checkout --detach 2eaad47813b15aa8511bab8dc04625510c977b12
          root=examples/solid1-daw/src/upstream
          mkdir -p "$root/packages/timeline-core" "$root/packages/shared" "$root/lib"
          cp /tmp/daw-upstream/packages/timeline-core/src/clip-placement.ts "$root/packages/timeline-core/clip-placement.ts"
          cp /tmp/daw-upstream/packages/timeline-core/src/track-routing.ts "$root/packages/timeline-core/track-routing.ts"
          cp /tmp/daw-upstream/packages/shared/src/master-volume.ts "$root/packages/shared/master-volume.ts"
          cp /tmp/daw-upstream/packages/shared/src/track-routing-core.ts "$root/packages/shared/track-routing-core.ts"
          cp /tmp/daw-upstream/packages/shared/src/track-tree.ts "$root/packages/shared/track-tree.ts"
          cp /tmp/daw-upstream/packages/shared/src/clip-color.ts "$root/packages/shared/clip-color.ts"
          cp /tmp/daw-upstream/src/lib/timeline-layout.ts "$root/lib/timeline-layout.ts"
          cp /tmp/daw-upstream/src/lib/timeline-utils.ts "$root/lib/timeline-utils.ts"
          cp /tmp/daw-upstream/src/lib/timeline-track-layout.ts "$root/lib/timeline-track-layout.ts"
          cp /tmp/daw-upstream/src/lib/track-sidebar-mixer.ts "$root/lib/track-sidebar-mixer.ts"
          cp /tmp/daw-upstream/src/lib/track-group-ops.ts "$root/lib/track-group-ops.ts"
          cp /tmp/daw-upstream/src/lib/color.ts "$root/lib/color.ts"
      - name: Build typed runtime compatibility boundary
        run: |
          cat > examples/solid1-daw/src/compat/daw-browser-shared.ts <<'EOF'
          export * from "../upstream/packages/shared/master-volume"
          export * from "../upstream/packages/shared/track-routing-core"
          export * from "../upstream/packages/shared/track-tree"
          export * from "../upstream/packages/shared/clip-color"

          type LocalIdKind = "project" | "track" | "clip" | "asset"

          export const isLocalId = (kind: LocalIdKind, value: string) => value.startsWith(`${kind}:`)

          export function assertDefined<T>(value: T | null | undefined, message: string): T {
            if (value === null || value === undefined) throw new Error(message)
            return value
          }

          export type AutomationInterpolation = "linear" | "hold"
          export type AutomationTargetKind = "track" | "master"
          export type AutomationPoint = {
            id: string
            timeSec: number
            value: number
            interpolation: AutomationInterpolation
          }
          export type AutomationTarget =
            | { kind: "track"; trackId: string; effectInstanceId?: string }
            | { kind: "master"; effectInstanceId?: string }
          export type AutomationEnvelope = {
            id: string
            projectId: string
            target: AutomationTarget
            targetKey: string
            parameterId: string
            enabled: boolean
            points: AutomationPoint[]
            updatedAt: number
          }
          export type AutomationParameterSelection = {
            parameterId: string
            effectInstanceId?: string
          }
          export type AutomationExternalParameter = {
            id: number
            title: string
            unit: string
            readOnly: boolean
            hidden: boolean
          }
          export type AutomationTargetDeviceInstance = {
            id: string
            kind: string
            name?: string
            parameters?: readonly AutomationExternalParameter[]
          }
          export type AutomationTargetParameterOption = AutomationParameterSelection & {
            id: string
            label: string
            group: string
            device: string
          }

          export const AUTOMATION_TARGET_KEY_V2_PREFIX = "automation:v2:"

          export const automationTargetKey = (target: AutomationTarget, parameterId: string): string => (
            `${AUTOMATION_TARGET_KEY_V2_PREFIX}${JSON.stringify([
              target.kind,
              target.kind === "track" ? target.trackId : null,
              target.effectInstanceId ?? null,
              parameterId,
            ])}`
          )

          export const automationEnvelopeValueRange = (
            envelope: AutomationEnvelope | undefined,
            bounds?: { min: number; max: number },
          ): { min: number; max: number } | undefined => {
            if (!envelope || envelope.points.length === 0) return undefined
            let min = Number.POSITIVE_INFINITY
            let max = Number.NEGATIVE_INFINITY
            for (const point of envelope.points) {
              min = Math.min(min, point.value)
              max = Math.max(max, point.value)
            }
            if (!bounds) return { min, max }
            return {
              min: Math.max(bounds.min, Math.min(bounds.max, min)),
              max: Math.max(bounds.min, Math.min(bounds.max, max)),
            }
          }

          export const getAutomationParameterOptionsForTarget = (
            effects: readonly AutomationTargetDeviceInstance[],
            _trackId?: string,
          ): AutomationTargetParameterOption[] => [
            { id: "volume", parameterId: "volume", label: "Volume", group: "Mixer", device: "Mixer" },
            ...effects.flatMap((effect) => {
              if (effect.kind !== "external" || !effect.parameters) return []
              return effect.parameters
                .filter((parameter) => !parameter.hidden)
                .map((parameter) => {
                  const parameterId = `vst3:${effect.id}:${parameter.id}`
                  return {
                    id: parameterId,
                    parameterId,
                    label: parameter.title,
                    group: "VST3",
                    device: effect.name ?? "VST3",
                    effectInstanceId: effect.id,
                  }
                })
            }),
          ]

          export type EqBandType =
            | "lowpass"
            | "highpass"
            | "bandpass"
            | "lowshelf"
            | "highshelf"
            | "peaking"
            | "notch"
            | "allpass"

          export type EqBandParams = {
            id: string
            frequency: number
            gainDb: number
            q: number
            enabled: boolean
            type: EqBandType
          }
          EOF

          cat > examples/solid1-daw/src/compat/timeline-core-types.ts <<'EOF'
          import type { NativeClip } from "../native/model"

          export type TrackId = string
          export type TrackChannelRole = "track" | "return" | "group"

          export type RuntimeClip = NativeClip & {
            color: string
            midi?: { notes: Array<{ pitch: number; beat: number; length: number }> }
            mediaStatus?: "permission-denied" | "missing"
            sourceKind?: string
          }

          export type Clip = RuntimeClip

          export interface TrackSend {
            targetId: TrackId
            amount: number
            tap?: "pre-fx" | "pre-fader" | "post-fader"
          }

          export interface TrackRouting {
            sends: TrackSend[]
            outputTargetId?: TrackId
          }

          export interface Track {
            id: TrackId
            name: string
            kind: "audio" | "instrument" | "return" | "group"
            channelRole: TrackChannelRole
            collapsed?: boolean
            color?: string
            clips: RuntimeClip[]
            groupId?: TrackId
            outputTargetId?: TrackId
            sends?: TrackSend[]
            volume?: number
            muted?: boolean
            soloed?: boolean
            lockedBy?: string
          }
          EOF

          cat > examples/solid1-daw/src/compat/audio-engine.ts <<'EOF'
          export type TrackStereoLevels = {
            left: number
            right: number
          }
          EOF

          cat > examples/solid1-daw/src/compat/useTimelineAutomationController.ts <<'EOF'
          import type { Accessor } from "solid-js"
          import type {
            AutomationEnvelope,
            AutomationParameterSelection,
            AutomationTargetDeviceInstance,
          } from "./daw-browser-shared"
          import type { Track } from "./timeline-core-types"

          export type TimelineWorkspaceAutomationModel = {
            projectId: string
            lanes: {
              visibleByTrackId: Record<string, boolean>
              visibleTargetKeysByTrackId: Record<string, string[]>
              heightsByLaneOwnerKey: Record<string, number>
              masterVisible: boolean
              masterHeight: number
              selectedTargetsByOwnerKey: Record<string, AutomationParameterSelection>
              selectionByTargetKey: Map<string, AutomationParameterSelection>
              effectInstancesByOwnerKey: Record<string, AutomationTargetDeviceInstance[]>
            }
            evaluatedValuesByTargetKey: Accessor<ReadonlyMap<string, number>>
            envelopes: {
              byTargetKey: Map<string, AutomationEnvelope>
              preview: (envelope: AutomationEnvelope | undefined) => void
              commit: (envelope: AutomationEnvelope | undefined, targetKey?: string) => void
              cancelPreview: (targetKey: string) => void
            }
            actions: {
              toggleMasterVisibility: () => void
              toggleTrackVisibility: (trackId: Track["id"]) => void
              addTrackLane: (trackId: Track["id"]) => void
              showTrackLane: (trackId: Track["id"], selection: AutomationParameterSelection) => void
              hideTrackLane: (trackId: Track["id"], targetKey: string) => void
              resizeMasterLane: (height: number) => void
              resizeTrackLane: (trackId: Track["id"], height: number) => void
              selectParameter: (targetKey: string, selection: AutomationParameterSelection) => void
              overrideTarget: (targetKey: string) => void
            }
          }
          EOF

          cat > examples/solid1-daw/src/compat/app-preferences.ts <<'EOF'
          export const TIMELINE_DEFAULT_TRACK_COLOR = "timeline-surface"
          export const TIMELINE_DEFAULT_GROUP_COLOR = "timeline-surface"

          const themeTokens = {
            "clip-audio": "#00a76c",
            "clip-midi": "#0089ed",
            "clip-recording": "#ef4444",
            "clip-selected": "#60a5fa",
            "timeline-background": "#09090b",
            "timeline-surface": "#18181b",
            "timeline-surface-muted": "#27272a",
            "timeline-grid-major": "#3f3f46",
            "timeline-grid-minor": "#27272a",
          } as const

          export function useAppPreferences() {
            return {
              appearance: {
                themeTokens: () => themeTokens,
              },
              timeline: {
                defaultTrackColor: () => TIMELINE_DEFAULT_TRACK_COLOR,
                defaultTrackColorInput: () => themeTokens["timeline-surface"],
                defaultGroupColor: () => TIMELINE_DEFAULT_GROUP_COLOR,
                defaultGroupColorInput: () => themeTokens["timeline-surface"],
              },
            }
          }
          EOF

          cat > examples/solid1-daw/src/compat/clip-color.ts <<'EOF'
          import type { RuntimeClip } from "./timeline-core-types"

          export type ClipVisualColors = {
            backgroundColor: string
            borderColor: string
            opacity?: number
          }

          export const getDefaultClipColor = (clip: Pick<RuntimeClip, "sourceKind" | "midi">) => {
            if (clip.sourceKind === "recording") return "clip-recording"
            return clip.midi ? "clip-midi" : "clip-audio"
          }

          export const trackColorForClip = (color: string | undefined) =>
            color && /^#(?:[0-9a-fA-F]{3}|[0-9a-fA-F]{6})$/.test(color) ? color : undefined

          export function resolveClipColor(
            color: string | undefined,
            tokens: Readonly<Record<string, string>>,
          ): string {
            if (color === "clip-audio") return tokens["clip-audio"] ?? "#00a76c"
            if (color === "clip-midi") return tokens["clip-midi"] ?? "#0089ed"
            if (color === "clip-recording") return tokens["clip-recording"] ?? "#ef4444"
            return color ?? tokens["clip-audio"] ?? "#00a76c"
          }

          export function createClipVisualColors(
            color: string,
            selected: boolean,
            ghost: boolean,
          ): ClipVisualColors {
            const visual: ClipVisualColors = {
              backgroundColor: color,
              borderColor: selected ? "#60a5fa" : color,
            }
            if (ghost) visual.opacity = 0.65
            return visual
          }
          EOF
      - name: Point source imports at exact modules
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          tsconfig_path = Path("examples/solid1-daw/tsconfig.json")
          config = json.loads(tsconfig_path.read_text())
          paths = config["compilerOptions"]["paths"]
          paths["@daw-browser/audio-engine/audio-engine"] = ["src/compat/audio-engine.ts"]
          paths["@daw-browser/timeline-core/clip-placement"] = ["src/upstream/packages/timeline-core/clip-placement.ts"]
          paths["@daw-browser/timeline-core/track-routing"] = ["src/upstream/packages/timeline-core/track-routing.ts"]
          paths["~/hooks/useTimelineAutomationController"] = ["src/compat/useTimelineAutomationController.ts"]
          paths["~/lib/color"] = ["src/upstream/lib/color.ts"]
          paths["~/lib/preferences/app-preferences"] = ["src/compat/app-preferences.ts"]
          paths["~/lib/timeline-layout"] = ["src/upstream/lib/timeline-layout.ts"]
          paths["~/lib/timeline-track-layout"] = ["src/upstream/lib/timeline-track-layout.ts"]
          paths["~/lib/timeline-utils"] = ["src/upstream/lib/timeline-utils.ts"]
          paths["~/lib/track-group-ops"] = ["src/upstream/lib/track-group-ops.ts"]
          paths["~/lib/track-sidebar-mixer"] = ["src/upstream/lib/track-sidebar-mixer.ts"]
          tsconfig_path.write_text(json.dumps(config, indent=2) + "\n")

          alias_path = Path("examples/solid1-daw/kobalte-native-aliases.ts")
          text = alias_path.read_text()
          text = text.replace(
            'function compat(file: string): string {\n  return fileURLToPath(new URL(file, compatRoot))\n}\n',
            'function compat(file: string): string {\n  return fileURLToPath(new URL(file, compatRoot))\n}\n\nfunction upstream(file: string): string {\n  return fileURLToPath(new URL(file, upstreamRoot))\n}\n',
          )
          text = text.replace(
            '  { find: /^@daw-browser\\/shared$/, replacement: compat("daw-browser-shared.ts") },\n',
            '  { find: /^@daw-browser\\/shared$/, replacement: compat("daw-browser-shared.ts") },\n'
            '  { find: /^@daw-browser\\/audio-engine\\/audio-engine$/, replacement: compat("audio-engine.ts") },\n'
            '  { find: /^@daw-browser\\/timeline-core\\/clip-placement$/, replacement: upstream("packages/timeline-core/clip-placement.ts") },\n'
            '  { find: /^@daw-browser\\/timeline-core\\/track-routing$/, replacement: upstream("packages/timeline-core/track-routing.ts") },\n',
          )
          text = text.replace(
            '  { find: /^~\\/hooks\\/useTransportTempoController$/, replacement: compat("useTransportTempoController.ts") },\n',
            '  { find: /^~\\/hooks\\/useTransportTempoController$/, replacement: compat("useTransportTempoController.ts") },\n'
            '  { find: /^~\\/hooks\\/useTimelineAutomationController$/, replacement: compat("useTimelineAutomationController.ts") },\n',
          )
          text = text.replace(
            '  { find: /^~\\/lib\\/clip-color$/, replacement: compat("clip-color.ts") },\n',
            '  { find: /^~\\/lib\\/clip-color$/, replacement: compat("clip-color.ts") },\n'
            '  { find: /^~\\/lib\\/color$/, replacement: upstream("lib/color.ts") },\n'
            '  { find: /^~\\/lib\\/preferences\\/app-preferences$/, replacement: compat("app-preferences.ts") },\n'
            '  { find: /^~\\/lib\\/timeline-layout$/, replacement: upstream("lib/timeline-layout.ts") },\n'
            '  { find: /^~\\/lib\\/track-group-ops$/, replacement: upstream("lib/track-group-ops.ts") },\n'
            '  { find: /^~\\/lib\\/track-sidebar-mixer$/, replacement: upstream("lib/track-sidebar-mixer.ts") },\n',
          )
          text = text.replace(
            '  { find: /^~\\/lib\\/timeline-track-layout$/, replacement: compat("timeline-track-layout.ts") },\n',
            '  { find: /^~\\/lib\\/timeline-track-layout$/, replacement: upstream("lib/timeline-track-layout.ts") },\n',
          )
          text = text.replace(
            '  { find: /^~\\/lib\\/timeline-utils$/, replacement: compat("timeline-utils.ts") },\n',
            '  { find: /^~\\/lib\\/timeline-utils$/, replacement: upstream("lib/timeline-utils.ts") },\n',
          )
          alias_path.write_text(text)
          PY
      - name: Extend DAW source lock
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("examples/solid1-daw/scripts/check-upstream-source-parity.mjs")
          text = path.read_text()
          marker = 'const copiedSources = [\n'
          additions = '''  ["src/upstream/packages/timeline-core/clip-placement.ts", "packages/timeline-core/src/clip-placement.ts", "28cc2d615614d72eae44e8f2645624c36e2c8104"],
            ["src/upstream/packages/timeline-core/track-routing.ts", "packages/timeline-core/src/track-routing.ts", "c37e51f5f1181c335d17d3be794b26f5db1f4a4d"],
            ["src/upstream/packages/shared/master-volume.ts", "packages/shared/src/master-volume.ts", "e461e8bddab32adffda433d022765d3ba9fd0097"],
            ["src/upstream/packages/shared/track-routing-core.ts", "packages/shared/src/track-routing-core.ts", "4fa18be3524d717273d461e56e3e3cc2e7c5235d"],
            ["src/upstream/packages/shared/track-tree.ts", "packages/shared/src/track-tree.ts", "f8d26ad60564d8260deb3d1adbdd17c0c29c3380"],
            ["src/upstream/packages/shared/clip-color.ts", "packages/shared/src/clip-color.ts", "a5b4812bfc201b2f5ffc01c70f2b317de3418a19"],
            ["src/upstream/lib/timeline-layout.ts", "src/lib/timeline-layout.ts", "79f9876245fbb5b357778f5d40974803d338663c"],
            ["src/upstream/lib/timeline-utils.ts", "src/lib/timeline-utils.ts", "4ddf52866d6f616ffe6b9da2e8c1362dfe9dad39"],
            ["src/upstream/lib/timeline-track-layout.ts", "src/lib/timeline-track-layout.ts", "564cbf63fb3e2cffbb6211cbf207a4d4ba45f4b4"],
            ["src/upstream/lib/track-sidebar-mixer.ts", "src/lib/track-sidebar-mixer.ts", "6839a4b5a9b18b3c01df4d11b3370f8470085758"],
            ["src/upstream/lib/track-group-ops.ts", "src/lib/track-group-ops.ts", "f972910d0db21776a3b3948fee87f12b6c16bba7"],
            ["src/upstream/lib/color.ts", "src/lib/color.ts", "45aeae66c920ae4aecc7241a396cb054c0ec027b"],
          '''
          if 'src/upstream/lib/timeline-layout.ts' not in text:
            text = text.replace(marker, marker + additions)
          path.write_text(text)
          PY
      - name: Validate source and types
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          cd packages/solid1
          bun install --no-save
          bun run build
          cd ../../examples/solid1-daw
          bun install --no-save
          bun run source:check
          bun run generate:styles
          bunx tsc --noEmit
      - name: Commit validated contracts
        run: |
          set -euo pipefail
          rm -f .github/workflows/diagnose-daw-compat.yml .github/workflows/apply-daw-sidebar-contracts.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "refactor: source-lock DAW sidebar contracts"
          git push origin HEAD:fix/source-first-example-fidelity
