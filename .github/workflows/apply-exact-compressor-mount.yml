name: Apply exact Compressor mount

on:
  push:
    branches:
      - fix/source-first-example-fidelity
    paths:
      - ".github/apply-exact-compressor-mount.py"
      - ".github/workflows/apply-exact-compressor-mount.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/source-first-example-fidelity
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Install GPUI Linux runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfontconfig-dev \
            libwayland-dev \
            libxkbcommon-x11-dev \
            libx11-xcb-dev \
            libssl-dev \
            libzstd-dev \
            libvulkan1 \
            vulkan-validationlayers
      - name: Apply exact Compressor mount
        run: python3 .github/apply-exact-compressor-mount.py
      - run: bun install --frozen-lockfile
      - name: Validate exact visible Compressor
        shell: bash
        run: |
          set -euo pipefail
          bun run lint
          bun run typecheck
          bun run test
          bun run build
          bun run solid1:package
          bun run solid1:daw
          git diff --check
          grep -q 'import Compressor from "~/components/effects/Compressor"' examples/solid1-daw/src/native/EffectsPanel.tsx
          if grep -q 'compressor-threshold-plus' examples/solid1-daw/src/native/EffectsPanel.tsx; then
            echo "handmade Compressor +/- control remains" >&2
            exit 1
          fi
          if grep -q -- '-3.8 dB' examples/solid1-daw/src/native/EffectsPanel.tsx; then
            echo "invented Compressor meter value remains" >&2
            exit 1
          fi
      - name: Commit validated exact mount and remove scaffolding
        run: |
          rm -f .github/apply-exact-compressor-mount.py
          rm -f .github/workflows/apply-exact-compressor-mount.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: mount exact DAW Compressor"
          git push origin HEAD:fix/source-first-example-fidelity
